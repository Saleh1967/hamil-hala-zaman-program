name: القياس الكامل على المجمَّد

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: تشغيل المحرّك الجبري
    runs-on: ubuntu-latest
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت الاعتماديات
        run: python -m pip install --upgrade pip numpy

      - name: البوّابة بالبصمة — المجمَّد المودَع أوّلًا، ولا قياس على بديلٍ صامت
        env:
          MUJAMMAD_URL: ${{ vars.MUJAMMAD_URL }}
        run: |
          set -u
          # البصمة تُقرأ من المحرّك نفسه: مصدرٌ واحدٌ للحقيقة، لا نسخةٌ ثانيةٌ تتخلّف.
          SHA="$(python - <<'PY'
          import re, pathlib
          src = pathlib.Path("algebra_engine.py").read_text(encoding="utf-8")
          print(re.search(r'MUJAMMAD_SHA256\s*=\s*"([0-9a-f]{64})"', src).group(1))
          PY
          )"
          echo "البصمة المعلنة: $SHA"

          # ١) المودَع في الشجرة — البايتات حاضرةٌ فلا مرآةَ ولا متغيّرَ سرّيّ.
          if [ -f mujammad.txt ]; then
            GOT="$(sha256sum mujammad.txt | cut -d' ' -f1)"
            if [ "$GOT" = "$SHA" ]; then
              echo "المجمَّد مودَعٌ في الشجرة وبصمتُه مطابقة ✓"
              exit 0
            fi
            echo "::error::المودَع خالف بصمته ($GOT) — ليس المجمَّد"
            exit 1
          fi

          # ٢) مسارٌ احتياطيٌّ موسوم لمن استنسخ بلا بايتات (استنساخٌ ناقص أو سحبٌ جزئيّ).
          echo "::warning::المجمَّد غيرُ مودَعٍ في الشجرة — المسار الاحتياطيّ الموسوم"
          GQ='https://raw.githubusercontent.com/globalquran/data/master/Quran/quran-simple-enhanced.txt'
          TANZIL='https://tanzil.net/pub/download/index.php?quranType=simple-enhanced&outType=txt-2&agree=true'
          for URL in "${MUJAMMAD_URL:-}" "$GQ" "$TANZIL"; do
            [ -n "$URL" ] || continue
            echo "محاولة الإحضار من مصدرٍ معلن…"
            if curl -fsSL --max-time 120 --retry 3 --retry-delay 5 -o mujammad.candidate "$URL"; then
              GOT="$(sha256sum mujammad.candidate | cut -d' ' -f1)"
              if [ "$GOT" = "$SHA" ]; then
                mv mujammad.candidate mujammad.txt
                echo "المجمَّد حاضرٌ بالبصمة ✓"
                break
              fi
              echo "::error::بصمةٌ مخالفة ($GOT) — ليس المجمَّد، ولا قياس على بديلٍ صامت"
              rm -f mujammad.candidate
              exit 1
            fi
            echo "::warning::تعذّر الوصول إلى هذا المصدر"
          done
          if [ ! -f mujammad.txt ]; then
            echo "::warning::المجمَّد غائبٌ عن كلّ مصدرٍ معلن — القياس مؤجَّلٌ باسمه، والتدقيق البنيويّ يجري كاملًا"
          fi

      - name: تشغيل المحرّك — التدقيق البنيويّ والقياس
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python algebra_engine.py | tee measurement.txt

      - name: البوّابة الثانية — نسخة المجمَّد في induction/ بالبصمة نفسها
        if: hashFiles('mujammad.txt') != ''
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          A="$(sha256sum mujammad.txt | cut -d' ' -f1)"
          B="$(sha256sum induction/mujammad.txt | cut -d' ' -f1)"
          if [ "$A" != "$B" ]; then
            echo "::error::نسخة induction/ خالفت المجمَّد ($B ≠ $A) — لا قياس على بايتاتٍ متخلّفة"
            exit 1
          fi
          echo "نسختا المجمَّد متطابقتان ✓ ($A)"

      - name: مصادمة الاستقراء — results.json مُعاد الإنتاج حرفيًّا
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python induction/induction_engine.py --json=/tmp/induction.json --require-corpus \
            | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("induction/results.json", encoding="utf-8"))
          b = json.load(open("/tmp/induction.json", encoding="utf-8"))
          if a != b:
              print("::error::results.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("results.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: شهودُ الخارج — بايتاتُ OpenITI بختمها الثلاثيّ قبل سجلِّ الأختام
        run: |
          set -euo pipefail
          # وديعتان لا تُقاسان على المجمَّد بل على بايتاتِ شهودٍ من OpenITI ليسوا في
          # الشجرة (corpora/sources/ مستثناةٌ في .gitignore): sources_census.json
          # وmanhaj_v0.json. فتُجلَب بايتاتُهم هنا **قبل خطوة سجلِّ الأختام**، لأنّ
          # regen_all يعيد تشغيل كلِّ مولِّدٍ فيسقط مولِّدُهما بالمخرج 3 معلنًا الغيابَ
          # باسمه — لا يقيس على الحاضرين صامتًا. والقائمتان تُقرآن من موضعيهما
          # (CENSUS وWITNESSES) لا تُنسَخان هنا، فلا يشيخ هذا السطرُ إن زِيد شاهد.
          python - <<'PY' > /tmp/outer_ids.txt
          import sources_census, manhaj_gate
          print("\n".join(dict.fromkeys(list(sources_census.CENSUS)
                                         + list(manhaj_gate.WITNESSES))))
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            bash fetch_source.sh --fetch "$id"
          done < /tmp/outer_ids.txt

      - name: سجلُّ الأختام الحيّة — كلُّ وديعةٍ وكلُّ ختمٍ يُعاد توليدُه ويُصادَم
        run: |
          set -euo pipefail          # بلا pipefail كان `| tee` يبتلع سقوطَ السجلِّ ويُخضِر الخطوة
          # لا رقمَ إلا بمولِّدٍ يُشغَّل: regen_all يعيد توليدَ الودائع السبع كلِّها، ثمّ يقرأ
          # كلَّ ختمٍ **من المخرَج الطازج لا من الوديعة** ويصادمُه. الختمُ الذي تغيّر رقمُه
          # يُسقط الـCI ويستلزم تعديلًا معلنًا في induction/seals.py بفاتورةٍ في رسالة الالتزام،
          # والمسارُ المفقودُ يُسقطه ولو كان الختمُ [شاهدًا] — فالعرضُ ليس إعفاءً من التوليد.
          # ومعها حارسان وُلدا من عطلين مرصودين:
          #   coverage()  — كلُّ وديعةِ JSON في الشجرة مبوَّبةٌ، وأيُّ يتيمٍ جديدٍ يسقط من
          #                 لحظة ولادته (عاشت وديعتان خارج كلِّ بوّابةٍ فتعفّنتا صامتتين).
          #   contracts() — لا وديعةَ بلا ختمِ [بوّابة]، ولا دعوى نموذجٍ بلا Δ يُقرأ من
          #                 مولِّدها ويُشتقّ الحكمُ من إشارته (CONTRIBUTING.md §٢).
          python induction/seals.py --json /tmp/seals.json | tee -a measurement.txt
          # ووديعةُ السجلِّ نفسِها تُصادَم: الحارسُ الذي لا يودِع مخرَجَه لا يُصادَم،
          # فيبقى نجاحُه دعوى طباعةٍ تُقرأ بالعين (العقدُ من PR #10، وهذا موضعُه الواحد).
          python - <<'PY'
          import json, sys
          a = json.load(open("induction/seals.json", encoding="utf-8"))
          b = json.load(open("/tmp/seals.json", encoding="utf-8"))
          if a != b:
              print("::error::seals.json المودَع خالف ما يُنتجه السجلّ — صريخ")
              sys.exit(1)
          R = b["سجلُّ_الأختام"]
          if R["أختامٌ_بلا_مولِّد"]:
              print(f"::error::أختامٌ بلا مولِّدٍ حيّ: {R['أختامٌ_بلا_مولِّد']} — صريخ")
              sys.exit(1)
          if R["ودائعُ_خالفت"] or R["أختامٌ_انحرفت"]:
              print(f"::error::انحرافٌ: {R['ودائعُ_خالفت']} · {R['أختامٌ_انحرفت']} — صريخ")
              sys.exit(1)
          if not all(t["مرفوضة"] for t in R["اختبارُ_التكذيب"]):
              print("::error::سجلُّ الأختام لا يستطيع أن يرفض — حارسٌ أعمى — صريخ")
              sys.exit(1)
          # وعاءُ [مكتشَف]: قياسٌ من مصدرٍ غيرِ مختومٍ يُرجِّح ولا يحكم. والحارسُ ههنا يقرأ
          # **الوديعةَ المولَّدة** لا النصَّ: أيُّ مكتشَفٍ فقد وسمَه أو ادّعى صنفَ بوّابةٍ يُسقط
          # الخطوة. والسجلُّ فارغٌ اليوم بإعلانٍ، فالمفحوصُ بنيتُه — ولا يُسكَت عن انزلاقه.
          disc = R["مكتشَفات"]
          bad = [d["اسم"] for d in disc
                 if d["صنف"] != "[مكتشَف]" or d["وسم"] != "غير مختوم"]
          if bad:
              print(f"::error::مكتشَفٌ فقد وسمَه أو ادّعى صنفًا حاكمًا: {bad} — صريخ")
              sys.exit(1)
          if R["سجلُّ_الترشيح"]["الكلّ"] != len(disc):
              print("::error::سجلُّ الترشيح يخالف عددَ المكتشَفات — صريخ")
              sys.exit(1)
          print(f"أختامٌ حيّةٌ مصادَمة: {R['بوّابات']} بوّابةً · {R['شواهد']} شاهدًا "
                f"· {len(disc)} مكتشَفًا خارجَ الحكم ✓")
          PY

      - name: ورقةُ التدقيق الخارجي — AUDIT-SEALS.md مولَّدةٌ لا محرَّرةٌ بيد
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          # الورقةُ المرسَلة إلى التدقيق تُولَّد من سجلّ الأختام نفسِه، فلا تتخلّف عن الشجرة.
          python induction/seals.py --audit /tmp/AUDIT-SEALS.md
          diff -u AUDIT-SEALS.md /tmp/AUDIT-SEALS.md \
            || { echo "::error::AUDIT-SEALS.md تخلّفت عن سجلّ الأختام — أعِد توليدَها"; exit 1; }
          echo "ورقةُ التدقيق مُعادةُ التوليد بفارق صفر ✓" | tee -a measurement.txt

      - name: مُصدِّرُ أختام البوّابة بإزاحاتها — نافذةٌ للبانِي لا نسخةٌ ثانية
        run: |
          set -euo pipefail
          # يُصدَّر موضعُ الرقم لا الرقمُ وحدَه: الملفُّ والسطرُ والإزاحةُ البايتيةُ وبصمةُ
          # الوديعة — فيقرأ البانِي في المستودع الآخر الأصلَ من موضعه ولا تتخلّف نسخةٌ ثانية.
          # والإزاحاتُ مشتقّةٌ بـast من قائمة SEALS نفسِها: زيادةُ ختمٍ أو إزاحةُ سطرٍ تُحرّكها
          # معها، واختلافُ الاسم عن موضعه يُسقط الخطوةَ بالمخرج 8، ومخالفةُ وديعةٍ بالمخرج 9.
          python induction/export_seals.py --json /tmp/gate_seals.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/gate_seals.json", encoding="utf-8"))
          bad = [g["اسم"] for g in d["أختام_البوّابة"] if g["مصادمة_الوديعة"] != "فارقٌ صفر"]
          assert not bad, bad
          # ولا يُصدَّر [مكتشَف] البتّة: المستهلكُ خارجَ الشجرة يقرأ المصدَّرَ سندًا، والمكتشَفُ
          # قياسٌ من بايتاتٍ قد تنزاح. فالمنعُ مُصادَمٌ ههنا لا موعودٌ في تعليق.
          assert d["العدّ"]["[مكتشَف]"]["مصدَّرٌ"] is False, "مكتشَفٌ يُدَّعى مصدَّرًا"
          assert not any(g["صنف"] == "[مكتشَف]" for g in d["أختام_البوّابة"]), "مكتشَفٌ صُدِّر"
          print(f"صُدِّر {len(d['أختام_البوّابة'])} ختمَ بوّابةٍ بإزاحاتها "
                f"و{len(d['الفواتير'])} فاتورةً بأحكامها المشتقّة ✓")
          PY

      - name: مصادمة الأوزان — awzan_v0.json مُعاد الإنتاج حرفيًّا
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python awzan_engine.py --json /tmp/awzan.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("awzan_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/awzan.json", encoding="utf-8"))
          if a != b:
              print("::error::awzan_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("awzan_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: مصادمة المعجم — dictionary_v0.json مُعاد الإنتاج حرفيًّا
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python dictionary_engine.py --json /tmp/dictionary.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("dictionary_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/dictionary.json", encoding="utf-8"))
          if a != b:
              print("::error::dictionary_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("dictionary_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: طبقة الإثراء — جدول المقاييس بالبصمة، ومصادمة maqayis_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          if ./fetch_maqayis.sh; then
            python maqayis_layer.py --json /tmp/maqayis.json | tee -a measurement.txt
            python - <<'PY'
          import json, sys
          a = json.load(open("maqayis_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/maqayis.json", encoding="utf-8"))
          if a != b:
              print("::error::maqayis_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("maqayis_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY
          else
            echo "::warning::جدول المقاييس غائبٌ عن كلّ مصدرٍ معلن — الإثراء مؤجَّلٌ باسمه، ولا إثراء على بديلٍ صامت"
            python maqayis_layer.py | tee -a measurement.txt
          fi

      - name: المرحلة ٢ — ختمُ العثماني، ومصادمة waqf_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          ./fetch_uthmani.sh
          SHA="$(sed -n 's/^UTHMANI_SHA256 = "\([0-9a-f]\{64\}\)".*/\1/p' waqf_layer.py | head -n 1)"
          GOT="$(sha256sum uthmani.txt | cut -d' ' -f1)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::العثمانيّ المودَع خالف بصمته ($GOT) — لا قياس حدودٍ على بديلٍ صامت"
            exit 1
          fi
          echo "النسخة العثمانية بالبصمة ✓ ($SHA)"
          python waqf_layer.py --json /tmp/waqf.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("waqf_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/waqf.json", encoding="utf-8"))
          if a != b:
              print("::error::waqf_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("waqf_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: دفعةُ الحركات — الحارسان والوقف/الوصل، ومصادمة harakat_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python harakat_layer.py --json /tmp/harakat.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("harakat_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/harakat.json", encoding="utf-8"))
          if a != b:
              print("::error::harakat_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("harakat_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: الحقل 112 — قوانينُ الدفعة مقيسةً بتقسيمنا، ومصادمة field112_laws.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python field112_laws.py --json /tmp/field112.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("field112_laws.json", encoding="utf-8"))
          b = json.load(open("/tmp/field112.json", encoding="utf-8"))
          if a != b:
              print("::error::field112_laws.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("field112_laws.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: الإعلال — سترلنج بحارس ثوابته وحارسا التيار، ومصادمة i3lal_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python i3lal_layer.py --json /tmp/i3lal.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("i3lal_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/i3lal.json", encoding="utf-8"))
          if a != b:
              print("::error::i3lal_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("i3lal_v0.json مُعاد الإنتاج بفارق صفر ✓")
          G = a["الإعلال_v0"]["constants_guard"]
          if G["governing_formula"] != "log₂S(n,3)" or not G["convention"]:
              print("::error::حارسُ الثوابت بلا اتفاقيةٍ معلنة — صريخ")
              sys.exit(1)
          if not all(c["holds"] for c in G["checks"]) or not G["quartets_distinct"]:
              print("::error::رباعيُّ أَسِرَّةٍ خالف صيغتَه المعلنة — صريخ")
              sys.exit(1)
          if G["batch_quartet"] != [254, 50, 45, 335] \
             or G["batch_quartet_formula"] != "⌊log₂(3ⁿ/4)⌋":
              print("::error::رباعيُّ الدفعة قُرئ بغير صيغته — صيغتان صامتتان: صريخ")
              sys.exit(1)
          print("حارسُ الثوابت: اتفاقيةٌ واحدةٌ معلنة وكلُّ سريرٍ موسومٌ بصيغته ✓")
          PY

      - name: الإسناد — صفَّا «أنيت» والتاء والشرطُ المصحَّح، ومصادمة isnad_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python isnad_layer.py --json /tmp/isnad.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("isnad_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/isnad.json", encoding="utf-8"))
          if a != b:
              print("::error::isnad_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("isnad_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الإسناد_v0"]
          C = R["corrected_condition"]
          if C["matched"] != C["suffixed_excluded"] + C["bare"] \
             or C["bare"] != C["nounish_excluded"] + C["read"]:
              print("::error::مصالحةُ الشرط المصحَّح خُولفت — صريخ")
              sys.exit(1)
          if R["ta_row"]["status"] != "وسمُ وضعٍ لا قانون":
              print("::error::صفُّ التاء قُرئ قانونًا لا وسمَ وضعٍ — صريخ")
              sys.exit(1)
          print("مصالحةُ الشرط محروسة، وصفُّ التاء وسمُ وضعٍ بالاسم ✓")
          PY

      - name: بوّابةُ الجرّ — الأبوابُ المُحياةُ والحدُّ المختوم، ومصادمة jar_gate.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python jar_gate.py --json /tmp/jar_gate.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("jar_gate.json", encoding="utf-8"))
          b = json.load(open("/tmp/jar_gate.json", encoding="utf-8"))
          if a != b:
              print("::error::jar_gate.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("jar_gate.json مُعاد الإنتاج بفارق صفر ✓")
          S = a["بوابة_الجر"]["الشرط"]
          # لا بابَ ميّتًا بعد اليوم: كلُّ مفسّرٍ معلنٍ يُعَدّ مستقلًّا، وصفرُه يعني كودًا ميّتًا.
          dead = [k for k, n in S["gates_alone"].items() if n == 0]
          missing = [k for k in ("جار-ملتصق", "جار-ملتصق(كاف-مفتوحة)", "حرف-جر-سابق", "إضافة",
                                 "إضافة-مشتبهة", "تابع-معطوف", "تابع-غير-معطوف",
                                 "ضمير-متصل", "ممنوع-من-الصرف",
                                 "تابع-لمقصور (جرٌّ مقدَّر)",
                                 "تابع-لمجرورٍ-بالياء (مثنى/ج.م.سالم)",
                                 "تابع-معطوف-بمنفصل",
                                 "تابع-عابرٌ-لحدّ-الآية") if k not in S["gates_alone"]]
          if dead or missing:
              print(f"::error::أبوابٌ ميتةٌ عادت ({dead + missing}) — صريخ")
              sys.exit(1)
          if sum(S["causes"].values()) != S["jar_positions"]:
              print("::error::مصالحةُ البسط خُولفت — صريخ")
              sys.exit(1)
          if sum(S["residue_kinds"].values()) != S["unexplained"]:
              print("::error::أجناسُ المتبقّي لا تُصالِح عدَّ السقوط — صريخ")
              sys.exit(1)
          # حكمُ التسجيل المسبق يُعرَض بنصّه ولا يُخفى — والسقوطُ المسمّى نتيجةٌ تُودَع.
          print(f"حكمُ التسجيل المسبق للجولة الثالثة: {S['preregistration']}")
          print(f"حكمُ التسجيل المسبق للجولة الرابعة: {S['preregistration_r4']}")
          # §٨ لا يُرفَع بمقامٍ أُعلن بعده: حكمُ الثالثة محسوبٌ على الخام ويبقى ساقطًا.
          if not S["preregistration"].startswith("سقط"):
              print("::error::حكمُ الجولة الثالثة رُفع عن سقوطه — صريخ")
              sys.exit(1)
          if S["narrowed_candidate"] + S["not_jarr_material"] != S["raw_positions"]:
              print("::error::مصالحةُ التضييق خُولفت (مضيَّق + مطروح ≠ خام) — صريخ")
              sys.exit(1)
          if S["excluded_explained"] + S["excluded_unexplained"] != S["not_jarr_material"] \
             or S["unexplained"] + S["excluded_unexplained"] != S["raw_unexplained"]:
              print("::error::مصالحةُ صنفَي المطروح خُولفت — صريخ")
              sys.exit(1)
          # شرطُ النزاهة المسجَّل: اتفاقيةُ التضييق لا تكون مفصَّلةً على العتبة.
          if S["excluded_explained"] < 0.25 * S["not_jarr_material"]:
              print("::error::المطروحُ الذي كان مفسَّرًا < 25% — اتفاقيةٌ مفصَّلةٌ على العتبة — صريخ")
              sys.exit(1)
          print(f"حكمُ التسجيل المسبق للجولة الخامسة: {S['preregistration_r5']}")
          # الأحكامُ المجمَّدة لا تتبدّل بجولةٍ تالية — الحكمُ يُختَم يومَ صدوره بأرقامه.
          if "656" not in S["preregistration"] or "1,065" not in S["preregistration"]:
              print("::error::حكمُ §٨ المجمَّد تبدّلت أرقامُه — إعادةُ كتابةٍ للتاريخ — صريخ")
              sys.exit(1)
          if "506" not in S["preregistration_r4"] or "538" not in S["preregistration_r4"]:
              print("::error::حكمُ §٩ المجمَّد تبدّلت أرقامُه — صريخ")
              sys.exit(1)
          # كاشفُ كسر الوصل لا يكون مفصَّلًا على المتبقّي: نسبةُ «كان مفسَّرًا» فيه ≥ 40%.
          if S["wasl_kasra"] and S["wasl_kasra_explained"] < 0.40 * S["wasl_kasra"]:
              print("::error::كاشفُ كسر الوصل مفصَّلٌ على المتبقّي (< 40%) — صريخ")
              sys.exit(1)
          print(f"حكمُ التسجيل المسبق للجولة السادسة: {S['preregistration_r6']}")
          if "319" not in S["preregistration_r5"] or "384" not in S["preregistration_r5"]:
              print("::error::حكمُ §١٠ المجمَّد تبدّلت أرقامُه — صريخ")
              sys.exit(1)
          # الجولةُ السادسة منعت المِقَصَّ **على نفسها**، لا على ما بعدها. فحارسُها الحيُّ
          # (المطروحُ = 709) رُفع في الجولة السابعة **معلنًا** لأنّها تطرح جنسًا سابعًا
          # بحقٍّ مسجَّل؛ ومحلُّه حارسُ النصّ المجمَّد أدناه: رقمُ 709 محفوظٌ في حكم §١١
          # فلا يضيع. ورفعُ حارسٍ يُكتَب ولا يُسكَت عنه.
          if "709" not in S["preregistration_r6"] or "325" not in S["preregistration_r6"]:
              print("::error::حكمُ §١١ المجمَّد تبدّلت أرقامُه — صريخ")
              sys.exit(1)
          # كلفةُ الإصلاح ⓪ رقمٌ مسجَّلٌ مسبقًا: تبدُّلُها صامتةً يُخفي مسًّا بالمحمول.
          if S["repair_cost_r7"] != 26:
              print("::error::كلفةُ إصلاح is_majrur تبدّلت عن 26 — صريخ")
              sys.exit(1)
          if S["nida_mudaf"] and S["nida_mudaf_explained"] < 0.50 * S["nida_mudaf"]:
              print("::error::طرحُ المنادى المضاف مفصَّلٌ على المتبقّي (< 50%) — صريخ")
              sys.exit(1)
          print(f"حكمُ التسجيل المسبق للجولة السابعة: {S['preregistration_r7']}")
          if S["residue_kinds"].get("غيرُ ذلك", 0) >= 25:
              print("::error::«غيرُ ذلك» في المتبقّي ≥ 25 — تبويبٌ ناقص — صريخ")
              sys.exit(1)
          # ═══ تفويضُ صاحب المستودع: القناةُ محروسةٌ بنفسها ═════════════════════════
          # التفويضُ قُبل قناةً لا يدًا، فالقناةُ تُحرَس: رفعٌ بلا قيدٍ في السجلّ رفعٌ صامت،
          # ورفعٌ بلا بديلٍ مصرَّحٍ به رفعٌ أعمى، وكلاهما يُبطِل معنى الحارس.
          if not S.get("delegation"):
              print("::error::نصُّ التفويض غائبٌ عن الوديعة — رفعٌ بلا سند — صريخ")
              sys.exit(1)
          for g in S["lifted_guards"]:
              if not g.get("البديل") or not g.get("بتفويض"):
                  print(f"::error::حارسٌ رُفع بلا بديلٍ أو بلا مفوِّضٍ مسمًّى: {g} — صريخ")
                  sys.exit(1)
          print(f"حرّاسٌ مرفوعةٌ بالسجلّ: {len(S['lifted_guards'])} "
                f"({' | '.join(g['الحارس'] for g in S['lifted_guards'])})")
          # حدُّ التفويض: حارسُ السياسة يُرفَع، وحارسُ التاريخ لا. فالحكمُ المختومُ الساقط
          # يبقى ساقطًا مهما رُفع من حرّاس — ورفعُه محوُ قياسٍ لا رفعُ حارس.
          for key in ("preregistration", "preregistration_r5",
                      "preregistration_r6", "preregistration_r7"):
              if not S[key].startswith("سقط"):
                  print(f"::error::حكمٌ مختومٌ ساقطٌ انقلب إلى صمود ({key}) — "
                        "هذا محوُ قياسٍ لا رفعُ حارس — صريخ")
                  sys.exit(1)
          # عيبُ الخانة (ثلاثُ جولاتٍ سقطت بالتوقيع لا بالكود): كلُّ فاصلٍ يسمّي مقياسه.
          for b in S["signed_bounds"]:
              if not b.get("المقياس"):
                  print(f"::error::فاصلٌ موقَّعٌ بلا مقياسٍ مسمًّى: {b} — صريخ")
                  sys.exit(1)
          print(f"فواصلُ موقَّعةٌ بمقاييسها: {len(S['signed_bounds'])} ✓")
          print("الأبوابُ الثلاثةَ عشرَ حيّةٌ معدودةٌ مستقلّةً، والبسطان والمتبقّي مُصالَحةٌ ✓")
          PY

      - name: بابُ العلامة والمعتلّ — فكُّ الشدة وجردُ السكونات، ومصادمة alama_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python alama_layer.py --json /tmp/alama_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("alama_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/alama_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::alama_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("alama_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["العلامة_v0"]
          # ① كلُّ محاولةِ تكذيبٍ تُرَدّ — ونجاحُ واحدةٍ يُسقِط الباب.
          broke = [t["محاولة"] for t in R["محاولاتُ_التكذيب"] if t["نجحت"]]
          if broke:
              print(f"::error::محاولةُ تكذيبٍ نجحت في باب العلامة: {broke} — صريخ")
              sys.exit(1)
          # ② مصالحةُ تفكيك العريّ: لا موضعَ يُعَدّ مرّتين ولا موضعَ يسقط بين الأصناف.
          t = R["تفكيكُ_العري"]
          if sum(t["أصناف"].values()) != t["خاتمةٌ_عارية"]:
              print("::error::أصنافُ الخاتمة العارية لا تُصالِح مجموعَها — صريخ")
              sys.exit(1)
          # ③ فكُّ الشدة لا يضيّع موضعًا: الصامتُ + العابرُ = الشدّاتُ كلُّها.
          f, inv = R["فكُّ_الشدة"], R["جردُ_السكونات"]["أصناف"]
          if inv["صامتٌ داخل الشدة"] + inv["عابرٌ للحدّ"] != f["شدّاتٌ_في_المجمَّد"]:
              print("::error::فكُّ الشدة أضاع موضعًا — صريخ")
              sys.exit(1)
          # ④ حارسُ «بداية-حامل» المختوم في harakat_layer لا يُخرَق بالفكّ: شدّةُ أوّل
          #    الكلمة صنفٌ عابرٌ للحدّ لا سكونٌ يُنسَب إليها.
          if inv["عابرٌ للحدّ"] <= 0:
              print("::error::الصنفُ العابرُ للحدّ صفرٌ — فإمّا خُرق الحارسُ وإمّا سقط الجرد — صريخ")
              sys.exit(1)
          # ⑤ الصدقُ الخاوي محجوز: كلُّ قاعدةٍ دون حدِّ شواهدها حكمُها «غيرُ مختبَرة».
          d = R["بابُ_المعتلّ"]
          for bab, rule in d["قواعد"].items():
              billed = d["فواتير"][bab].get("حكم")
              if not rule["مختبَرة"] and billed != "غيرُ مختبَرة":
                  print(f"::error::قاعدةُ «{bab}» دون حدِّ الشواهد وحكمُها {billed} — صريخ")
                  sys.exit(1)
          # ⑥ ω = 0 يحذف الحافةَ لا العقدة: الحافّاتُ الساقطةُ معدودةٌ والعقدةُ موصولة.
          if not d["ω"]["موصولة"] or not d["ω"]["ساقطة"]:
              print("::error::حكمُ ω خُولف — صريخ")
              sys.exit(1)
          # ⑦ البندُ صفر: المكيالُ سعّر مصدرين مختلفين في تجربةٍ واحدة، وصرخ على واحد.
          srcs = R["البندُ_صفر"]["تجربةُ_القبول"]["مصادر"]
          if len(srcs) < 2 or not R["البندُ_صفر"]["تجربةُ_القبول"]["مصدرٌ_واحدٌ_يصرخ"]:
              print("::error::تجربةُ عموميّةِ المكيال لم تقم على مصدرين — صريخ")
              sys.exit(1)
          print(f"حكمُ باب المعتلّ: {d['حكم']}")
          print(f"نصيبُ «المقدَّر» الحقيقيّ: {t['نصيبُ_المقدَّر']['عدد']:,} من {t['خاتمةٌ_عارية']:,} ✓")
          PY

      - name: بابُ المنهج — مراسٍ في بايتاتهم، وجسرُ تصريح، ومصادمة manhaj_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          # بايتاتُ شهودِ مغني اللبيب الثلاثة جُلبت في خطوة «شهودُ الخارج» أعلاه،
          # لأنّ سجلَّ الأختام يسبق هذه الخطوةَ ويعيد تشغيل هذا المولِّد.
          python manhaj_gate.py --json /tmp/manhaj_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("manhaj_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/manhaj_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::manhaj_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("manhaj_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["المنهج_v0"]
          # ① كلُّ محاولةِ تكذيبٍ تُرَدّ — ونجاحُ واحدةٍ يُسقِط الباب.
          broke = [t["محاولة"] for t in R["محاولاتُ_التكذيب"] if t["نجحت"]]
          if broke:
              print(f"::error::محاولةُ تكذيبٍ نجحت في باب المنهج: {broke} — صريخ")
              sys.exit(1)
          # ② المراسي تُصادَم بالبايتات: بصمةٌ وطولٌ وفرادةٌ في الشاهد المختوم.
          for name, an in R["مراسٍ"].items():
              if len(an["بصمة"]) != 64 or an["طول"] <= 0:
                  print(f"::error::مرساةُ «{name}» بلا بصمةٍ أو بلا طول — صريخ")
                  sys.exit(1)
          # ③ تخالفُ مرايا الوسم يُودَع ولا يُتَّخذ سندًا.
          m = R["جسرُ_التصريح"]["تخالفُ_الوسم"]
          if m["يُتَّخذُ_سندًا"]:
              print("::error::وسمُ الناسخ اتُّخذ سندًا مع تخالف المرايا — صريخ")
              sys.exit(1)
          # ④ رقمُ ما خرج عن حدِّنا لا يدخل حكمًا، وحارسُه ليس خاويًا.
          lim = R["دفترُ_العطوب"]["منعُ_الحدّ"]
          if lim["عطب"] or not lim["ذو_أثر"]:
              print("::error::منعُ «حدُّنا لا حدُّهم» خُولف أو صار خاويًا — صريخ")
              sys.exit(1)
          # ⑤ ω = 0 يحذف الحافةَ لا العقدة.
          if not R["ω"]["موصولة"]:
              print("::error::انقطعت حافّاتُ باب المنهج كلُّها — صريخ")
              sys.exit(1)
          # ⑥ n₀ مُعلَنٌ ونافذ: ما دونه حكمُه «غيرُ مختبَر» لا «صامد».
          for r in R["دفترُ_الضوابط"]:
              n = r.get("مواضعُ_الإطلاق", 0)
              if n < R["التسجيلُ_المسبق"]["فواصل"]["n\u2080 مواضع"]["قيمة"] and r["حكم"] != "غيرُ مختبَر":
                  print(f"::error::ضابطُ «{r['ضابط']}» دون n₀ وحكمُه {r['حكم']} — صريخ")
                  sys.exit(1)
              if r.get("فاتورة") and not r["ترجمةٌ_يدوية"]:
                  print(f"::error::ضابطُ «{r['ضابط']}» بلا تصريحِ الترجمة اليدوية — صريخ")
                  sys.exit(1)
          # ⑦ الأرقامُ الثلاثةُ تُطبَع، وأوّلُها ما خرج عن حدِّنا.
          t = R["الأرقامُ_الثلاثة"]
          print(f"ما خرج عن حدِّنا: {t['حجمُ_ما_خرج_عن_الحدّ']:.2%} من مادّتهم")
          v = t["ما_صمد_من_ترجمتنا"]
          print(f"ما صمد من ترجمتنا لضابطهم: {v['صامد']}/{v['مختبَر']} ({v['نسبة']:.2%})")
          print(f"توزيعُ أصنافِ العطب: {t['توزيعُ_أصنافِ_العطب']}")
          PY

      - name: بابُ الإيداع — الشخصيةُ ج٣ نصًّا مقيسًا، ومصادمة shakhsiyya_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          # الحاويةُ مودَعةٌ في الشجرة، فلا جلبَ ههنا — والبصمةُ تُقرأ من المُستخرِج
          # نفسِه لا من نسخةٍ ثانيةٍ تتخلّف.
          SHA="$(sed -n 's/^CONTAINER_SHA256 = "\([0-9a-f]\{64\}\)".*/\1/p' shakhsiyya_extract.py | head -n 1)"
          GOT="$(sha256sum "الشخصية الاسلامية الجزء الثالث ورد (2).docx" | cut -d' ' -f1)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::حاويةُ الشخصية ج٣ خالفت بصمتَها ($GOT) — لا استخراجَ على بديلٍ صامت"
            exit 1
          fi
          echo "حاويةُ الشخصية ج٣ بالبصمة ✓ ($SHA)"
          # الوديعتان تُعادان من الحاوية وتُصادمان ببايتاتهما — فارقُ صفرٍ أو صريخ.
          python shakhsiyya_extract.py --check | tee -a measurement.txt
          python shakhsiyya_extract.py --json /tmp/shakhsiyya_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("shakhsiyya_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/shakhsiyya_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::shakhsiyya_v0.json المودَع خالف ما يُنتجه المُستخرِج — صريخ")
              sys.exit(1)
          print("shakhsiyya_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الشخصية_ج٣"]
          # ① الأداةُ مسمّاةٌ بإصدارها — فلا استخراجَ بيدٍ مجهولة.
          if not R["الأداة"]["اسم"] or not R["الأداة"]["إصدار"]:
              print("::error::نصٌّ مقيسٌ بلا أداةٍ مسمّاةٍ بإصدارها — صريخ")
              sys.exit(1)
          # ② تخالفُ NFC ترتيبٌ لا تأليف: تبدُّلُ حرفٍ واحدٍ يُسقِط البابَ.
          for name, d in R["تخالفُ_NFC"].items():
              if d["تأليف"]:
                  print(f"::error::تيارُ {name}: {d['تأليف']} سطرًا يتبدّل جردُه تحت NFC — صريخ")
                  sys.exit(1)
          # ③ الطبعةُ مقيسةٌ من بايتات الحاوية لا منقولةٌ عن دعوى.
          marks = R["الحاوية"]["شواهدُ_الطبعة"]
          for key in ("الطبعة الثالثة", "1426", "معتمدة"):
              if not marks.get(key):
                  print(f"::error::شاهدُ الطبعة «{key}» معدومٌ في المتن المقيس — صريخ")
                  sys.exit(1)
          # ④ الحواشي تيارٌ ثانٍ مختومٌ لا يدخل المتن — وصفرُه معلَنٌ لا مطويّ.
          if R["الحواشي"]["طول"] or R["الحواشي"]["أسطر"]:
              print("::error::تيارُ الحواشي تحرّك عن صفره المختوم — يُحدَّث ختمُه بيدٍ معلنة")
              sys.exit(1)
          # ⑤ المقصيُّ معدودٌ لا مبتلَع، والجداولُ مرفوعةٌ بأبعادها.
          led = R["المقصيُّ_معدودًا"]
          print("المقصيُّ معدودًا: " + " · ".join(
              f"{k}={v}" for k, v in led.items() if isinstance(v, int)))
          print(f"جداولُ رُفعت للمراجعة: {R['مراجعةٌ_للمالك']['جداولُ_تحمل_متنًا']}")
          print(f"المتنُ المقيس: {R['المتن']['طول']:,} بايتًا · {R['المتن']['كلمات']:,} كلمةً")
          PY

      - name: بابُ الدلالات — دعاوى النبهانيِّ السبع، ومصادمة dalalat_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا جلبَ ههنا: المتنُ مودَعٌ في الشجرة بختمه، والمجمَّدُ كذلك. والمراسي
          # تُصادَم داخلَ الباب بإزاحةٍ وبصمةٍ وفرادة — فيسقط بـ4 إن زُحزح المتن.
          python dalalat_gate.py --json /tmp/dalalat_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("dalalat_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/dalalat_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::dalalat_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("dalalat_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الدلالات_v0"]
          # ① الشرطُ القاطع: الإيماءُ لا يدخل خانةَ حكمٍ البتّة.
          if R["منعُ_الإيماء"]["الحكمُ_المنفَّذ"] != "ج":
              print("::error::دلالةُ الإيماء دخلت خانةَ حكمٍ — والمنعُ باتّ")
              sys.exit(1)
          # ② والمنعُ يحرس شيئًا: لو رُفع قيدُه لخرج عن (ج) — وإلّا فهو زينةٌ لا حارس.
          if not R["منعُ_الإيماء"]["ذو_أثر"]:
              print("::error::منعُ الإيماء بلا أثر — حارسٌ يحرس الخواء")
              sys.exit(1)
          # ③ عدَّةُ الدعاوى وصفوفِها معلنةٌ قبل القياس، لا تُشتقّ من المخرَج.
          if R["مقيس"]["دعاوى"] != 7 or R["مقيس"]["صفوف"] != 11:
              print("::error::عدَّةُ الدعاوى أو صفوفِها تحرّكت عن إعلانها — صريخ")
              sys.exit(1)
          # ④ الأصنافُ الأربعةُ تستوعب الصفوفَ كلَّها — لا صفَّ بلا خانة.
          kinds = {k: R["مقيس"][k] for k in ("أ", "ب", "ج", "د")}
          if sum(kinds.values()) != R["مقيس"]["صفوف"]:
              print(f"::error::مجموعُ الأصناف {sum(kinds.values())} ≠ الصفوف — صفٌّ بلا خانة")
              sys.exit(1)
          # ⑤ الخانةُ (أ) فارغةٌ ما دام مقامُ الحكم الشرعيِّ غيرَ مودَعٍ بختمه —
          #    فراغٌ معلنٌ مصادَم، لا انتصارٌ يُدَّعى ولا نقصٌ يُطوى.
          if not R["مقامُ_الحكم_مودَع"] and kinds["أ"]:
              print("::error::(أ) امتلأت بلا مقامِ حكمٍ مختوم — رقمٌ بلا سند")
              sys.exit(1)
          # ⑥ محاولاتُ التكذيب تُشغَّل ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل — صريخ")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          print("الأصناف: " + " · ".join(f"({k}) {v}" for k, v in kinds.items()))
          w = R["شواهدُ_النبهاني"]
          print(f"شواهدُ النبهاني: مذكورةٌ {w['مذكورة']} · في حدِّنا {w['في_حدِّنا']} · "
                f"خارجَه {w['خارجَ_حدِّنا']} — عيّنةٌ افتتاحيةٌ تُعلَن ولا تدخل حكمًا")
          PY

      - name: محرّكُ الربط — الأسبابُ الاثنا عشر بمقامَيها، ومصادمة jumla_links.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python jumla_links.py --json /tmp/jumla_links.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("jumla_links.json", encoding="utf-8"))
          b = json.load(open("/tmp/jumla_links.json", encoding="utf-8"))
          if a != b:
              print("::error::jumla_links.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("jumla_links.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الربط_v0"]
          W, C = R["مقامات"]["داخل_الآية"], R["مقامات"]["العبور"]
          # المقامان لا يُجمَعان: لكلٍّ عدُّه ومصالحتُه، وأزواجُ العبور 6,235 بنصِّ التسجيل.
          if C["حدود"] != 6235:
              print(f"::error::أزواجُ العبور ليست 6,235 بل {C['حدود']} — صريخ")
              sys.exit(1)
          for name, t in (("داخل الآية", W), ("العبور", C)):
              if t["مصنَّف"] + t["معلَّق"] != t["حدود"] \
                 or sum(t["أجناسُ_المتبقّي"].values()) != t["معلَّق"]:
                  print(f"::error::مصالحةُ «{name}» خُولفت — صريخ")
                  sys.exit(1)
              # الشرطُ الثاني المختوم: لا موضعَ بلا جنسٍ مسمًّى — و«غيرُ ذلك» صفرٌ أو سقط.
              if t["غيرُ_المسمّى"]:
                  print(f"::error::متبقٍّ غيرُ مسمًّى في «{name}»: {t['غيرُ_المسمّى']} — صريخ")
                  sys.exit(1)
          # حكمُ التسجيل المسبق يُعرَض بنصّه ولا يُخفى — والسقوطُ المسمّى نتيجةٌ تُودَع.
          print(f"حكمُ التسجيل المسبق لمحرّك الربط: {R['preregistration']}")
          # حارسُ التاريخ: الحكمُ الساقطُ يبقى ساقطًا بأرقامه، ولا يُرفَع بجولةٍ تالية.
          if not R["preregistration"].startswith("سقط"):
              print("::error::حكمُ محرّك الربط انقلب عن سقوطه بلا جولةٍ مسجَّلة — صريخ")
              sys.exit(1)
          if "0.3289" not in R["preregistration"] or "0.3416" not in R["preregistration"]:
              print("::error::أرقامُ حكم محرّك الربط المجمَّدة تبدّلت — صريخ")
              sys.exit(1)
          # العطفُ ليس سببًا: تعليقُه معدودٌ بجنسه، ولا يدخل تغطيةً بحالٍ من الأحوال.
          if any(r not in R["أسبابٌ_معلنة"] for r in W["أسباب"]) or len(R["أسبابٌ_معلنة"]) != 12:
              print("::error::الأسبابُ ليست الاثني عشر المعلنة — صريخ")
              sys.exit(1)
          if W["تغطية"] * W["حدود"] < W["مصنَّف"] - 1:
              print("::error::التغطيةُ لا تُصالِح المصنَّف — صريخ")
              sys.exit(1)
          print("المقامان معدودان مستقلّين، والمتبقّي مسمًّى كلُّه بأجناسه ✓")
          # ═══ الجولة ٢: المُعادُ تبويبُه لا يرفع حكمًا، والمقيسُ يُحرَس بفواصله ═══
          S2 = R["الجولة_٢"]
          # ⓪ حارسُ التاريخ الثاني: تغطيةُ الأسباب المختومة لا تنقلب بعرضٍ أُعلن بعدها.
          for name, t, sealed in (("داخل_الآية", W, 0.3289), ("العبور", C, 0.3416)):
              w = S2["عطفٌ_واصل"][name]
              if t["تغطية"] != sealed or w["تغطيةُ_الأسباب_المختومة"] != sealed:
                  print(f"::error::حكمُ الجولة ١ في «{name}» انقلب عن {sealed} — صريخ")
                  sys.exit(1)
              if w["بالأسباب"] != t["مصنَّف"] or w["مجموع"] != w["بالأسباب"] + w["عطفٌ_واصل"]:
                  print(f"::error::مصالحةُ المُعاد تبويبِه في «{name}» خُولفت — صريخ")
                  sys.exit(1)
          # ① المقامان يُعرَضان معًا، والفرعيُّ مصالَحٌ بالخام — لا تضييقَ انتقائيًّا للبسط.
          s = S2["مقامُ_العبور_مرّتين"]
          if s["المقامُ_الفرعيّ"] + s["صدورُ_الفيات"] != C["حدود"] \
             or s["فيات_نالت_سببًا"] + s["فيات_معلَّقة"] != s["صدورُ_الفيات"]:
              print("::error::مصالحةُ المقام الفرعيّ بالخام خُولفت — صريخ")
              sys.exit(1)
          if s["المقامُ_الفرعيّ"] != 3195 or s["بديلٌ_مرفوض"]["رقم"] != 4334:
              print("::error::المقامُ الفرعيُّ المجمَّد أو بديلُه المرفوض تبدّل — صريخ")
              sys.exit(1)
          # ② البابان يستغرقان الجنسَ، وحارسُ النزاهة فوقهما في المقامين.
          for name, t in (("داخل_الآية", W), ("العبور", C)):
              d = S2["أبوابُ_الاسميّ"][name]
              if sum(d["أبواب"].values()) != d["جنسٌ_مستهدَف"] \
                 or d["جنسٌ_مستهدَف"] != t["أجناسُ_المتبقّي"].get("صدرٌ اسميٌّ بلا قرينة", 0):
                  print(f"::error::بابا «الاسميِّ بلا قرينة» لا يُصالِحان «{name}» — صريخ")
                  sys.exit(1)
              g = d["حارسُ_النزاهة"]
              if g["كانت_مفسَّرة"] + g["كانت_معلَّقة"] != g["مطابقاتُ_القيد"]:
                  print(f"::error::مطابقاتُ القيد في «{name}» لا تُعَدّ صنفين — صريخ")
                  sys.exit(1)
              if g["نسبة"] < g["فاصل"]:
                  print(f"::error::كاشفُ الباب في «{name}» مفصَّلٌ على العتبة "
                        f"({g['نسبة']}) — صريخ")
                  sys.exit(1)
          # ⑤ حكمُ الجولة ٢ يُعرَض بنصّه، وسقوطُه محروسٌ بحارس تاريخٍ من يومه.
          print(f"حكمُ الجولة ٢ لمحرّك الربط: {S2['حكم']}")
          if not S2["حكم"].startswith("سقط") or "53" not in S2["حكم"]:
              print("::error::حكمُ الجولة ٢ الساقطُ انقلب أو تبدّل رقمُه — صريخ")
              sys.exit(1)
          print("الجولة ٢ ✓ — مُعادُ تبويبٍ [شاهد] بلا فاصل · مقامان معًا · بابٌ ساقطٌ باسمه")
          # ═══ الجولة ٣: بابُ شبه الجملة — حكمُه ساقطٌ مودَعٌ، والشاهدُ لا يُحتسَب ═══
          S3 = R["الجولة_٣"]
          d3 = S3["بابُ_شبهِ_الجملة"]
          # البابُ يستغرق جنسَه، ويُصالِح عدَّ الجولة ١ — لا تضييقَ انتقائيًّا للبسط.
          if d3["مفسَّرٌ_بالباب"] + d3["باقٍ_بلا_قرينة"] != d3["جنسٌ_مستهدَف"] \
             or d3["جنسٌ_مستهدَف"] != C["أجناسُ_المتبقّي"].get("صدرُ آيةٍ بلا قرينة", 0):
              print("::error::بابُ شبهِ الجملة لا يُصالِح جنسَه في «العبور» — صريخ")
              sys.exit(1)
          # قيدُ الإثبات مُضيِّقٌ لا موسِّع: المُثبَتُ لا يتجاوز الصورةَ بحال.
          if d3["مفسَّرٌ_بالباب"] > d3["عددٌ_بالصورة_لا_يُحتسَب"]["قيمة"]:
              print("::error::المُثبَتُ تجاوز الصورةَ — قيدُ الإثبات انقلب، صريخ")
              sys.exit(1)
          # حارسُ النزاهة: مطابقاتُ القيد صنفان، والنسبةُ فوق فاصلها أو رُدّ الباب.
          g3 = d3["حارسُ_النزاهة"]
          if g3["كانت_مفسَّرة"] + g3["كانت_معلَّقة"] != g3["مطابقاتُ_القيد"]:
              print("::error::مطابقاتُ قيد الجولة ٣ لا تُعَدّ صنفين — صريخ")
              sys.exit(1)
          if g3["نسبة"] < g3["فاصل"]:
              print(f"::error::قيدُ بابِ شبهِ الجملة مفصَّلٌ على المتبقّي "
                    f"({g3['نسبة']}) — صريخ")
              sys.exit(1)
          # **شرطُ القبول**: «حضورٌ لا تعلُّق» [شاهدٌ] في خانة العرض لا الحكم — فميلٌ
          # ببايتةٍ واحدةٍ نحو احتسابه تغطيةً يُسقط البناء، ولا يُنتظَر به مراجع.
          for st, t in (("داخل_الآية", W), ("العبور", C)):
              w3 = S3["حضورٌ_لا_تعلُّق"][st]
              if w3["حدود"] != t["حدود"]:
                  print(f"::error::شاهدُ «{st}» بُنِيَ على غير حدوده — صريخ")
                  sys.exit(1)
              if not isinstance(w3["تغطيةٌ_مزعومةٌ_لو_احتُسب"], str):
                  print(f"::error::شاهدُ «{st}» أُعطي رقمَ تغطيةٍ — احتسابٌ ممنوع، صريخ")
                  sys.exit(1)
              if w3["جارٌّ_في_الأثناء"] + t["مصنَّف"] == t["حدود"] * t["تغطية"]:
                  print(f"::error::شاهدُ «{st}» دخل بسطَ التغطية — صريخ")
                  sys.exit(1)
          # حارسُ تاريخٍ من يومه: حكمُ الجولة ٣ ساقطٌ برقمه، ولا تُخفَّض أرضيتُه بعده.
          print(f"حكمُ الجولة ٣ لمحرّك الربط: {S3['حكم']}")
          if not S3["حكم"].startswith("سقط") or "21" not in S3["حكم"]:
              print("::error::حكمُ الجولة ٣ الساقطُ انقلب أو تبدّل رقمُه — صريخ")
              sys.exit(1)
          print("الجولة ٣ ✓ — بابٌ ساقطٌ بأرضيته · شاهدٌ يُعرَض ولا يُحتسَب")
          PY

      - name: إيداع تقرير القياس
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement
          path: measurement.txt
          if-no-files-found: warn
