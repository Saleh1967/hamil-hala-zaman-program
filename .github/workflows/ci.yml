          # ⑩ مبرهنةُ الوصل استتباعًا لا استقلالًا: الصفرُ من الطرف الثاني وحدَه،
          #     والطرفُ الأوّلُ عامرٌ بـ8,843 — وإلّا كان البرهانُ خواءَ حدَّين.
          V = W["بنود"]["② الوصل"]
          if V["لقاءُ_الوصلةِ_الذرّيّ"] != 0:
              die(f"لقاءُ الوصلة {V['لقاءُ_الوصلةِ_الذرّيّ']} لا صفر")
          if V["الطرفُ_الأوّل_(خاتمةٌ_ساكنة)"] != 8843 or V["الصفرُ_من_الطرفِ_الثاني_وحدَه"] != "نعم":
