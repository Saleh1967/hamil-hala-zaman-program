      - name: بابُ الوظائف — ديوانُ المانع، وختمُ البيت، ومصادمة waza2if_v0.json وWAZA2IF.md
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # بيتٌ مستقلٌّ بنمط `burhan/`: لا يستورد شجرةَ المشروع ولا تستورده، ويقرأ
          # سجلَّ الأختام من بايتات `induction/seals.json` (المُصادَمةِ في خطوةِ
          # السجلّ قبلُ) لا من كوده. فلا يقيس رقمًا جديدًا غيرَ عدِّ بنوده، وكلُّ
          # قيمةٍ فيه منقولةٌ عن ختمٍ قائمٍ ومُصادَمةٌ بوديعته.
          cp WAZA2IF.md /tmp/waza2if.committed.md
          python waza2if/waza2if.py --check
          python waza2if/waza2if.py --json /tmp/waza2if.json --doc /tmp/waza2if.md \
            | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("waza2if/waza2if_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/waza2if.json", encoding="utf-8"))
          if a != b:
              print("::error::waza2if_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          A = a["الوظائف_v0"]; M = A["مقيس"]

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          # ① **برهانُ الانغلاق**: لا حَكَمَ وقع بين منفِّذي وظيفته — ولا وظيفةَ
          #    تُصدِّق نفسَها. وهذا هو الحارسُ الذي من أجله قام البابُ كلُّه.
          if M["حَكَمٌ وقع داخلَ وظيفته"] != 0:
              die("حَكَمٌ وقع داخلَ وظيفته — وظيفةٌ تُصدِّق نفسَها")
          for r in A["الوظائف"]:
              for m in r["موانع"]:
                  if m["حَكَم"] in r["منفِّذون"]:
                      die(f"«{m['حَكَم']}» يشهد لوظيفةٍ هو من منفِّذيها")

          # ② كلُّ منفِّذٍ مُعلَنٍ حاضرٌ في الشجرة — فلا يشيخ الديوانُ على ملفٍّ زال.
          if M["منفِّذون حاضرون في الشجرة"] != M["منفِّذون مُعلَنون"]:
              die("منفِّذٌ مُعلَنٌ غائبٌ عن الشجرة — ديوانٌ يشيخ")

          # ③ الدَّينُ يُسمّى ولا يُسعَّر، ولا يُطوى بالسكوت.
          if M["ديونٌ بلا رقم"] != M["ديونٌ مسمّاة"] or M["ديونٌ مسمّاة"] < 1:
              die("دَينٌ حمل رقمًا أو طُوِيت الديون — ما لم يُنفَّذ مانعُه لا يُسعَّر")
          named = {d["دَين"] for d in A["الديون"]}
          for r in A["الوظائف"]:
              if not r["موانع"] and r["وظيفة"] not in named:
                  die(f"وظيفةٌ بلا مانعٍ ولا دَينٍ مسمًّى: {r['وظيفة']}")

          # ④ المانعُ مُصادَمٌ بموضعه: بختمٍ قائمٍ تُقرأ قيمتُه، أو بنصٍّ في البايتات.
          if M["موانعُ بختمٍ قائم"] + M["موانعُ بحارسٍ في البايتات"] != M["موانعُ مُصادَمة"]:
              die("صنفُ مانعٍ خارجَ المفردات المغلقة — «ختم» أو «حارس» لا ثالث")
          if M["موانعُ مُصادَمة"] != M["موانعُ مُعلَنة"]:
              die("مانعٌ مُعلَنٌ لم يُصادَم — دعوى حرسٍ بلا مصادمة")

          # ⑤ محاولاتُ التكذيب تُشغَّل ولا تُقرَأ.
          t = A["محاولاتُ_التكذيب"]
          if not t or any(x["نجحت"] for x in t):
              die("محاولةُ تكذيبٍ نجحت في باب الوظائف — صريخ")

          print(f"بابُ الوظائف: {M['وظائف']} وظيفةً · {M['موانعُ مُصادَمة']} مانعًا "
                f"مُصادَمًا ({M['موانعُ بختمٍ قائم']} بختمٍ · "
                f"{M['موانعُ بحارسٍ في البايتات']} بحارس) · "
                f"{M['وظائفُ بلا مانعٍ منفَّذ']} بلا مانع · "
                f"{M['ديونٌ مسمّاة']} دَينًا بلا رقم · محاولاتُ التكذيب {len(t)} ✓")
          PY
          # ⑥ والوثيقةُ مولَّدةٌ لا محرَّرةٌ بيد — فلا يشيخ فيها سطرٌ صادقُ الظاهر
          #    كاذبُ المقدار، وهي العلّةُ التي من أجلها لم تُكتَب WAZA2IF.md بيد.
          cmp /tmp/waza2if.md /tmp/waza2if.committed.md \
            || { echo "::error::WAZA2IF.md المودَعةُ خالفت ما تُولِّده الوديعة — وثيقةٌ حُرِّرت بيد"; exit 1; }

      - name: بابُ البصمة — R5 بضابط المثل، ومصادمة basma_v0.json وBASMA.md
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # شهودُه التسعةُ مجلوبون سلفًا في خطوةِ «شهودُ الخارج»، ويُعاد جلبُهم
          # ههنا **من قائمة الباب نفسِها** لئلّا تُرتَّب الخطوةُ على أثرٍ جانبيٍّ
          # لخطوةٍ أخرى، ولئلّا يشيخ هذا السطرُ إن بُدِّل شاهد. وحاويةُ الاستخراج
          # مودَعةٌ في الشجرة (`shakhsiyya_j3_matn.txt`) فلا جلبَ لها — وبصمتُها
          # تُقرأ من كود مستخرِجها لا من نسخةٍ ثانيةٍ ههنا تتخلّف عنه.
          python - <<'PY' > /tmp/basma_ids.txt
          import basma_gate
          print("\n".join(sid for sid, *_ in basma_gate.WITNESSES))
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            bash fetch_source.sh --fetch "$id"
          done < /tmp/basma_ids.txt
          cp BASMA.md /tmp/basma.committed.md
          python basma_gate.py --json /tmp/basma.json --doc /tmp/basma.md \
            | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("basma_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/basma.json", encoding="utf-8"))
          if a != b:
              print("::error::basma_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          A = a["البصمة_v0"]; M = A["مقيس"]

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          # ① التسجيلُ المسبقُ مختومٌ ببصمته: تبديلُ حدٍّ أو بذرةٍ بعد رؤية النتيجة
          #    يغيّر البصمةَ فتسقط الوديعةُ في المصادمة أعلاه. وحكمُ كلِّ دعوًى
          #    من مفرداتٍ **مغلقةٍ مُعلَنةٍ قبل القياس** — فلا يُخترَع حكمٌ بعدَه.
          P = A["التسجيلُ_المسبق"]
          if A["H₁"]["دعوى"] != P["H₁"] or A["H₂"]["دعوى"] != P["H₂"]:
              die("دعوى قِيست خالفت ما سُجِّل قبل القياس — تسجيلٌ حُرِّك بعد رؤية النتيجة")
          if A["H₁"]["حدّ"] != P["حدُّ_H₁"] or A["H₂"]["حدّ"] != P["حدُّ_H₂"]:
              die("حدُّ حكمٍ خالف ما سُجِّل قبل القياس — حدٌّ لُوِيَ ليمرَّ")
          for h in ("H₁", "H₂"):
              if A[h]["حكم"] not in P["مفرداتُ_الحكم"]:
                  die(f"حكمُ {h} خارجَ المفردات المغلقة — حكمٌ اخترِع بعد القياس")

          # ② **ضابطُ المثل شرطُ صدق الجولة**: طوائفُ المثل متمايزةٌ بعددها، وإلّا
          #    فالمقارنةُ بطائفةٍ واحدةٍ مكرّرةٍ ورقمُ الغلبة خاوٍ.
          R = A["ضابطُ_المثل"]
          if R["تمايزُ_الطوائف"] != R["طوائف"] or R["طوائف"] < 11:
              die("طوائفُ المثل تكرّرت أو نقصت — ضابطٌ خاوٍ فالرقمُ لا يفصل")
          if M["تمايزُ طوائف المثل"] != R["تمايزُ_الطوائف"]:
              die("عددُ الطوائف المتمايزة خالف ختمَه")

          # ③ المقاماتُ تُعرَض ولا تُجمَع: لكلِّ حاويةٍ مقامُها ونصيبُها فيها،
          #    ولا يُجمَع مقامُ سيبويهِ بمقام النبهانيّ فيخرج رقمٌ بلا أرض.
          land = A["H₂"]["أرض"]
          if len(land) != A["H₂"]["حاويات"] or len(land) != M["شهودُ الاختبار"]:
              die("عددُ صفوف الأرض خالف عددَ الشهود")
          won = 0
          for row in land:
              for key in ("نصيبُ_الطائفة", "أدنى_المثل", "أعلى_المثل"):
                  v = row[key]
                  if not 0.0 <= v <= 1.0:
                      die(f"نصيبٌ خارجَ [0,1] في «{row['شاهد']}» — رقمٌ بلا مقام")
              if not row["مقامُ_الكلمات"]:
                  die(f"شاهدٌ بلا مقامٍ معلن: {row['شاهد']}")
              if row["غلبَ_أدنى_المثل"] != (row["نصيبُ_الطائفة"] > row["أدنى_المثل"]):
                  die(f"حكمُ الغلبة في «{row['شاهد']}» خالف رقمَيه")
              won += bool(row["غلبَ_أدنى_المثل"])
          if won != M["حاوياتٌ غلبت فيها الطائفة"]:
              die("عدُّ الحاويات الغالبة خالف صفوفَه")

          # ④ لا شاهدَ من المؤلَّف المستخرَجِ منه في ميدان الاختبار — وإلّا قِيست
          #    الطائفةُ على نفسِها. وكلُّ شاهدٍ لمؤلِّفٍ لا يتكرّر.
          if any("shakhsiyya" in row["شاهد"] for row in land):
              die("شاهدُ المؤلِّف نفسِه في ميدان الاختبار — طائفةٌ تُقاس على نفسِها")
          authors = [row["مؤلّف"] for row in A["الميدان"]["شهود"]]
          if len(set(authors)) != len(authors) or len(set(authors)) != M["مؤلّفون آخرون"]:
              die("مؤلِّفٌ تكرّر في الميدان — نسخٌ تُعَدُّ مؤلِّفين")

          # ⑤ البقايا الصلبةُ تُقرأ مع مدى أمثالها أبدًا: عددٌ يُفرَد يُوهِم خصوصيّةً
          #    لم تثبت، فلا يمرُّ ختمُها إلّا ومدى المثل مختومٌ معه.
          if len(A["H₁"]["البقايا_الصلبة"]) != M["بقايا صلبة"]:
              die("عدُّ البقايا الصلبة خالف قائمتَها")
          if M["أعلى بقايا المثل"] != A["H₁"]["أعلى_بقايا_المثل"]:
              die("أعلى بقايا المثل خالف ختمَه — بقايا تُفرَد عن مداها")

          # ⑥ الدَّينُ يُسمّى ولا يُسعَّر — وأثقلُه أنّ سقوطَ H₂ لا يفصل اختلافَ
          #    المؤلّف عن اختلاف العصر. فدَينٌ يحمل رقمًا يُسقط البابَ.
          if M["ديونٌ بلا رقم"] != M["ديونٌ مسمّاة"] or M["ديونٌ مسمّاة"] < 3:
              die("دَينٌ حمل رقمًا أو طُوِيَ دَينٌ — ما لم يُقَس لا يُسعَّر")

          # ⑦ محاولاتُ التكذيب تُشغَّل ولا تُقرَأ.
          t = A["محاولاتُ_التكذيب"]
          if not t or any(x["نجحت"] for x in t) or len(t) != M["محاولاتُ_تكذيب"]:
              die("محاولةُ تكذيبٍ نجحت في باب البصمة — صريخ")

          print(f"بابُ البصمة: {M['مرشَّحون']} مرشَّحًا · {M['مؤلّفون آخرون']} مؤلِّفًا "
                f"آخرَ · غلبت في {M['حاوياتٌ غلبت فيها الطائفة']} من "
                f"{M['شهودُ الاختبار']} · H₁ {M['حكمُ H₁']} · H₂ {M['حكمُ H₂']} · "
                f"{M['ديونٌ مسمّاة']} دَينًا بلا رقم · محاولاتُ التكذيب {len(t)} ✓")
          PY
          # ⑧ والوثيقةُ مولَّدةٌ لا محرَّرةٌ بيد — فلا يشيخ فيها رقمٌ بعد أن يتبدّل
          #    شاهدٌ أو تُزاد حاوية.
          cmp /tmp/basma.md /tmp/basma.committed.md \
            || { echo "::error::BASMA.md المودَعةُ خالفت ما يُولِّده البابُ — وثيقةٌ حُرِّرت بيد"; exit 1; }

      - name: بابُ المعجم — الجسرُ الثلاثيُّ بقاعدةٍ معلنةٍ وضوابطِ مثل، ومصادمة mu3jam_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # البابُ يصادم موادَّه المقيسةَ بجدول «مقاييس اللغة» المختوم، ويسقط
          # بالمخرج 3 إن غاب — فلا يُنسَب رقمٌ إلى غائب. والجدولُ مجلوبٌ سلفًا في
          # خطوةِ «شهودُ الخارج»، ويُعاد الجلبُ ههنا صراحةً لئلّا تُرتَّب الخطوات
          # على أثرٍ جانبيٍّ لخطوةٍ أخرى.
          ./fetch_maqayis.sh
          python mu3jam_gate.py --json /tmp/mu3jam.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("mu3jam_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/mu3jam.json", encoding="utf-8"))
          if A != B:
              print("::error::mu3jam_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["المعجم_v0"]; M = R["مقيس"]

          # ① المحاولاتُ تُشغَّل ولا تُقرَأ، ونجاحُ واحدةٍ يُسقِط الباب.
          if len(R["محاولاتُ_التكذيب"]) < 8 or any(t["نجحت"] for t in R["محاولاتُ_التكذيب"]):
              print("::error::محاولاتُ تكذيبِ باب المعجم دون ثمانٍ أو نجحت واحدة")
              sys.exit(1)

          # ② قاعدةُ الوسم مُعلَنةٌ في الوديعة نصًّا: قاعدةٌ لا تُقرَأ ليست قاعدةً.
          rule = R["قاعدةُ_الوسم"]
          if "roots_widest" not in rule["نصّ"] or rule["مصدرُ_القائمة"].split(" · ")[0] != "awzan_v0.json":
              print("::error::قاعدةُ الوسم غابت عن الوديعة أو انفصلت عن قائمتها المسعَّرة")
              sys.exit(1)

          # ③ القائمةُ مشتقّةٌ لا مكتوبةٌ بيد: عدَّتُها تُصادَم بوديعة الأوزان نفسِها.
          import awzan_engine as AW
          widest = {"".join(AW.HAMZ.get(c, c) for c in r)
                    for r in json.load(open("awzan_v0.json", encoding="utf-8"))["الأوزان_v0"]["roots_widest"]}
          if len(widest) != M["موادُّ القائمة المشتقّة"]:
              print("::error::قائمةُ الموادِّ انفصلت عن awzan_v0.roots_widest")
              sys.exit(1)

          # ④ الغيابُ يُعلَن ولا يُحذَف: صفوفُ العشرين كلُّها حاضرةٌ بأصفارها.
          rows = R["القائمةُ_المعلنة"]["صفوف"]
          if len(rows) != M["العشرون المعلنة"] or M["منها في القائمة المشتقّة"] + M["غيابٌ معلن"] != len(rows):
              print("::error::صفٌّ من العشرين حُذِف — والغيابُ يُعلَن ولا يُطوى")
              sys.exit(1)

          # ⑤ الحَكَمُ ضوابطُ المثل لا حكمٌ مفرد، وعدَّتُها مقروءةٌ من بابها.
          import madlul_gate as MG
          if R["ضوابطُ_المثل"]["عدد"] != MG.RIVALS or len(R["ضوابطُ_المثل"]["مشتقّة"]) != MG.RIVALS:
              print("::error::عدَّةُ فرقِ المثل خالفت madlul_gate.RIVALS")
              sys.exit(1)

          # ⑥ ما لم يغلب المثلَ لا يُكتَب له رقمُ فضل: الديونُ تُسمّى ولا تُسعَّر.
          debts = R["ديونٌ_بلا_رقم"]
          if len(debts) != M["ديونٌ بلا رقم"] or any(
                  isinstance(v, (int, float)) for d in debts for v in d.values()):
              print("::error::دَينٌ حمل رقمًا أو طُوِيت الديون — ما لم يُختَم لا يُسعَّر")
              sys.exit(1)

          # ⑦ الحكمُ مشتقٌّ من المقارنة لا مكتوب: كلُّ مُودَعٍ غالبٌ وكلُّ دَينٍ مغلوب.
          for v in R["الأحكام"]:
              ok = (v["مقيس"] > v["حدُّ_المثل"]) if v["رجل"] != "المدخل ↔ الكلمة (الفاتورة)" \
                  else (v["مقيس"] < v["حدُّ_المثل"])
              if ok != v["غلبَ_المثل"]:
                  print(f"::error::حكمٌ خالف مقارنتَه: {v['رجل']}")
                  sys.exit(1)

          # ⑧ القاعدةُ المتروكةُ مُصادَمةٌ في الوديعة: تركُها مقيسٌ لا تحكُّم.
          left = R["القاعدةُ_المتروكة"]
          if left["تفصل"] or left["أعلى_المصنوعة"] <= R["الحضور"]["أعلى_المصنوعة"]:
              print("::error::القاعدةُ المتروكةُ لم تُصادَم — فتركُها تحكُّمٌ لا قياس")
              sys.exit(1)

          # ⑨ مصادمةُ ابن فارس ببصمته لا باسمه.
          import maqayis_layer as ML
          if R["ابنُ_فارس"]["sha256"] != ML.SEAL or R["ابنُ_فارس"]["طول"] != ML.SEAL_BYTES:
              print("::error::صفُّ ابن فارس انفصل عن بصمة جدوله")
              sys.exit(1)
          print(f"بابُ المعجم: تسعةُ حرّاسٍ ✓ — مُودَعٌ بالبرهان {M['أرجلٌ مُودَعةٌ بالبرهان']} "
                f"· ديونٌ بلا رقم {M['ديونٌ بلا رقم']} · محاولاتُ التكذيب "
                f"{M['محاولاتُ_تكذيب']}")
          PY

      - name: بابُ التوقيع — سلسلةُ التوقيع، ومصادمة tawqi3_v0.json وTAWQI3.md
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا جلبَ لهذا البابِ ولا شبكة: مقامُه كائناتُ git في هذه الشجرة
          # ومفتاحٌ عامٌّ مودَعٌ فيها. وعمقُ السحب `fetch-depth: 0` مُعلَنٌ في
          # خطوة السحب أعلاه، وهو شرطُ قياسٍ ههنا لا تحسينُ أداء.
          command -v gpgv >/dev/null || { echo "::error::gpgv غائبٌ عن العامل"; exit 1; }
          cp TAWQI3.md /tmp/tawqi3.committed.md
          python tawqi3_gate.py --json /tmp/tawqi3.json --doc /tmp/tawqi3.md \
            | tee -a measurement.txt
          python - <<'PY'
          import json, subprocess, sys

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          a = json.load(open("tawqi3_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/tawqi3.json", encoding="utf-8"))
          if a != b:
              die("tawqi3_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
          A = a["التوقيع_v0"]; M = A["مقيس"]

          # ① لا سلسلةَ مقطوعةٌ ولا سطرَ self بلا توقيع ولا إيداعَ غائب.
          if A["سقوط"]:
              die("بابُ التوقيع سقط: " + " · ".join(A["سقوط"]))
          if M["موقَّعٌ مقطوع"] or M["غيرُ موقَّع"] or M["إيداعٌ غائب"]:
              die("سطرٌ على طريق self بلا توقيعٍ موصول — بابُ المالك لا يدخل منه غيرُه")

          # ② العدُّ مستنفِدٌ لا انتقاء: الأحكامُ الأربعةُ تستغرق سطورَ self كلَّها.
          if (M["موقَّعٌ موصول"] + M["موقَّعٌ مقطوع"] + M["غيرُ موقَّع"]
                  + M["إيداعٌ غائب"] != M["سطورٌ على طريق self"]):
              die("الأحكامُ لم تستنفد سطورَ self — مصدرٌ طُوِي خارجَ الحكم")

          # ③ سطورُ self في الوديعة هي سطورُ self في البيان نفسِه — لا نسخةَ ثانية.
          rows = [l.rstrip("\n").split("\t")
                  for l in open("sources_manifest.tsv", encoding="utf-8")
                  if l.strip() and not l.startswith("#")]
          selves = [r for r in rows if r[1] == "self"]
          if len(selves) != M["سطورٌ على طريق self"]:
              die("عدَّةُ سطور self في الوديعة خالفت البيانَ")

          # ④ الحلقاتُ خمسٌ لكلِّ مصدرٍ ومقيسةٌ كلُّها — لا حكمَ على حلقةٍ واحدة.
          for src in A["المصادر"]:
              if len(src["حلقات"]) != M["حلقاتٌ مقيسةٌ لكلِّ مصدر"]:
                  die(f"«{src['مصدر']}»: حلقاتُه {len(src['حلقات'])} لا خمسٌ")

          # ⑤ التوقيعُ موصولٌ بالبايتات المختومة لا بالإيداع وحدَه: الحلقتان
          #    الرابعةُ والخامسةُ تُصادَمان بحقول البيان نفسِها.
          by_id = {r[0]: r for r in selves}
          for src in A["المصادر"]:
              row = by_id[src["مصدر"]]
              if src["إيداع"] != row[2] or src["ملفّ"] != row[4]:
                  die(f"«{src['مصدر']}»: إيداعُه أو مسارُه انفصل عن البيان")
              blob = subprocess.run(
                  ("git", "rev-parse", f"{row[2]}:{row[4]}"),
                  capture_output=True, text=True)
              if blob.returncode != 0 or blob.stdout.strip() != row[5]:
                  die(f"«{src['مصدر']}»: شجرةُ الإيداع لا تُعطي الكائنَ المختوم")

          # ⑥ المفتاحُ مثبَّتٌ بوجهَين، وبصمتُه في بايتات الباب لا في هذا السطر.
          import hashlib
          import tawqi3_gate as TG
          raw = open("keys/github-web-flow.asc", "rb").read()
          if (len(raw) != A["المفتاح"]["بايتات"]
                  or hashlib.sha256(raw).hexdigest() != A["المفتاح"]["sha256"]
                  or A["المفتاح"]["sha256"] != TG.KEYRING_SHA256
                  or A["المفتاح"]["بصمةُ الموقِّع"] != TG.SIGNING_FPR):
              die("المفتاحُ المودَعُ انفصل عن تثبيته — يُصادَم قبل أن يُستعمَل")

          # ⑦ الديونُ تُسمّى ولا تُسعَّر، والوكالةُ مذكورةٌ بحرفها لا تُطوى.
          debts = A["الديون"]
          if len(debts) != M["ديونٌ مسمّاة"] or any(
                  isinstance(v, (int, float)) for d in debts for v in d.values()):
              die("دَينٌ حمل رقمًا أو طُوِيت الديون — ما لم يُقَس لا يُسعَّر")
          if not any("وكالةٌ لا أصالة" in d["دَين"] for d in debts):
              die("دَينُ «التوقيعُ وكالةٌ لا أصالة» طُوِي — وهو أثقلُ ديون الباب")

          # ⑧ محاولاتُ التكذيب تُشغَّل ولا تُقرَأ: نجاحُ واحدةٍ يُسقِط البابَ.
          T = A["محاولاتُ_التكذيب"]
          if len(T) != M["محاولاتُ_تكذيب"] or any(t["نجحت"] for t in T):
              die("محاولةُ تكذيبٍ نجحت أو نقصت العدَّةُ — البابُ ساقط")
          print(f"بابُ التوقيع: ثمانيةُ حرّاسٍ ✓ — موصولٌ {M['موقَّعٌ موصول']} "
                f"من {M['سطورٌ على طريق self']} · حلقاتٌ "
                f"{M['حلقاتٌ مقيسةٌ لكلِّ مصدر']} لكلِّ مصدر · ديونٌ "
                f"{M['ديونٌ مسمّاة']} · محاولاتُ التكذيب {M['محاولاتُ_تكذيب']}")
          PY
          cmp -s TAWQI3.md /tmp/tawqi3.md || {
            echo "::error::TAWQI3.md المودَعةُ خالفت ما يولّده البابُ — تُعاد بـ--doc"
            diff /tmp/tawqi3.committed.md /tmp/tawqi3.md | head -40
            exit 1
          }

      - name: إيداع تقرير القياس
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement
          path: measurement.txt
          if-no-files-found: warn
