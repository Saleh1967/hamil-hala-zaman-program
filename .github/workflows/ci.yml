              die("ختمُ المدوّنة أو حدودُها خُولِفت")
          if m["كلمات"] + m["علاماتُ_وقفٍ_قائمةٌ_بذاتها"] + m["كلماتُ_الترويسة"] != m["الجردُ_الخام"]:
