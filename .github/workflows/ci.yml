              die(f"سقوطُ قيدِ الخاتمة طُوِي أو انزاح عدده: {E}")
          if W["مقيس"]["بنودٌ_ساقطة"] != 2 or W["مقيس"]["أسماءُ_الساقطة"] != ["③ الخاتمة", "⑥ الخاتمةُ حالةٌ لا لازمة"]:
              die(f"سجلُّ الساقط تبدَّل: {W['مقيس']}")
          if W["بنود"]["④ الوقفُ على مشتقّ"]["آياتٌ_خاتمتُها_منوَّنة"] != 1098:
              die("عددُ الوقفِ على مشتقٍّ انزاح")
          if W["معلَّق"]["الحال"][:6] != "معلَّق":
              die("البندُ المعلَّقُ رُقِّيَ إلى برهانٍ بلا متوقَّعٍ سابق")

          # ⑪½ بديلُ القيد الساقط ⑥: مقامُه الهياكلُ لا المواضع، وسقوطُه مثبَّتٌ بنصيبه،
          #      وحدُّه الضيّقُ يُعيد رقمَ البند المعلَّق ⑤ — فالمقامان لا يُخلَطان.
          S = W["بنود"]["⑥ الخاتمةُ حالةٌ لا لازمة"]
          if S["حكم"] != "سقط" or S["هياكلُ_الخاتمةِ_الساكنة"] != 1943:
