          # حارسُ تاريخٍ من يومه: حكمُ الجولة ٣ ساقطٌ برقمه، ولا تُخفَّض أرضيتُه بعده.
          print(f"حكمُ الجولة ٣ لمحرّك الربط: {S3['حكم']}")
          if not S3["حكم"].startswith("سقط") or "21" not in S3["حكم"]:
              print("::error::حكمُ الجولة ٣ الساقطُ انقلب أو تبدّل رقمُه — صريخ")
