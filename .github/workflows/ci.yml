          # ⑬ الوثيقةُ مشتقّةٌ لا محرَّرة: كلُّ رقمٍ فيها يجب أن يوجد في الوديعة نفسِها،
          #     وإلّا كانت الوثيقةُ مصدرَ رقمٍ — وذاك بابُ الرواية على القياس.
          proof = open("burhan/THE-PROOF.md", encoding="utf-8").read()
          for n in (D["شهادات"]["CERT-CORPUS"]["مقيس"]["كلمات"],
                    D["شهادات"]["CERT-W2"]["بنود"]["③ الخاتمة"]["خاتمةٌ_بسكونٍ_ذرّيّ"],
                    D["شهادات"]["CERT-SUKUN"]["لقاءُ_ساكنَين_بالأساس"]["الفلترُ الميدانيّ"]):
              if f"{n:,}" not in proof:
                  die(f"الوثيقةُ لا تحمل العددَ {n:,} — انفصلت عن الوديعة")
          if len(D["مفتوحات"]) != proof.count("\n- "):
              die("مفتوحاتُ الوديعة لا تُطابق ما تسرده الوثيقة")
          print("بيتُ البرهان: أربعةَ عشرَ حارسًا ✓")
