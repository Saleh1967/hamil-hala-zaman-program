          # ④ الأجيالُ بأربعِ آلات: اتّفاقٌ تامّ، وتعدادٌ شاملٌ إلى الثلاثيّة.
          G = C["CERT-GENERATIONS"]
          want = {"G1": 112, "G2": 11760, "G3": 1251264, "G4": 132765696}
          for k, v in want.items():
              row = G["سلّم"][k]
              if not row["متّفقة"] or row["عوديّة"] != v:
                  die(f"{k} = {row} — خالف الأربعَ آلاتٍ أو قيمتَه")
          for k in ("G1", "G2", "G3"):
