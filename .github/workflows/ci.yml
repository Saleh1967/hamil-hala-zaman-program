name: القياس الكامل على المجمَّد

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: تشغيل المحرّك الجبري
    runs-on: ubuntu-latest
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت الاعتماديات
        run: python -m pip install --upgrade pip numpy

      - name: البوّابة بالبصمة — المجمَّد المودَع أوّلًا، ولا قياس على بديلٍ صامت
        env:
          MUJAMMAD_URL: ${{ vars.MUJAMMAD_URL }}
        run: |
          set -u
          # البصمة تُقرأ من المحرّك نفسه: مصدرٌ واحدٌ للحقيقة، لا نسخةٌ ثانيةٌ تتخلّف.
          SHA="$(python - <<'PY'
          import re, pathlib
          src = pathlib.Path("algebra_engine.py").read_text(encoding="utf-8")
          print(re.search(r'MUJAMMAD_SHA256\s*=\s*"([0-9a-f]{64})"', src).group(1))
          PY
          )"
          echo "البصمة المعلنة: $SHA"

          # ١) المودَع في الشجرة — البايتات حاضرةٌ فلا مرآةَ ولا متغيّرَ سرّيّ.
          if [ -f mujammad.txt ]; then
            GOT="$(sha256sum mujammad.txt | cut -d' ' -f1)"
            if [ "$GOT" = "$SHA" ]; then
              echo "المجمَّد مودَعٌ في الشجرة وبصمتُه مطابقة ✓"
              exit 0
            fi
            echo "::error::المودَع خالف بصمته ($GOT) — ليس المجمَّد"
            exit 1
          fi

          # ٢) مسارٌ احتياطيٌّ موسوم لمن استنسخ بلا بايتات (استنساخٌ ناقص أو سحبٌ جزئيّ).
          echo "::warning::المجمَّد غيرُ مودَعٍ في الشجرة — المسار الاحتياطيّ الموسوم"
          GQ='https://raw.githubusercontent.com/globalquran/data/master/Quran/quran-simple-enhanced.txt'
          TANZIL='https://tanzil.net/pub/download/index.php?quranType=simple-enhanced&outType=txt-2&agree=true'
          for URL in "${MUJAMMAD_URL:-}" "$GQ" "$TANZIL"; do
            [ -n "$URL" ] || continue
            echo "محاولة الإحضار من مصدرٍ معلن…"
            if curl -fsSL --max-time 120 --retry 3 --retry-delay 5 -o mujammad.candidate "$URL"; then
              GOT="$(sha256sum mujammad.candidate | cut -d' ' -f1)"
              if [ "$GOT" = "$SHA" ]; then
                mv mujammad.candidate mujammad.txt
                echo "المجمَّد حاضرٌ بالبصمة ✓"
                break
              fi
              echo "::error::بصمةٌ مخالفة ($GOT) — ليس المجمَّد، ولا قياس على بديلٍ صامت"
              rm -f mujammad.candidate
              exit 1
            fi
            echo "::warning::تعذّر الوصول إلى هذا المصدر"
          done
          if [ ! -f mujammad.txt ]; then
            echo "::warning::المجمَّد غائبٌ عن كلّ مصدرٍ معلن — القياس مؤجَّلٌ باسمه، والتدقيق البنيويّ يجري كاملًا"
          fi

      - name: تشغيل المحرّك — التدقيق البنيويّ والقياس
        run: python algebra_engine.py | tee measurement.txt

      - name: البوّابة الثانية — نسخة المجمَّد في induction/ بالبصمة نفسها
        if: hashFiles('mujammad.txt') != ''
        run: |
          set -eu
          A="$(sha256sum mujammad.txt | cut -d' ' -f1)"
          B="$(sha256sum induction/mujammad.txt | cut -d' ' -f1)"
          if [ "$A" != "$B" ]; then
            echo "::error::نسخة induction/ خالفت المجمَّد ($B ≠ $A) — لا قياس على بايتاتٍ متخلّفة"
            exit 1
          fi
          echo "نسختا المجمَّد متطابقتان ✓ ($A)"

      - name: مصادمة الاستقراء — results.json مُعاد الإنتاج حرفيًّا
        run: |
          set -eu
          python induction/induction_engine.py --json=/tmp/induction.json --require-corpus \
            | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("induction/results.json", encoding="utf-8"))
          b = json.load(open("/tmp/induction.json", encoding="utf-8"))
          if a != b:
              print("::error::results.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("results.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: مصادمة الأوزان — awzan_v0.json مُعاد الإنتاج حرفيًّا
        run: |
          set -eu
          python awzan_engine.py --json /tmp/awzan.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("awzan_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/awzan.json", encoding="utf-8"))
          if a != b:
              print("::error::awzan_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("awzan_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: مصادمة المعجم — dictionary_v0.json مُعاد الإنتاج حرفيًّا
        run: |
          set -eu
          python dictionary_engine.py --json /tmp/dictionary.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("dictionary_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/dictionary.json", encoding="utf-8"))
          if a != b:
              print("::error::dictionary_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("dictionary_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: طبقة الإثراء — جدول المقاييس بالبصمة، ومصادمة maqayis_v0.json
        run: |
          set -eu
          if ./fetch_maqayis.sh; then
            python maqayis_layer.py --json /tmp/maqayis.json | tee -a measurement.txt
            python - <<'PY'
          import json, sys
          a = json.load(open("maqayis_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/maqayis.json", encoding="utf-8"))
          if a != b:
              print("::error::maqayis_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("maqayis_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY
          else
            echo "::warning::جدول المقاييس غائبٌ عن كلّ مصدرٍ معلن — الإثراء مؤجَّلٌ باسمه، ولا إثراء على بديلٍ صامت"
            python maqayis_layer.py | tee -a measurement.txt
          fi

      - name: المرحلة ٢ — ختمُ العثماني، ومصادمة waqf_v0.json
        run: |
          set -eu
          ./fetch_uthmani.sh
          SHA="$(sed -n 's/^UTHMANI_SHA256 = "\([0-9a-f]\{64\}\)".*/\1/p' waqf_layer.py | head -n 1)"
          GOT="$(sha256sum uthmani.txt | cut -d' ' -f1)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::العثمانيّ المودَع خالف بصمته ($GOT) — لا قياس حدودٍ على بديلٍ صامت"
            exit 1
          fi
          echo "النسخة العثمانية بالبصمة ✓ ($SHA)"
          python waqf_layer.py --json /tmp/waqf.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("waqf_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/waqf.json", encoding="utf-8"))
          if a != b:
              print("::error::waqf_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("waqf_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: دفعةُ الحركات — الحارسان والوقف/الوصل، ومصادمة harakat_v0.json
        run: |
          set -eu
          python harakat_layer.py --json /tmp/harakat.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("harakat_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/harakat.json", encoding="utf-8"))
          if a != b:
              print("::error::harakat_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("harakat_v0.json مُعاد الإنتاج بفارق صفر ✓")
          PY

      - name: إيداع تقرير القياس
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement
          path: measurement.txt
          if-no-files-found: warn
