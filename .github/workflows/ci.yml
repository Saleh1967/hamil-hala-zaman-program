          # ① الشبكةُ ضربٌ ديكارتيٌّ تامٌّ مولَّد — لا خليّةَ تُنتقى بعدَ رؤية الجدول.
          if sh["خلايا_الشبكة"] != sh["صيغٌ_مُعلَنة"] * sh["أبوابُ_اعتلالٍ_مُعلَنة"]:
              print("::error::شبكةُ الصيغة ليست ضربًا ديكارتيًّا تامًّا")
