          if K["لقاءُ_ساكنَين_بالأساس"]["الفلترُ الميدانيّ"] != 839:
              die("الفلترُ الميدانيُّ لم يُعِد 839 — الأساسُ تبدَّل")
          if K["تكذيبٌ_مقيس"]["الوهمُ_الذي_يضيفه_العبور"]["الفلترُ الميدانيّ"] <= 0:
