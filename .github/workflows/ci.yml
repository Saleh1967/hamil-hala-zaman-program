      - name: بوّابةُ الجرّ — الأبوابُ المُحياةُ والحدُّ المختوم، ومصادمة jar_gate.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python jar_gate.py --json /tmp/jar_gate.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("jar_gate.json", encoding="utf-8"))
          b = json.load(open("/tmp/jar_gate.json", encoding="utf-8"))
          if a != b:
              print("::error::jar_gate.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("jar_gate.json مُعاد الإنتاج بفارق صفر ✓")
          S = a["بوابة_الجر"]["الشرط"]
          # لا بابَ ميّتًا بعد اليوم: كلُّ مفسّرٍ معلنٍ يُعَدّ مستقلًّا، وصفرُه يعني كودًا ميّتًا.
          dead = [k for k, n in S["gates_alone"].items() if n == 0]
          missing = [k for k in ("جار-ملتصق", "جار-ملتصق(كاف-مفتوحة)", "حرف-جر-سابق", "إضافة",
                                 "إضافة-مشتبهة", "تابع-معطوف", "تابع-غير-معطوف",
                                 "ضمير-متصل", "ممنوع-من-الصرف",
                                 "تابع-لمقصور (جرٌّ مقدَّر)",
                                 "تابع-لمجرورٍ-بالياء (مثنى/ج.م.سالم)",
                                 "تابع-معطوف-بمنفصل",
                                 "تابع-عابرٌ-لحدّ-الآية") if k not in S["gates_alone"]]
          if dead or missing:
              print(f"::error::أبوابٌ ميتةٌ عادت ({dead + missing}) — صريخ")
              sys.exit(1)
          if sum(S["causes"].values()) != S["jar_positions"]:
              print("::error::مصالحةُ البسط خُولفت — صريخ")
              sys.exit(1)
          if sum(S["residue_kinds"].values()) != S["unexplained"]:
              print("::error::أجناسُ المتبقّي لا تُصالِح عدَّ السقوط — صريخ")
              sys.exit(1)
          # حكمُ التسجيل المسبق يُعرَض بنصّه ولا يُخفى — والسقوطُ المسمّى نتيجةٌ تُودَع.
          print(f"حكمُ التسجيل المسبق للجولة الثالثة: {S['preregistration']}")
          print(f"حكمُ التسجيل المسبق للجولة الرابعة: {S['preregistration_r4']}")
          # §٨ لا يُرفَع بمقامٍ أُعلن بعده: حكمُ الثالثة محسوبٌ على الخام ويبقى ساقطًا.
          if not S["preregistration"].startswith("سقط"):
              print("::error::حكمُ الجولة الثالثة رُفع عن سقوطه — صريخ")
              sys.exit(1)
          if S["narrowed_candidate"] + S["not_jarr_material"] != S["raw_positions"]:
              print("::error::مصالحةُ التضييق خُولفت (مضيَّق + مطروح ≠ خام) — صريخ")
              sys.exit(1)
          if S["excluded_explained"] + S["excluded_unexplained"] != S["not_jarr_material"] \
             or S["unexplained"] + S["excluded_unexplained"] != S["raw_unexplained"]:
              print("::error::مصالحةُ صنفَي المطروح خُولفت — صريخ")
              sys.exit(1)
          # شرطُ النزاهة المسجَّل: اتفاقيةُ التضييق لا تكون مفصَّلةً على العتبة.
          if S["excluded_explained"] < 0.25 * S["not_jarr_material"]:
              print("::error::المطروحُ الذي كان مفسَّرًا < 25% — اتفاقيةٌ مفصَّلةٌ على العتبة — صريخ")
              sys.exit(1)
          print(f"حكمُ التسجيل المسبق للجولة الخامسة: {S['preregistration_r5']}")
          # الأحكامُ المجمَّدة لا تتبدّل بجولةٍ تالية — الحكمُ يُختَم يومَ صدوره بأرقامه.
          if "656" not in S["preregistration"] or "1,065" not in S["preregistration"]:
              print("::error::حكمُ §٨ المجمَّد تبدّلت أرقامُه — إعادةُ كتابةٍ للتاريخ — صريخ")
              sys.exit(1)
          if "506" not in S["preregistration_r4"] or "538" not in S["preregistration_r4"]:
              print("::error::حكمُ §٩ المجمَّد تبدّلت أرقامُه — صريخ")
              sys.exit(1)
          # كاشفُ كسر الوصل لا يكون مفصَّلًا على المتبقّي: نسبةُ «كان مفسَّرًا» فيه ≥ 40%.
          if S["wasl_kasra"] and S["wasl_kasra_explained"] < 0.40 * S["wasl_kasra"]:
              print("::error::كاشفُ كسر الوصل مفصَّلٌ على المتبقّي (< 40%) — صريخ")
              sys.exit(1)
          print(f"حكمُ التسجيل المسبق للجولة السادسة: {S['preregistration_r6']}")
          if "319" not in S["preregistration_r5"] or "384" not in S["preregistration_r5"]:
              print("::error::حكمُ §١٠ المجمَّد تبدّلت أرقامُه — صريخ")
              sys.exit(1)
          # الجولةُ السادسة منعت المِقَصَّ **على نفسها**، لا على ما بعدها. فحارسُها الحيُّ
          # (المطروحُ = 709) رُفع في الجولة السابعة **معلنًا** لأنّها تطرح جنسًا سابعًا
          # بحقٍّ مسجَّل؛ ومحلُّه حارسُ النصّ المجمَّد أدناه: رقمُ 709 محفوظٌ في حكم §١١
          # فلا يضيع. ورفعُ حارسٍ يُكتَب ولا يُسكَت عنه.
          if "709" not in S["preregistration_r6"] or "325" not in S["preregistration_r6"]:
              print("::error::حكمُ §١١ المجمَّد تبدّلت أرقامُه — صريخ")
              sys.exit(1)
          # كلفةُ الإصلاح ⓪ رقمٌ مسجَّلٌ مسبقًا: تبدُّلُها صامتةً يُخفي مسًّا بالمحمول.
          if S["repair_cost_r7"] != 26:
              print("::error::كلفةُ إصلاح is_majrur تبدّلت عن 26 — صريخ")
              sys.exit(1)
          if S["nida_mudaf"] and S["nida_mudaf_explained"] < 0.50 * S["nida_mudaf"]:
              print("::error::طرحُ المنادى المضاف مفصَّلٌ على المتبقّي (< 50%) — صريخ")
              sys.exit(1)
          print(f"حكمُ التسجيل المسبق للجولة السابعة: {S['preregistration_r7']}")
          if S["residue_kinds"].get("غيرُ ذلك", 0) >= 25:
              print("::error::«غيرُ ذلك» في المتبقّي ≥ 25 — تبويبٌ ناقص — صريخ")
              sys.exit(1)
          # ═══ تفويضُ صاحب المستودع: القناةُ محروسةٌ بنفسها ═════════════════════════
          # التفويضُ قُبل قناةً لا يدًا، فالقناةُ تُحرَس: رفعٌ بلا قيدٍ في السجلّ رفعٌ صامت،
          # ورفعٌ بلا بديلٍ مصرَّحٍ به رفعٌ أعمى، وكلاهما يُبطِل معنى الحارس.
          if not S.get("delegation"):
              print("::error::نصُّ التفويض غائبٌ عن الوديعة — رفعٌ بلا سند — صريخ")
              sys.exit(1)
          for g in S["lifted_guards"]:
              if not g.get("البديل") or not g.get("بتفويض"):
                  print(f"::error::حارسٌ رُفع بلا بديلٍ أو بلا مفوِّضٍ مسمًّى: {g} — صريخ")
                  sys.exit(1)
          print(f"حرّاسٌ مرفوعةٌ بالسجلّ: {len(S['lifted_guards'])} "
                f"({' | '.join(g['الحارس'] for g in S['lifted_guards'])})")
          # حدُّ التفويض: حارسُ السياسة يُرفَع، وحارسُ التاريخ لا. فالحكمُ المختومُ الساقط
          # يبقى ساقطًا مهما رُفع من حرّاس — ورفعُه محوُ قياسٍ لا رفعُ حارس.
          for key in ("preregistration", "preregistration_r5",
                      "preregistration_r6", "preregistration_r7"):
              if not S[key].startswith("سقط"):
                  print(f"::error::حكمٌ مختومٌ ساقطٌ انقلب إلى صمود ({key}) — "
                        "هذا محوُ قياسٍ لا رفعُ حارس — صريخ")
                  sys.exit(1)
          # عيبُ الخانة (ثلاثُ جولاتٍ سقطت بالتوقيع لا بالكود): كلُّ فاصلٍ يسمّي مقياسه.
          for b in S["signed_bounds"]:
              if not b.get("المقياس"):
                  print(f"::error::فاصلٌ موقَّعٌ بلا مقياسٍ مسمًّى: {b} — صريخ")
                  sys.exit(1)
          print(f"فواصلُ موقَّعةٌ بمقاييسها: {len(S['signed_bounds'])} ✓")
          print("الأبوابُ الثلاثةَ عشرَ حيّةٌ معدودةٌ مستقلّةً، والبسطان والمتبقّي مُصالَحةٌ ✓")
          PY

      - name: بابُ العلامة والمعتلّ — فكُّ الشدة وجردُ السكونات، ومصادمة alama_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python alama_layer.py --json /tmp/alama_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("alama_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/alama_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::alama_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("alama_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["العلامة_v0"]
          # ① كلُّ محاولةِ تكذيبٍ تُرَدّ — ونجاحُ واحدةٍ يُسقِط الباب.
          broke = [t["محاولة"] for t in R["محاولاتُ_التكذيب"] if t["نجحت"]]
          if broke:
              print(f"::error::محاولةُ تكذيبٍ نجحت في باب العلامة: {broke} — صريخ")
              sys.exit(1)
          # ② مصالحةُ تفكيك العريّ: لا موضعَ يُعَدّ مرّتين ولا موضعَ يسقط بين الأصناف.
          t = R["تفكيكُ_العري"]
          if sum(t["أصناف"].values()) != t["خاتمةٌ_عارية"]:
              print("::error::أصنافُ الخاتمة العارية لا تُصالِح مجموعَها — صريخ")
              sys.exit(1)
          # ③ فكُّ الشدة لا يضيّع موضعًا: الصامتُ + العابرُ = الشدّاتُ كلُّها.
          f, inv = R["فكُّ_الشدة"], R["جردُ_السكونات"]["أصناف"]
          if inv["صامتٌ داخل الشدة"] + inv["عابرٌ للحدّ"] != f["شدّاتٌ_في_المجمَّد"]:
              print("::error::فكُّ الشدة أضاع موضعًا — صريخ")
              sys.exit(1)
          # ④ حارسُ «بداية-حامل» المختوم في harakat_layer لا يُخرَق بالفكّ: شدّةُ أوّل
          #    الكلمة صنفٌ عابرٌ للحدّ لا سكونٌ يُنسَب إليها.
          if inv["عابرٌ للحدّ"] <= 0:
              print("::error::الصنفُ العابرُ للحدّ صفرٌ — فإمّا خُرق الحارسُ وإمّا سقط الجرد — صريخ")
              sys.exit(1)
          # ⑤ الصدقُ الخاوي محجوز: كلُّ قاعدةٍ دون حدِّ شواهدها حكمُها «غيرُ مختبَرة».
          d = R["بابُ_المعتلّ"]
          for bab, rule in d["قواعد"].items():
              billed = d["فواتير"][bab].get("حكم")
              if not rule["مختبَرة"] and billed != "غيرُ مختبَرة":
                  print(f"::error::قاعدةُ «{bab}» دون حدِّ الشواهد وحكمُها {billed} — صريخ")
                  sys.exit(1)
          # ⑥ ω = 0 يحذف الحافةَ لا العقدة: الحافّاتُ الساقطةُ معدودةٌ والعقدةُ موصولة.
          if not d["ω"]["موصولة"] or not d["ω"]["ساقطة"]:
              print("::error::حكمُ ω خُولف — صريخ")
              sys.exit(1)
          # ⑦ البندُ صفر: المكيالُ سعّر مصدرين مختلفين في تجربةٍ واحدة، وصرخ على واحد.
          srcs = R["البندُ_صفر"]["تجربةُ_القبول"]["مصادر"]
          if len(srcs) < 2 or not R["البندُ_صفر"]["تجربةُ_القبول"]["مصدرٌ_واحدٌ_يصرخ"]:
              print("::error::تجربةُ عموميّةِ المكيال لم تقم على مصدرين — صريخ")
              sys.exit(1)
          print(f"حكمُ باب المعتلّ: {d['حكم']}")
          print(f"نصيبُ «المقدَّر» الحقيقيّ: {t['نصيبُ_المقدَّر']['عدد']:,} من {t['خاتمةٌ_عارية']:,} ✓")
          PY

      - name: بابُ الإملاءِ والترميز — سلّمُ الطبقات، وفاتورةُ الانتقال، ومصادمة imla_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python imla_layer.py --json /tmp/imla_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("imla_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/imla_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::imla_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("imla_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الإملاء_v0"]
          # ① كلُّ محاولةِ تكذيبٍ تُرَدّ — ونجاحُ واحدةٍ يُسقِط الباب.
          broke = [t["محاولة"] for t in R["محاولاتُ_التكذيب"] if t["نجحت"]]
          if broke:
              print(f"::error::محاولةُ تكذيبٍ نجحت في باب الإملاء: {broke} — صريخ")
              sys.exit(1)
          # ② السلّمُ خمسٌ لا سادسةَ لها، ورتبُه متّصلةٌ من صفرٍ إلى أربعة.
          rungs = [L["رتبة"] for L in R["التسجيلُ_المسبق"]["سلّمُ_الطبقات"]]
          if rungs != [0, 1, 2, 3, 4]:
              print(f"::error::سلّمُ الطبقات ليس خمسًا متّصلة: {rungs} — صريخ")
              sys.exit(1)
          # ③ كلُّ وحدةِ معالجةٍ قائمةٍ تُعلن ما تقرأ وما تكتب، ومقامُها مصادَمٌ لا موصوف.
          bad = [u["وحدة"] for u in R["طبقاتُ_المعالجة"] if u["مقام"] not in ("طابق", "—")]
          if bad:
              print(f"::error::وحدةٌ خالفت إعلانَ طبقتها: {bad} — صريخ")
              sys.exit(1)
          # ④ مصالحةُ البواقي: أصنافُها المُعلَنةُ تجمع عددَها كلَّه، ولا موضعَ بلا صنف.
          t = R["انتقالُ_٢_إلى_٣"]
          if sum(t["بواقٍ_بأصنافها"].values()) != t["بواقٍ"]:
              print("::error::أصنافُ البواقي لا تُصالِح مجموعَها — صريخ")
              sys.exit(1)
          # ⑤ n₀ المُعلَنُ بلغ، وإلّا فالحكمُ «غيرُ مختبَرة» لا «صامدة».
          if not t["n₀"]["بلغ"] and t["حكم"].startswith("صامدة"):
              print("::error::حكمٌ صامدٌ دون n₀ المُعلَن — صدقٌ خاوٍ — صريخ")
              sys.exit(1)
          # ⑥ حارسُ |Σ|/N: القاعدةُ ببواقٍ غيرُ منحلّة، وكاشفُه يلتقط «قاعدةً لكلِّ موضع».
          g = t["حارسُ_الانحلال"]
          if g["منحلّ"] or not g["قاعدةٌ_لكلِّ_موضع"]["منحلّ"]:
              print("::error::حارسُ |Σ|/N إمّا أسقط القاعدةَ وإمّا صار أعمى — صريخ")
              sys.exit(1)
          # ⑦ إشارةُ Δ تصادم الحكمَ المكتوب: لا نثرَ يخالف فاتورتَه.
          if (t["Δ"] < 0) != t["حكم"].startswith("صامدة"):
              print(f"::error::حكمُ دعوى H خالف إشارةَ Δ ({t['Δ']}) — صريخ")
              sys.exit(1)
          # ⑧ كلُّ دعوى في المحكمة بحقولها الستة وبحكمٍ من الأصناف المُعلَنة.
          kinds = set(R["التسجيلُ_المسبق"]["دعوى_H"]["أحكامٌ_مُعلَنة"])
          for c in R["محكمةُ_الدعاوى"]:
              miss = [f for f in ("نصّ", "صاحب", "طبقة", "مقام", "مكذِّب", "علّة")
                      if not c.get(f)]
              if miss or c["حكم"] not in kinds:
                  print(f"::error::دعوى «{c['رمز']}» ناقصةٌ {miss} أو حكمُها {c['حكم']} — صريخ")
                  sys.exit(1)
          # ⑨ دَينُ حذفِ الرسم التوقيفيّ: مُغلَقٌ بمقامٍ أو معلَّقٌ بصنفِ احتياجه — لا ثالثَ.
          st = R["مقامُ_الطبقة_٢"]
          if not st["حكم"].startswith("مُغلَق") or not st["معلَّقٌ_بصنفه"]:
              print("::error::دَينُ حذفِ الرسم التوقيفيّ لا مغلقٌ ولا معلَّقٌ بصنفه — صريخ")
              sys.exit(1)
          print(f"فاتورةُ الانتقال ٢ ⟶ ٣: Δ {t['Δ']:,.0f} — {t['حكم']}")
          print(f"دعاوى المحكمة: {len(R['محكمةُ_الدعاوى'])} بأصنافها المُعلَنة ✓")
          PY

      - name: بابُ التشكيل — السكونُ الصامتُ أوّلًا، وسلّمُ الرتب، ومصادمة tashkil_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python tashkil_layer.py --json /tmp/tashkil_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("tashkil_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/tashkil_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::tashkil_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("tashkil_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["التشكيل_v0"]
          # ① كلُّ محاولةِ تكذيبٍ تُرَدّ — ونجاحُ واحدةٍ يُسقِط الباب.
          broke = [t["محاولة"] for t in R["محاولاتُ_التكذيب"] if t["نجحت"]]
          if broke:
              print(f"::error::محاولةُ تكذيبٍ نجحت في باب التشكيل: {broke} — صريخ")
              sys.exit(1)
          # ② الأحكامُ الثلاثةُ لا تنشئ طبقةً سادسة: رتبةُ كلِّ حكمٍ من سلّم imla_layer.
          import imla_layer as IM
          bad = [r["حكم"] for r in R["التسجيلُ_المسبق"]["الأحكامُ_الثلاثة"]
                 if r["رتبة"] not in IM.LAYER_NAME or r["طبقة"] != IM.LAYER_NAME[r["رتبة"]]]
          if bad:
              print(f"::error::حكمٌ على رتبةٍ خارجَ سلّم الطبقات: {bad} — صريخ")
              sys.exit(1)
          # ③ السكونُ الصامتُ يُصالِح مواضعَ التضعيف: صامتٌ + عابرٌ للحدّ = الشدّةُ كلُّها.
          s = R["السكونُ_الصامتُ_أوّلًا"]
          if s["سكونٌ_صامت"] + s["عابرٌ_للحدّ"] != s["مواضعُ_التضعيف"]:
              print("::error::أصنافُ الشدّة لا تُصالِح مواضعَها — صريخ")
              sys.exit(1)
          # ④ لكلِّ مهمّةٍ: إشارةُ Δ تصادم حكمَها المكتوب، ولا نثرَ يخالف فاتورتَه.
          for task, L in R["سلالمُ_الفاتورة"].items():
              if (L["Δ"] < 0) != (L["حكم"] == "يُقبَل"):
                  print(f"::error::حكمُ {task} خالف إشارةَ Δ ({L['Δ']}) — صريخ")
                  sys.exit(1)
              win = [r for r in L["رتب"] if r["رتبة"] == L["الفائزة"]]
              if not win or win[0]["منحلّ"]:
                  print(f"::error::الرتبةُ الفائزةُ في {task} منحلّةٌ أو مفقودة — صريخ")
                  sys.exit(1)
              if min(r["كلفة"] for r in L["رتب"]) != win[0]["كلفة"]:
                  print(f"::error::الفائزةُ في {task} ليست أرخصَ الرتب — صريخ")
                  sys.exit(1)
          # ⑤ السلّمُ ينعطف في مهمّةٍ واحدةٍ على الأقلّ — وإلّا فدعوى «المزيدُ أفضل» قائمة.
          if not any(L["انعطافٌ_عند"] for L in R["سلالمُ_الفاتورة"].values()):
              print("::error::لا انعطافَ في سلّمٍ البتّة — حدُّ السلّم لم يُختبَر — صريخ")
              sys.exit(1)
          # ⑥ القسمةُ الحاكمة: الخاتمةُ (إعراب) أغلى من الداخل (رسم)، والمواضعُ تُصالِح.
          d = R["القسمةُ_الحاكمة"]
          if d["نسبةُ_الغلاء"] <= 1:
              print("::error::الخاتمةُ ليست أغلى من الداخل — دعوى ت٣ ساقطة — صريخ")
              sys.exit(1)
          if (d["قسمة"]["داخل"]["مواضع"] + d["قسمة"]["خاتمة"]["مواضع"]
                  != s["مواضعُ_الرسم"]):
              print("::error::قسمةُ الداخل والخاتمة لا تُصالِح مواضعَ الرسم — صريخ")
              sys.exit(1)
          # ⑦ العتبةُ تفرز فعلًا، والتنبُّؤُ [شاهدٌ] لا حكم، والحادُّ والمشتبهُ يُصالِحان.
          for task, P in R["التطبيقُ_على_المحجوب"].items():
              if not P["العتبةُ_تفرز"]:
                  print(f"::error::عتبةُ الاشتباه في {task} زينةٌ لا تفرز — صريخ")
                  sys.exit(1)
              if P["صنف"] != "[شاهد]" or not P["شرطُ_تقاعده"]:
                  print(f"::error::تنبُّؤُ {task} أُعلن حكمًا أو بلا شرطِ تقاعد — صريخ")
                  sys.exit(1)
              if P["حادّ"] + P["مشتبه"] != P["اختبار"]:
                  print(f"::error::الحادُّ والمشتبهُ في {task} لا يُصالِحان — صريخ")
                  sys.exit(1)
          # ⑧ محطّةُ العاري: عمًى معدودٌ يُصالِح، ولا دعوى صوابٍ على مقامٍ لا حَكَمَ فيه.
          b = R["محطّةُ_العاري"]
          if b["صنف"] != "[شاهد]" or not b["شرطُ_تقاعده"] or not b["ما_لا_يُدَّعى"]:
              print("::error::محطّةُ العاري أُعلنت حكمًا أو بلا شرطِ تقاعد — صريخ")
              sys.exit(1)
          if len(b["قراءات"]) != 2:
              print("::error::قراءتا الرسم ليستا اثنتين — مقامٌ زِيد أو طُوي — صريخ")
              sys.exit(1)
          for r in b["قراءات"]:
              if not r["حدّ"] or not r["ثمن"]:
                  print(f"::error::قراءةُ {r['قراءة']} بلا حدٍّ أو بلا ثمنٍ معلن — صريخ")
                  sys.exit(1)
              if sum(r["خارجَ_الأبجدية_بصورها"].values()) != r["خارجَ_الأبجدية"]:
                  print(f"::error::عمى الحرف في {r['قراءة']} لا يُصالِح صورَه — صريخ")
                  sys.exit(1)
              for task, m in r["مهامّ"].items():
                  if m["سياقٌ_معروف"] + m["سياقٌ_مجهول"] != r["مواضع"]:
                      print(f"::error::معروفُ {task} ومجهولُه لا يُصالِحان — صريخ")
                      sys.exit(1)
                  if m["حادّ"] + m["مشتبه"] != r["مواضع"] or m["حادّ"] > m["سياقٌ_معروف"]:
                      print(f"::error::حدّةُ {task} على العاري لا تُصالِح — صريخ")
                      sys.exit(1)
          # ⑨ الانتقالُ إلى مقامٍ ثانٍ ليس مجّانًا: حدّةُ العاري دون حدّةِ المحجوب.
          raw = b["قراءات"][0]["مهامّ"]["ط٢ الهيئة"]["نصيبُ_الحادّ"]
          ph = R["التطبيقُ_على_المحجوب"]["ط٢ الهيئة"]
          if raw >= ph["حادّ"] / ph["اختبار"]:
              print("::error::الانتقالُ إلى العثمانيِّ بلا ثمنٍ في الحدّة — صريخ")
              sys.exit(1)
          print(f"التضعيفُ Δ {R['سلالمُ_الفاتورة']['ط١ التضعيف']['Δ']:,.0f} · "
                f"الهيئةُ Δ {R['سلالمُ_الفاتورة']['ط٢ الهيئة']['Δ']:,.0f} · "
                f"غلاءُ الخاتمة {d['نسبةُ_الغلاء']}× · "
                f"عمى العاري {b['قراءات'][0]['خارجَ_الأبجدية']:,} حرفًا ✓")
          PY

      - name: بابُ المنهج — مراسٍ في بايتاتهم، وجسرُ تصريح، ومصادمة manhaj_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          # بايتاتُ شهودِ مغني اللبيب الثلاثة جُلبت في خطوة «شهودُ الخارج» أعلاه،
          # لأنّ سجلَّ الأختام يسبق هذه الخطوةَ ويعيد تشغيل هذا المولِّد.
          python manhaj_gate.py --json /tmp/manhaj_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("manhaj_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/manhaj_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::manhaj_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("manhaj_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["المنهج_v0"]
          # ① كلُّ محاولةِ تكذيبٍ تُرَدّ — ونجاحُ واحدةٍ يُسقِط الباب.
          broke = [t["محاولة"] for t in R["محاولاتُ_التكذيب"] if t["نجحت"]]
          if broke:
              print(f"::error::محاولةُ تكذيبٍ نجحت في باب المنهج: {broke} — صريخ")
              sys.exit(1)
          # ② المراسي تُصادَم بالبايتات: بصمةٌ وطولٌ وفرادةٌ في الشاهد المختوم.
          for name, an in R["مراسٍ"].items():
              if len(an["بصمة"]) != 64 or an["طول"] <= 0:
                  print(f"::error::مرساةُ «{name}» بلا بصمةٍ أو بلا طول — صريخ")
                  sys.exit(1)
          # ③ تخالفُ مرايا الوسم يُودَع ولا يُتَّخذ سندًا.
          m = R["جسرُ_التصريح"]["تخالفُ_الوسم"]
          if m["يُتَّخذُ_سندًا"]:
              print("::error::وسمُ الناسخ اتُّخذ سندًا مع تخالف المرايا — صريخ")
              sys.exit(1)
          # ④ رقمُ ما خرج عن حدِّنا لا يدخل حكمًا، وحارسُه ليس خاويًا.
          lim = R["دفترُ_العطوب"]["منعُ_الحدّ"]
          if lim["عطب"] or not lim["ذو_أثر"]:
              print("::error::منعُ «حدُّنا لا حدُّهم» خُولف أو صار خاويًا — صريخ")
              sys.exit(1)
          # ⑤ ω = 0 يحذف الحافةَ لا العقدة.
          if not R["ω"]["موصولة"]:
              print("::error::انقطعت حافّاتُ باب المنهج كلُّها — صريخ")
              sys.exit(1)
          # ⑥ n₀ مُعلَنٌ ونافذ: ما دونه حكمُه «غيرُ مختبَر» لا «صامد».
          for r in R["دفترُ_الضوابط"]:
              n = r.get("مواضعُ_الإطلاق", 0)
              if n < R["التسجيلُ_المسبق"]["فواصل"]["n\u2080 مواضع"]["قيمة"] and r["حكم"] != "غيرُ مختبَر":
                  print(f"::error::ضابطُ «{r['ضابط']}» دون n₀ وحكمُه {r['حكم']} — صريخ")
                  sys.exit(1)
              if r.get("فاتورة") and not r["ترجمةٌ_يدوية"]:
                  print(f"::error::ضابطُ «{r['ضابط']}» بلا تصريحِ الترجمة اليدوية — صريخ")
                  sys.exit(1)
          # ⑦ الأرقامُ الثلاثةُ تُطبَع، وأوّلُها ما خرج عن حدِّنا.
          t = R["الأرقامُ_الثلاثة"]
          print(f"ما خرج عن حدِّنا: {t['حجمُ_ما_خرج_عن_الحدّ']:.2%} من مادّتهم")
          v = t["ما_صمد_من_ترجمتنا"]
          print(f"ما صمد من ترجمتنا لضابطهم: {v['صامد']}/{v['مختبَر']} ({v['نسبة']:.2%})")
          print(f"توزيعُ أصنافِ العطب: {t['توزيعُ_أصنافِ_العطب']}")
          PY

      - name: بابُ الإيداع — الشخصيةُ ج٣ نصًّا مقيسًا، ومصادمة shakhsiyya_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          # الحاويةُ مودَعةٌ في الشجرة، فلا جلبَ ههنا — والبصمةُ تُقرأ من المُستخرِج
          # نفسِه لا من نسخةٍ ثانيةٍ تتخلّف.
          SHA="$(sed -n 's/^CONTAINER_SHA256 = "\([0-9a-f]\{64\}\)".*/\1/p' shakhsiyya_extract.py | head -n 1)"
          GOT="$(sha256sum "الشخصية الاسلامية الجزء الثالث ورد (2).docx" | cut -d' ' -f1)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::حاويةُ الشخصية ج٣ خالفت بصمتَها ($GOT) — لا استخراجَ على بديلٍ صامت"
            exit 1
          fi
          echo "حاويةُ الشخصية ج٣ بالبصمة ✓ ($SHA)"
          # الوديعتان تُعادان من الحاوية وتُصادمان ببايتاتهما — فارقُ صفرٍ أو صريخ.
          python shakhsiyya_extract.py --check | tee -a measurement.txt
          python shakhsiyya_extract.py --json /tmp/shakhsiyya_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("shakhsiyya_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/shakhsiyya_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::shakhsiyya_v0.json المودَع خالف ما يُنتجه المُستخرِج — صريخ")
              sys.exit(1)
          print("shakhsiyya_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الشخصية_ج٣"]
          # ① الأداةُ مسمّاةٌ بإصدارها — فلا استخراجَ بيدٍ مجهولة.
          if not R["الأداة"]["اسم"] or not R["الأداة"]["إصدار"]:
              print("::error::نصٌّ مقيسٌ بلا أداةٍ مسمّاةٍ بإصدارها — صريخ")
              sys.exit(1)
          # ② تخالفُ NFC ترتيبٌ لا تأليف: تبدُّلُ حرفٍ واحدٍ يُسقِط البابَ.
          for name, d in R["تخالفُ_NFC"].items():
              if d["تأليف"]:
                  print(f"::error::تيارُ {name}: {d['تأليف']} سطرًا يتبدّل جردُه تحت NFC — صريخ")
                  sys.exit(1)
          # ③ الطبعةُ مقيسةٌ من بايتات الحاوية لا منقولةٌ عن دعوى.
          marks = R["الحاوية"]["شواهدُ_الطبعة"]
          for key in ("الطبعة الثالثة", "1426", "معتمدة"):
              if not marks.get(key):
                  print(f"::error::شاهدُ الطبعة «{key}» معدومٌ في المتن المقيس — صريخ")
                  sys.exit(1)
          # ④ الحواشي تيارٌ ثانٍ مختومٌ لا يدخل المتن — وصفرُه معلَنٌ لا مطويّ.
          if R["الحواشي"]["طول"] or R["الحواشي"]["أسطر"]:
              print("::error::تيارُ الحواشي تحرّك عن صفره المختوم — يُحدَّث ختمُه بيدٍ معلنة")
              sys.exit(1)
          # ⑤ المقصيُّ معدودٌ لا مبتلَع، والجداولُ مرفوعةٌ بأبعادها.
          led = R["المقصيُّ_معدودًا"]
          print("المقصيُّ معدودًا: " + " · ".join(
              f"{k}={v}" for k, v in led.items() if isinstance(v, int)))
          print(f"جداولُ رُفعت للمراجعة: {R['مراجعةٌ_للمالك']['جداولُ_تحمل_متنًا']}")
          print(f"المتنُ المقيس: {R['المتن']['طول']:,} بايتًا · {R['المتن']['كلمات']:,} كلمةً")
          PY

      - name: بابُ الدلالات — دعاوى النبهانيِّ السبع، ومصادمة dalalat_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # المتنُ مودَعٌ في الشجرة بختمه، والمجمَّدُ كذلك. وشهودُ الحديث الأربعةُ
          # (الصحيحان بنسختيهما) جُلبوا في خطوة «شهودُ الخارج» أعلاه، ويُصادَمون
          # داخلَ الباب بأختامهم من sources_manifest.tsv — والغائبُ يُسمّى بالمخرج 3.
          # والمراسي تُصادَم بإزاحةٍ وبصمةٍ وفرادة — فيسقط بـ4 إن زُحزح المتن.
          python dalalat_gate.py --json /tmp/dalalat_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("dalalat_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/dalalat_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::dalalat_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("dalalat_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الدلالات_v0"]
          # ① الشرطُ القاطع: الإيماءُ لا يدخل خانةَ حكمٍ البتّة.
          if R["منعُ_الإيماء"]["الحكمُ_المنفَّذ"] != "ج":
              print("::error::دلالةُ الإيماء دخلت خانةَ حكمٍ — والمنعُ باتّ")
              sys.exit(1)
          # ② والمنعُ يحرس شيئًا: لو رُفع قيدُه لخرج عن (ج) — وإلّا فهو زينةٌ لا حارس.
          if not R["منعُ_الإيماء"]["ذو_أثر"]:
              print("::error::منعُ الإيماء بلا أثر — حارسٌ يحرس الخواء")
              sys.exit(1)
          # ③ عدَّةُ الدعاوى وصفوفِها معلنةٌ قبل القياس، لا تُشتقّ من المخرَج.
          if R["مقيس"]["دعاوى"] != 7 or R["مقيس"]["صفوف"] != 11:
              print("::error::عدَّةُ الدعاوى أو صفوفِها تحرّكت عن إعلانها — صريخ")
              sys.exit(1)
          # ④ الأصنافُ الأربعةُ تستوعب الصفوفَ كلَّها — لا صفَّ بلا خانة.
          kinds = {k: R["مقيس"][k] for k in ("أ", "ب", "ج", "د")}
          if sum(kinds.values()) != R["مقيس"]["صفوف"]:
              print(f"::error::مجموعُ الأصناف {sum(kinds.values())} ≠ الصفوف — صفٌّ بلا خانة")
              sys.exit(1)
          # ⑤ الخانةُ (أ) فارغةٌ ما دام مقامُ الحكم الشرعيِّ غيرَ مودَعٍ بختمه —
          #    فراغٌ معلنٌ مصادَم، لا انتصارٌ يُدَّعى ولا نقصٌ يُطوى.
          if not R["مقامُ_الحكم_مودَع"] and kinds["أ"]:
              print("::error::(أ) امتلأت بلا مقامِ حكمٍ مختوم — رقمٌ بلا سند")
              sys.exit(1)
          # ⑥ محاولاتُ التكذيب تُشغَّل بعدّتها المختومة ولا تنجح واحدةٌ منها —
          #    والعدُّ مصادَمٌ لئلّا تُسقَط محاولةٌ صامتةً في تعديلٍ لاحق.
          t = R["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != R["مقيس"]["محاولاتُ_تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          print("الأصناف: " + " · ".join(f"({k}) {v}" for k, v in kinds.items()))
          w = R["شواهدُ_النبهاني"]
          print(f"شواهدُ النبهاني: مذكورةٌ {w['مذكورة']} · في حدِّنا {w['في_حدِّنا']} · "
                f"خارجَه {w['خارجَ_حدِّنا']} — عيّنةٌ افتتاحيةٌ تُعلَن ولا تدخل حكمًا")
          # ⑦ قبولُ الخارجيِّ يستوعب الخارجَ كلَّه: مقبولٌ + معلَّقٌ = خارجَ حدِّنا.
          #    فلا شاهدٌ خارجيٌّ يسقط من العدّ بين الخانتين.
          e = R["تحقُّقُ_الشواهد_الخارجية"]
          if e["مقبول"] + e["معلَّق"] != w["خارجَ_حدِّنا"] \
             or e["خارجيٌّ"] != w["خارجَ_حدِّنا"]:
              print("::error::قبولُ الشاهد الخارجيِّ لا يستوعب الخارجَ كلَّه — عدٌّ مفقود")
              sys.exit(1)
          # ⑧ وكلُّ مقبولٍ بنسختَي كتابٍ فعلًا، وله مرساةٌ على المطويّ — لا قبولَ بالاسم.
          for v in e["صفوف"]:
              accepted = v["حكم"].startswith("مقبول")
              if accepted != bool(v["كتبٌ_بنسختيها"]) or (accepted and "مرساة" not in v):
                  print(f"::error::شاهدٌ قُبل بلا نسختين أو بلا مرساة: {v['شاهد'][:40]}")
                  sys.exit(1)
          # ⑨ والقبولُ لا يمسُّ حكمًا: المجموعُ المقبولُ يُعلَن، والأصنافُ الأربعةُ كما هي
          #    — ومحاولتا التكذيب ⑧ و⑨ في الباب هما اللتان تحرسان هذا فعلًا.
          if R["مقيس"]["الشواهدُ_المقبولةُ_جملةً"] != w["في_حدِّنا"] + e["مقبول"]:
              print("::error::جملةُ المقبول لا تساوي (في حدِّنا + المقبول بالتحقُّق)")
              sys.exit(1)
          print(f"قبولُ الخارجيِّ: مقبولٌ {e['مقبول']} · معلَّقٌ {e['معلَّق']} · "
                f"مردودٌ بنسخةٍ واحدة {e['نسخةٌ_واحدةٌ_مردودة']} — "
                f"والمقبولُ جملةً {R['مقيس']['الشواهدُ_المقبولةُ_جملةً']} من {w['مذكورة']}")
          PY

      - name: بابُ المدلول — خانةُ الهجاء ومعجمُ الأدوات والمبنيّات، ومصادمة madlul_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # المتنُ والمجمَّدُ مودَعان بختميهما، ونسخُ ابنِ هشامٍ وألفيةُ ابنِ مالكٍ
          # جُلبت في خطوة «شهودُ الخارج» أعلاه (والقائمةُ تُقرأ من MABNI_BOOKS نفسِها
          # فلا تشيخ). والغائبُ يُسمَّى بالمخرج 3 ولا يُقاس على غيابٍ مطويّ.
          python madlul_gate.py --json /tmp/madlul_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("madlul_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/madlul_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::madlul_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("madlul_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["المدلول_v0"]; M = R["مقيس"]
          # ① محاولاتُ التكذيب تُشغَّل بعدَّتها المختومة ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ_تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          # ② برهانُ الفصل في خانة الهجاء منصوصٌ كلُّه: ثلاثيُّ «ضرب» بمهمَلِه واسمِه
          #    — فلو زُحزح المتنُ أو نقص واحدٌ منها سقط البابُ ولم يُلفَّق.
          H = R["خانةُ_حروف_الهجاء"]
          if M["الثلاثيُّ المنصوصُ في بابه"] != len(H["الثلاثيُّ_المنصوص"]):
              print("::error::ثلاثيُّ «ضرب» لم يقع كلُّه في بابه — برهانُ الفصل ساقط")
              sys.exit(1)
          for x in H["الثلاثيُّ_المنصوص"]:
              if not (x["المهمَلُ_في_بابها"] and x["الاسمُ_في_بابها"]):
                  print(f"::error::«{x['مهمَل']}/{x['اسم']}» ليس كلاهما في بابه — صريخ")
                  sys.exit(1)
          # ③ نصيبُ المهمَل في المجمَّد صفرٌ **بنصِّ صاحب القسمة** لا بسكوتنا — ومواضعُ
          #    الفواتح تُعَدّ وتُعلَن وتُصالِح صورَها، فالصفرُ مُعلَّلٌ لا مُدَّعًى.
          Z = H["صفرُ_المجمَّد"]
          if M["نصيبُ المهمَلِ في المجمَّد"] != 0 or not Z["نصّ"]:
              print("::error::نصيبُ المهمَل ليس صفرًا أو بلا نصٍّ يحمله — صريخ")
              sys.exit(1)
          if sum(f["مواضع"] for f in Z["صورُ_الفواتح"]) != Z["مواضعُ_الفواتح"]:
              print("::error::صورُ الفواتح لا تُصالِح مواضعَها — عدٌّ مفقود")
              sys.exit(1)
          # ④ أسماءُ الهجاء: المتحقِّقُ والمعلَّقُ يستوعبان القائمةَ المغلقة، ولا اسمَ
          #    يُقحَم من عندنا — والمعلَّقُ يُسمّى ولا يُطرَح.
          if M["أسماءٌ متحقِّقةٌ بالنسختين"] + M["أسماءٌ معلَّقة"] != M["أسماءُ الهجاء"]:
              print("::error::متحقِّقُ أسماء الهجاء ومعلَّقُها لا يستوعبان القائمة")
              sys.exit(1)
          # ⑤ المعجمُ: الميدانُ وخارجُه يستوعبان الأصنافَ كلَّها، والخارجُ لا يُسعَّر.
          if M["أصنافٌ في الميدان"] + M["أصنافٌ خارجَ الميدان"] != M["أصنافُ المعجم"]:
              print("::error::أصنافُ الميدان وخارجِه لا تستوعب المعجم — صنفٌ بلا خانة")
              sys.exit(1)
          if M["أصنافٌ مُودَعةٌ بالفاتورة"] + M["أصنافٌ مردودةٌ بالفاتورة"] \
                  != M["أصنافٌ في الميدان"]:
              print("::error::حكمُ الفاتورة لا يستوعب أصنافَ الميدان — صريخ")
              sys.exit(1)
          if M["أصنافٌ غلبت ضوابطَ المثل"] + M["أصنافٌ لم تغلب ضوابطَ المثل"] \
                  != M["أصنافٌ في الميدان"]:
              print("::error::حكمُ ضوابط المثل لا يستوعب أصنافَ الميدان — صريخ")
              sys.exit(1)
          # ⑥ **الحارسُ الذي يمنع الغشَّ**: خواءُ الحكم المفرد مقيسٌ ومُعلَنٌ لا مطويّ.
          #    فرقةٌ عشوائيّةٌ بعددِ صورِ المعجم نالت «مُودَعةٌ بالبرهان» — فلو طُوي هذا
          #    لقُرئ قبولُ الثمانية فضيلةً للمعجم وهو تحصيلُ حاصل.
          if M["الحكمُ المفردُ خاوٍ"] != 1:
              print("::error::خواءُ الحكم المفرد لم يُقَس — قبولُ الأصناف يُقرأ فضيلةً وهو خواء")
              sys.exit(1)
          # ⑦ وضوابطُ المثل تفرز فعلًا: لو غلبت الأصنافُ كلُّها أمثالَها لكان المقياسُ
          #    خاويًا كسابقه — فالسقوطُ المُعلَن هو الدليلُ على أنّه يفصل.
          if not (0 < M["أصنافٌ غلبت ضوابطَ المثل"] < M["أصنافٌ في الميدان"]):
              print("::error::ضوابطُ المثل لا تفرز — مقياسٌ يقبل الكلَّ أو يردُّ الكلَّ")
              sys.exit(1)
          # ⑧ المبنيّاتُ الثلاث: غيابُ طائفتين عن الشخصية مقيسٌ مُعلَن، ومصدرُ مدلولها
          #    شاهدٌ مختومٌ بنسختين — والنسخةُ الواحدةُ ضابطٌ يجب ألّا يُحقِّق.
          B = R["المبنيّاتُ_الثلاث"]
          if M["مداخلُ متحقِّقةٌ بالنسختين"] + M["مداخلُ معلَّقة"] != M["مداخلُ المبنيّات"]:
              print("::error::متحقِّقُ المبنيّات ومعلَّقُها لا يستوعبان المداخل")
              sys.exit(1)
          if B["ضابطُ_النسخةِ_الواحدة"]["يُحقِّق"] \
                  or B["ضابطُ_النسخةِ_الواحدة"]["مداخلُ_حقّقها"]:
              print("::error::كتابٌ بنسخةٍ واحدةٍ حقَّق مدخلًا — قاعدةُ النسختين خُفِّفت")
              sys.exit(1)
          if not B["المصنوع"]["مردود"] or B["المصنوع"]["كتبٌ_حقّقته"]:
              print("::error::المدخلُ المصنوعُ لم يُرَدّ — القاعدةُ تقبل ما لا وجودَ له")
              sys.exit(1)
          if M["طوائفُ غائبةٌ عن الشخصية"] < 1:
              print("::error::غيابُ الموصول والإشارة لم يُقَس — طيُّ دَينٍ مستور")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          print(f"الهجاء: منصوصٌ {M['أسماءٌ منصوصةٌ في الشخصية']} · "
                f"متحقِّقٌ {M['أسماءٌ متحقِّقةٌ بالنسختين']} · "
                f"معلَّقٌ {M['أسماءٌ معلَّقة']} — ونصيبُ المهمَل في المجمَّد صفرٌ بنصِّه")
          print(f"المعجم: أصنافٌ {M['أصنافُ المعجم']} · فرقٌ {M['فرقٌ في الأصناف']} · "
                f"أدواتٌ {M['أدواتٌ مُعلَنة']} · مدلولاتٌ منصوصةٌ {M['مدلولاتٌ منصوصة']} · "
                f"بلا مدلولٍ {M['أدواتٌ بلا مدلولٍ منصوص']}")
          print(f"الميدان: غلبت المثلَ {M['أصنافٌ غلبت ضوابطَ المثل']} · "
                f"لم تغلب {M['أصنافٌ لم تغلب ضوابطَ المثل']} — "
                f"والحكمُ المفردُ خاوٍ مقيسًا لا مقولًا")
          print(f"المبنيّات: مداخلُ {M['مداخلُ المبنيّات']} · "
                f"متحقِّقٌ بالنسختين {M['مداخلُ متحقِّقةٌ بالنسختين']} · "
                f"معلَّقٌ {M['مداخلُ معلَّقة']} — بشاهدٍ مختومٍ لا باجتهادٍ منّا")
          PY

      - name: بابُ الدالّ — انتقالاتُ الحقل 112 وترخيصُها، ومصادمة dall_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا شاهدَ خارجيًّا ههنا: المقامُ المجمَّدُ المودَعُ بختمه، والحقلُ من
          # `field112_laws`، والقوالبُ من `algebra_engine` — فلا جلبَ ولا غياب.
          python dall_gate.py --json /tmp/dall_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("dall_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/dall_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::dall_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("dall_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الدالّ_v0"]; M = R["مقيس"]
          # ① محاولاتُ التكذيب تُشغَّل بعدَّتها المختومة ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ_تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          # ② حدُّ الحقل: لا خليّةَ خارجَ 112، لا هدفًا ولا صدرًا. ولو تجاوزت لكان
          #    المقامُ غيرَ مقام `field112_laws` وسقط ادّعاءُ «الفاتورةُ نفسُها».
          F = R["الحقلُ_وانتقالاتُه"]
          if F["خلايا_الحقل"] != 112 or M["خلايا هدفٍ مشغولة"] > 112 \
                  or M["خلايا صدرٍ مشغولة"] > 112:
              print("::error::خليّةٌ خارجَ الحقل 112 — المقامُ ليس مقامَ field112_laws")
              sys.exit(1)
          # ③ **الحارسُ الذي يمنع الغشَّ**: المكسبُ المفردُ لا يُقرَأ حكمًا. فطائفةُ
          #    ذواتِ المدلولِ كسبت 1.3579 بتًّا وهي **ساقطةٌ** — لأنّ ما سواها كسب
          #    أكثر، ولأنّ ستًّا من ضوابط المثل أضيقُ منها. فلو طُوي هذا لقُرئ
          #    المكسبُ الموجبُ برهانًا وهو تحصيلُ حاصلٍ كخواءِ الحكمِ المفردِ في
          #    باب المدلول.
          B = R["الطائفتان"]
          if B["ذواتُ_المدلول"]["مكسبٌ_بالبتّ"] <= 0:
              print("::error::طائفةُ ذوات المدلول لم تكسِب شيئًا — لا مقياسَ ولا سقوط")
              sys.exit(1)
          if M["ذواتُ المدلولِ غلبت المثل"] != int(
                  B["ذواتُ_المدلول"]["بالخليّة_السابقة"]
                  < min(r["بالخليّة_السابقة"] for r in B["ضوابطُ_المثل"])):
              print("::error::حكمُ الطائفة لا يُصالِح ضوابطَ مثله — رقمٌ بيد")
              sys.exit(1)
          if len(B["ضوابطُ_المثل"]) != 11:
              print("::error::ضوابطُ المثل ليست إحدى عشرةَ — عدَّةٌ خُفِّفت")
              sys.exit(1)
          # ④ والحكمُ مُعلَنٌ بسقوطه: الطائفةُ المعلَنةُ **لا تفصِل**، وهذا مودَعٌ
          #    لا مطويّ. فلو انقلب يومًا إلى غلبةٍ وجب إعادةُ الختم بيدٍ لا صمتًا.
          if M["ذواتُ المدلولِ غلبت سواها"] or M["ذواتُ المدلولِ غلبت المثل"]:
              print("::error::الطائفةُ فصَلت والمختومُ سقوطُها — أعِد الختمَ بيدك")
              sys.exit(1)
          if not (0 < M["ضوابطُ مثلٍ غُلِبت"] < 11):
              print("::error::ضوابطُ المثل لا تفرز — تُغلَب كلُّها أو لا تُغلَب واحدة")
              sys.exit(1)
          # ⑤ خلايا الترخيصِ تُطلِق ولا تُضيِّق — وهذا مقيسٌ بوجهين: انتروبيا
          #    التالي، ونصيبُ البقيّةِ هيكلًا حرًّا. والثاني لا يفصِل أيضًا.
          P = R["الخلايا_المرخَّصة"]
          if M["المرخَّصةُ تُضيِّق"] or P["متوسطُ_انتروبيا_المرخَّصة"] \
                  <= P["متوسطُ_انتروبيا_سواها"]:
              print("::error::الخليّةُ المرخَّصةُ ضيَّقت والمختومُ إطلاقُها — صريخ")
              sys.exit(1)
          if M["سواها فوقَ أدنى المرخَّصة"] < 1:
              print("::error::الانفصالُ فصَل والمختومُ خواؤه — أعِد الختمَ بيدك")
              sys.exit(1)
          # ⑥ الترخيصُ بالقالب: المودَعُ موجبٌ **فوقَ الخليّةِ السابقة** ويغلِب
          #    قوالبَ مخلوطةً بالعدّةِ والتوزيعِ والموضعِ نفسِها. ولولا المخلوطُ
          #    لكان المكسبُ الموجبُ ثمنَ معالمَ لا ترخيصَ ميزان.
          Q = R["الترخيصُ_بالقالب"]
          if M["مكسبُ القالبِ فوقَ السابقة"] <= 0 or not M["القالبُ غلبَ المثل"]:
              print("::error::القالبُ لم يكسِب أو لم يغلِب مثلَه — الترخيصُ ساقط")
              sys.exit(1)
          if Q["أعلى_مثلٍ"] >= M["مكسبُ القالبِ فوقَ السابقة"]:
              print("::error::مخلوطٌ بلغ المودَع — المكسبُ من العدّةِ لا من الميزان")
              sys.exit(1)
          if len(Q["ضوابطُ_المثل"]) != 11:
              print("::error::ضوابطُ مثلِ القالبِ ليست إحدى عشرةَ — عدَّةٌ خُفِّفت")
              sys.exit(1)
          # ⑦ **الحارسُ الفاصل**: البابُ يفرز — لا يقبل الكلَّ ولا يردُّ الكلَّ.
          #    سقطت الطائفةُ وسقط الانفصالُ، وأُودِع القالب. فلو استوت الثلاثةُ
          #    قبولًا أو ردًّا لكان المقياسُ خاويًا وسقط الباب.
          verdicts = {M["ذواتُ المدلولِ غلبت المثل"], M["المرخَّصةُ تُضيِّق"],
                      M["القالبُ غلبَ المثل"]}
          if len(verdicts) != 2:
              print("::error::البابُ لا يفرز — ثلاثُ محطّاتٍ بحكمٍ واحد")
              sys.exit(1)
          # ⑧ شبكةُ الميزانِ تُقرأ من `algebra_engine` ولا تُنسَخ: 15 قالبًا × 8
          #    أعمدة، والخلايا تستوعب المأذونَ والممنوعَ والسماعيَّ بلا بقيّة.
          if M["خلايا مأذونة"] + M["خلايا ممنوعةٌ لزومًا"] + M["خلايا سماعيّة"] \
                  != M["خلايا الميزان"]:
              print("::error::خلايا الميزان لا تستوعب أحكامَها — خليّةٌ بلا خانة")
              sys.exit(1)
          G = R["شبكةُ_الميزان"]
          if G["مجرَّد"] + G["مزيد"] != G["قوالب"] or G["قوالب"] * G["أعمدة"] \
                  != M["خلايا الميزان"]:
              print("::error::شبكةُ الميزان لا تُصالِح قوالبَها وأعمدتَها — صريخ")
              sys.exit(1)
          # ⑨ **الحارسُ الرياضيّ**: عدُّ `120 · 98 · 21 · 1` عدُّ جدولٍ لا
          #    برهانَ فيه. والبرهانُ ثمنُ الشبكةِ بالبتّ: رمزٌ **مكتمِلٌ** يصفها
          #    كلَّها دونَ حدِّ التوافيق log₂C(120,22) الذي هو ثمنُ أيِّ شبكةٍ
          #    بعدّةِ الممنوعِ نفسِها بلا بنية. ولولا ضوابطُ المثل لكان الوفرُ
          #    الموجبُ تحصيلَ حاصلٍ كخواءِ الحكمِ المفرد.
          D = G["الحدُّ_الأدنى_المكتمل"]
          if M["الحدُّ الأدنى المكتمِل"] >= M["حدُّ التوافيق"]:
              print("::error::الشبكةُ لم تنزل دونَ حدِّ التوافيق — لا بنيةَ تُسعَّر")
              sys.exit(1)
          if M["الميزانُ غلبَ المثل"] != 11 or len(D["ضوابطُ_المثل"]) != 11:
              print("::error::مثلٌ بلغَ الحدَّ أو عدَّةُ المثلِ خُفِّفت — الوفرُ من العدّة")
              sys.exit(1)
          if not M["رحلةُ الميزانِ مكتملة"] or D["خلايا_ضاعت"]:
              print("::error::رحلةُ الترميزِ ناقصةٌ — حدٌّ أدنى لوصفٍ مبتور")
              sys.exit(1)
          if D["التنقيحُ_يُرخِص"] or any(f <= M["الحدُّ الأدنى المكتمِل"]
                                        for f in D["أثمانُ_التنقيح"]):
              print("::error::تنقيحُ القسمةِ أرخصُ — فالأخشنُ ليس أدنى")
              sys.exit(1)
          if D["أنماطُ_الصفوف"] >= G["قوالب"] or D["أنماطُ_الأعمدة"] >= G["أعمدة"]:
              print("::error::لا اختزالَ في الصفوفِ ولا الأعمدة — القسمةُ مفرداتٌ")
              sys.exit(1)
          if round(M["حدُّ التوافيق"] - M["الحدُّ الأدنى المكتمِل"], 4) \
                  != M["وفرٌ عن التوافيق"]:
              print("::error::الوفرُ لا يُصالِح طرفَيه — رقمٌ بيد")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          print(f"الحقل: انتقالاتٌ {M['انتقالاتُ الحقل']:,} · خلايا هدفٍ "
                f"{M['خلايا هدفٍ مشغولة']}/112 · مكسبُ الجوار "
                f"{M['مكسبُ الخليّةِ السابقة']} بت")
          print(f"الطائفتان: ذواتُ المدلولِ {M['حروفُ ذوات المدلول']} حرفًا "
                f"(مكسبٌ {B['ذواتُ_المدلول']['مكسبٌ_بالبتّ']}) ⟷ ما سواها "
                f"{B['ما_سواها']['مكسبٌ_بالبتّ']} — **سقطت**، وغُلِب من المثل "
                f"{M['ضوابطُ مثلٍ غُلِبت']}/11")
          print(f"الترخيصُ في الخليّة: انتروبيا التالي مرخَّصةٌ "
                f"{P['متوسطُ_انتروبيا_المرخَّصة']} ⟷ سواها "
                f"{P['متوسطُ_انتروبيا_سواها']} — تُطلِق ولا تُضيِّق")
          print(f"شبكةُ الميزان: أنماطُ صفوفٍ {D['أنماطُ_الصفوف']}/{G['قوالب']} · "
                f"أعمدةٍ {D['أنماطُ_الأعمدة']}/{G['أعمدة']} · رتبةٌ بوليانيّةٌ "
                f"{M['رتبةُ الميزانِ البوليانيّة']} — استثناءان لا اثنان وعشرون")
          print(f"الحدُّ الأدنى المكتمِل: {M['الحدُّ الأدنى المكتمِل']} بتًّا "
                f"({D['أرخصُ_رمزٍ']}) ⟷ حدُّ التوافيق {M['حدُّ التوافيق']} "
                f"⟷ أدنى مثلٍ {D['أدنى_مثلٍ']} — وفرٌ {M['وفرٌ عن التوافيق']} بت")
          print(f"الترخيصُ بالقالب: مكسبٌ {M['مكسبُ القالبِ فوقَ السابقة']} بت "
                f"فوقَ الجوار ⟷ أعلى مخلوطٍ {Q['أعلى_مثلٍ']} — **أُودِع**")
          PY

      - name: بابُ الوضع — علامةُ الآخِر فوقَ الصورة، ومصادمة wad3_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا شاهدَ خارجيًّا ههنا: المقامُ المجمَّدُ المودَعُ بختمه، والحقلُ
          # الثمانيُّ وحاكمُه من `harakat_layer`، ووديعتا المحاورِ والحركاتِ من
          # الشجرة — فلا جلبَ ولا غياب.
          python wad3_gate.py --json /tmp/wad3_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("wad3_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/wad3_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::wad3_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("wad3_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الوضع_v0"]; M = R["مقيس"]
          # ① محاولاتُ التكذيب تُشغَّل بعدَّتها المختومة ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ_تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          # ② المحورُ الثاني مفتوحٌ بختمه ومكيالُه منصوصٌ فيه. ولو أُغلق أو
          #    زُحزح نصُّ مكياله لوجب إعادةُ فتحِ البابِ لا مواصلتُه صامتًا.
          X = R["المحور"]
          if not (X["مفتوح"] and X["تحقّقَ_شرطُه"]) or X["رتبة"] != 2:
              print("::error::المحورُ الثاني مغلقٌ أو زُحزحت رتبتُه — البابُ بلا إذن")
              sys.exit(1)
          # ③ أرقامُ الجسرِ تُصادَم بوديعة الحركات: لا رقمَ يُكتَب مرّتين.
          if X["بنودٌ_مُصادَمة"] != M["بنودُ الحركاتِ المُصادَمة"] or X["بنودٌ_مُصادَمة"] < 4:
              print("::error::بنودُ الحركاتِ لم تُصادَم بعدَّتها — رقمٌ مكتوبٌ مرّتين")
              sys.exit(1)
          # ④ الاستقراءُ تامٌّ: الحالاتُ الثماني تستوعب المقامَ بلا بقيّة، والميدانُ
          #    وخارجُه يجمعانه، والرحلةُ تعيد كلَّ علامةٍ بقسمتها.
          F = R["الميدانُ_القابلُ_للتكذيب"]
          if F["مجموعُ_الحالات"] != F["مقام"] or len(F["الحالاتُ_الثماني"]) != 8:
              print("::error::الحقلُ لا يستوعب المقامَ أو ليس ثمانيةً — استقراءٌ ناقص")
              sys.exit(1)
          if M["مواضعُ الميدان"] + M["مواضعُ خارجه"] != M["مقام"]:
              print("::error::الميدانُ وخارجُه لا يجمعان المقامَ — موضعٌ بلا خانة")
              sys.exit(1)
          if M["الرحلةُ تامّة"] != M["مقام"] or F["مصرَّحٌ_بها"] != M["مواضعُ الميدان"]:
              print("::error::الرحلةُ ناقصةٌ أو المصرَّحُ بها ليس الميدانَ — قسمةٌ مبتورة")
              sys.exit(1)
          # ⑤ **الحارسُ الذي يمنع تحصيلَ الحاصل**: لو كانت كلُّ صورةٍ أحاديّةَ
          #    العلامةِ لكان القياسُ كلُّه صفرًا مقنَّعًا. فالميدانُ يجب أن يكون
          #    غيرَ خاوٍ وغيرَ مستغرِقٍ للمقام، وصورُه تأتي بعلامتين فأكثر.
          if not (0 < M["صورُ الميدان"] < M["صورٌ مختلفة"]) \
                  or not (0 < M["مواضعُ الميدان"] < M["مقام"]):
              print("::error::الميدانُ خاوٍ أو مستغرِق — لا موضعَ للتكذيب")
              sys.exit(1)
          if F["أدنى_علاماتِ_صورة"] < 2 or F["أقصى_علاماتِ_صورة"] < 2:
              print("::error::صورةٌ أحاديّةُ العلامةِ في الميدان — قاعدةُ العزلِ خُرِقت")
              sys.exit(1)
          # ⑥ الصورةُ هي الجوار: مكسبُها موجبٌ ويُطرَح قبلَ أن يُنسَب شيءٌ للوضع.
          C = R["مصادمةُ_المكاييل"]
          if M["مكسبُ الصورةِ في الميدان"] <= 0 or round(
                  C["بلا_مكيال"] - C["بالصورةِ_وحدَها"], 4) != M["مكسبُ الصورةِ في الميدان"]:
              print("::error::مكسبُ الصورةِ لا يُصالِح طرفَيه أو ليس موجبًا — رقمٌ بيد")
              sys.exit(1)
          if C["مقام"] != M["مواضعُ الميدان"] or C["ضوابطُ_المثل"] != 11:
              print("::error::مقامُ المصادمةِ ليس الميدانَ أو عدَّةُ المثلِ خُفِّفت")
              sys.exit(1)
          # ⑦ **الحارسُ الفاصل**: البابُ يفرز — مكيالٌ أُودِع وأربعةٌ سقطت. ولو
          #    استوت الخمسةُ قبولًا أو ردًّا لكان المقياسُ خاويًا وسقط الباب.
          rows = C["مكاييل"]
          if len(rows) != M["مكاييلُ الوضع"] or M["مكاييلُ الوضع"] < 5:
              print("::error::مكاييلُ الوضعِ نقصت عن عدَّتها المختومة — انتقاءٌ بعدَ القياس")
              sys.exit(1)
          if M["مكاييلُ مُودَعة"] + M["مكاييلُ ساقطةٌ بالثمن"] \
                  + M["مكاييلُ ساقطةٌ بالضابط"] != M["مكاييلُ الوضع"]:
              print("::error::أحكامُ المكاييلِ لا تجمع عدَّتَها — مكيالٌ بلا حكم")
              sys.exit(1)
          if not (0 < M["مكاييلُ مُودَعة"] < M["مكاييلُ الوضع"]):
              print("::error::البابُ لا يفرز — خمسةُ مكاييلَ بحكمٍ واحد")
              sys.exit(1)
          # ⑧ **الحارسُ الذي يمنع الغشَّ**: غلبةُ ضوابطِ المثل وحدَها **خاويةٌ
          #    مقيسًا** ههنا — خمسةٌ من خمسةٍ غلبت وأربعةٌ منها مكسبُها سالب.
          #    فلو قُرئت الغلبةُ حكمًا لأُودِع الحاكمُ وهو ساقطٌ بالثمن.
          if M["مكاييلُ غلبت المثل"] != sum(1 for r in rows if r["غلبَ_المثل"]):
              print("::error::عدُّ الغلبةِ لا يُصالِح صفوفَه — رقمٌ بيد")
              sys.exit(1)
          if M["خواءُ غلبةِ المثل"] < 1:
              print("::error::خواءُ غلبةِ المثلِ لم يُقَس — الوجهُ الواحدُ دعوى")
              sys.exit(1)
          for r in rows:
              deposited = r["حكم"].startswith("مُودَع")
              if deposited != (r["مكسبٌ_موجب"] and r["غلبَ_المثل"]):
                  print(f"::error::حكمُ «{r['مكيال']}» لا يُصالِح وجهَيه — حكمٌ بيد")
                  sys.exit(1)
              if r["غلبَ_المثل"] != (r["مكسبٌ_فوقَ_الصورة"] > r["أعلى_المثل"]) \
                      or len(r["ضوابطُ_المثل"]) != 11:
                  print(f"::error::غلبةُ «{r['مكيال']}» لا تُصالِح مثلَها — عدَّةٌ خُفِّفت")
                  sys.exit(1)
          # ⑨ **التكذيبُ المختوم**: الحاكمُ السابق — عاملُ الإعرابِ الموروث —
          #    **ساقطٌ بالثمن**، ومكسبُه سالبٌ فوقَ الصورة. وهذا مودَعٌ لا مطويّ:
          #    فلو انقلب يومًا إلى إيداعٍ وجب إعادةُ الختمِ بيدٍ لا صمتًا.
          hakim = next(r for r in rows if r["مكيال"] == "الحاكمُ السابق")
          if hakim["مكسبٌ_موجب"] or not hakim["حكم"].startswith("ساقطٌ"):
              print("::error::الحاكمُ اشترى والمختومُ سقوطُه — أعِد الختمَ بيدك")
              sys.exit(1)
          wasl = next(r for r in rows if r["مكيال"] == "شرطُ الوصل")
          if not wasl["حكم"].startswith("مُودَع") \
                  or wasl["مكسبٌ_فوقَ_الصورة"] != M["مكسبُ الوصلِ فوقَ الصورة"]:
              print("::error::شرطُ الوصلِ سقط أو خالف ختمَه — أعِد الختمَ بيدك")
              sys.exit(1)
          # ⑩ سدادُ دَين `edge_vs_governor`: المقامان جُمعا في رقمٍ واحد، والنصيبُ
          #    والباقي يجمعان الواحدَ الصحيح — والجوابُ «لا» مودَعٌ برقمه.
          G = R["جسرُ_الدَّين"]
          if round(G["نصيبُ_الحاكمِ_من_الفضل"] + G["الباقي_بعدَه"], 4) != 1.0:
              print("::error::نصيبُ الحاكمِ وباقيه لا يجمعان الفضلَ — رقمٌ بيد")
              sys.exit(1)
          if G["فضلُ_الخاتمةِ_بلا_شرط"] <= G["فضلُ_الخاتمةِ_بالحاكم"] \
                  and G["نصيبُ_الحاكمِ_من_الفضل"] > 0:
              print("::error::الفضلُ لم ينقص والنصيبُ موجب — الجسرُ لا يُصالِح نفسَه")
              sys.exit(1)
          if not G["جواب"].startswith("لا") or G["نصيبُ_الحاكمِ_من_الفضل"] >= 0.5:
              print("::error::الحاكمُ فسَّر أكثرَ الفضلِ والمختومُ خلافُه — أعِد الختمَ")
              sys.exit(1)
          # ⑪ الديونُ تُسمّى بعددها ولا تُدّعى مقيسة.
          if len(R["ديونٌ_بلا_رقم"]) != M["ديونٌ مسمّاة"] or M["ديونٌ مسمّاة"] < 4:
              print("::error::ديونُ البابِ نقصت عن عدَّتها — دَينٌ طُوي")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          print(f"الحقل: {len(F['الحالاتُ_الثماني'])} حالاتٍ تستوعب "
                f"{F['مجموعُ_الحالات']:,} موضعًا بلا بقيّة · الرحلةُ "
                f"{M['الرحلةُ تامّة']:,}/{M['مقام']:,}")
          print(f"الميدان: {M['صورُ الميدان']:,}/{M['صورٌ مختلفة']:,} صورةً · "
                f"{M['مواضعُ الميدان']:,} موضعًا ({F['نصيبُ_الميدان']}) — "
                f"وخارجَه {M['مواضعُ خارجه']:,} تحصيلُ حاصلٍ يُسمّى بعدده")
          print(f"الجوار: بلا مكيالٍ {C['بلا_مكيال']} ⟶ بالصورةِ وحدَها "
                f"{C['بالصورةِ_وحدَها']} — فالصورةُ تشتري "
                f"{M['مكسبُ الصورةِ في الميدان']} بتًّا قبلَ الوضع")
          for r in rows:
              print(f"  {r['مكيال']}: {r['مكسبٌ_فوقَ_الصورة']:+.4f} بت "
                    f"({r['مكسبٌ_كلّيٌّ_بالبتّ']:+,.1f}) ⟷ أعلى مثلٍ "
                    f"{r['أعلى_المثل']:+.4f} — {r['حكم']}")
          print(f"خواءُ غلبةِ المثل: {M['مكاييلُ غلبت المثل']}/5 غلبت المثلَ "
                f"ومكسبُ {C['خواءُ_غلبةِ_المثل']['عدد']} منها سالب — "
                f"فالوجهُ الواحدُ **خاوٍ مقيسًا**")
          print(f"جسرُ الدَّين: فضلُ الخاتمةِ {G['فضلُ_الخاتمةِ_بلا_شرط']} ⟶ "
                f"{G['فضلُ_الخاتمةِ_بالحاكم']} بالحاكم — نصيبُه "
                f"{G['نصيبُ_الحاكمِ_من_الفضل']} ويبقى {G['الباقي_بعدَه']} ⟹ لا")
          PY

      - name: بابُ المبنيِّ والمعرب — قسمةُ اللفظِ بالبتّ، ومصادمة mabna_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا شاهدَ خارجيًّا ههنا: المجمَّدُ المودَعُ بختمه، ومعجمُ الأدواتِ
          # مستورَدٌ من `madlul_gate.MU3JAM` المنتزَعِ من المتن بمراسيه — فلا جلب.
          python mabna_gate.py --json /tmp/mabna_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("mabna_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/mabna_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::mabna_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("mabna_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["المبنى_v0"]; M = R["مقيس"]
          # ① محاولاتُ التكذيب تُشغَّل بعدَّتها المختومة ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ_تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          # ② القسمةُ تستوعب المقامَ بلا بقيّة — طائفةٌ وما سواها، لا ثالثَ.
          D = R["القسمةُ_المُعلَنة"]
          if M["مواضعُ المبنيِّ المُعلَن"] + M["مواضعُ سواه"] != M["مقام"]:
              print("::error::القسمةُ لا تجمع المقامَ — موضعٌ بلا خانة")
              sys.exit(1)
          if D["لازمةُ_الآخِر"] + D["متغيّرةُ_الآخِر"] != M["أدواتٌ حاضرةٌ صورةً"]:
              print("::error::اللازمُ والمتغيّرُ لا يجمعان الأدواتِ الحاضرة — رقمٌ بيد")
              sys.exit(1)
          # ③ **التكذيبُ المختوم**: دعوى «المبنيُّ لا يتغيّر آخرُه» **ساقطةٌ بالعدّ**.
          #    وهذا مودَعٌ لا مطويّ: فلو انقلب يومًا إلى لزومٍ وجب إعادةُ الختم بيدٍ
          #    لا صمتًا — ولا يُقرَأ سقوطُها إقرارًا بأنّ المبنيَّ معربٌ، بل بأنّ
          #    مضمونَ القسمةِ غيرُ المدَّعى (وهو ما يُقاس في ④).
          if M["متغيّرةُ الآخِر"] < 1 or not D["حكمُ_دعوى_اللزوم"].startswith("ساقطة"):
              print("::error::دعوى اللزومِ قامت والمختومُ سقوطُها — أعِد الختمَ بيدك")
              sys.exit(1)
          # ④ **الحارسُ الفاصل**: القسمةُ تُشترى بالبتّ — موجبةٌ في الطائفةِ
          #    وغيرُ موجبةٍ فيما سواها. ولو اشترى الوصلُ في الطائفتين معًا لكان
          #    المكسبُ مكسبَ الوصلِ لا مكسبَ القسمة، ولسقط البابُ كلُّه.
          B = R["شراءُ_القسمةِ_بالبتّ"]
          if M["مكسبُ الوصلِ في المبنيّ"] <= 0 or M["مكسبُ الوصلِ في سواه"] > 0:
              print("::error::القسمةُ لا تفرز — الوصلُ يشتري في الطائفتين أو لا يشتري")
              sys.exit(1)
          if round(B["المبنيُّ_بالصورة"] - B["المبنيُّ_بالصورةِ_والوصل"], 4) \
                  != M["مكسبُ الوصلِ في المبنيّ"]:
              print("::error::مكسبُ المبنيِّ لا يُصالِح طرفَيه — رقمٌ بيد")
              sys.exit(1)
          # ⑤ وضوابطُ المثل بعدَّتها، **وبعدّةِ المواضعِ لا الصور**: ولولا ذلك
          #    لجاءت الفرقةُ بمقامٍ أصغرَ فكان الفارقُ فارقَ مقامٍ لا فارقَ قسمة.
          if len(B["ضوابطُ_المثل"]) != 11 or not M["غلبَ المثل"]:
              print("::error::عدَّةُ المثلِ خُفِّفت أو مثلٌ بلغَ القسمةَ — المكسبُ من العدّة")
              sys.exit(1)
          if B["أعلى_المثل"] >= M["مكسبُ الوصلِ في المبنيّ"]:
              print("::error::أعلى المثلِ بلغَ المودَع — القسمةُ لا تُميَّز")
              sys.exit(1)
          # ⑥ **العواملُ ساقطةٌ بالثمن** — ومودَعٌ سقوطُها. وهي أدقُّ من الحاكمِ
          #    الثلاثيِّ في `wad3_gate`، فلو اشترت ههنا لانقلبَ ذاك الحكمُ صمتًا.
          A = R["العوامل"]
          if M["مكسبُ العواملِ فوقَ الصورة"] > 0 or not A["حكم"].startswith("ساقط"):
              print("::error::العواملُ اشترت والمختومُ سقوطُها — أعِد الختمَ بيدك")
              sys.exit(1)
          if not (0 < M["أصنافُ العواملِ الحاضرة"] <= M["أصنافُ العواملِ المُعلَنة"]):
              print("::error::الأصنافُ الحاضرةُ تجاوزت المُعلَنةَ أو خلت — صنفٌ مخترَع")
              sys.exit(1)
          # ⑦ والمعتلُّ **قائمٌ بالعدّ** — ولا يُخلَط قيامُه بسقوطِ العوامل: البابُ
          #    يفرز، فلا تستوي محطّاتُه على حكمٍ واحد.
          U = R["المعتلُّ_الآخِر"]
          if M["نصيبُ المقدَّرِ في المعتلّ"] <= M["نصيبُ المقدَّرِ في الصحيح"]:
              print("::error::المعتلُّ لم يفرز والمختومُ قيامُه — أعِد الختمَ بيدك")
              sys.exit(1)
          if U["مواضعُ_المعتلّ"] + U["مواضعُ_الصحيح"] != M["مقام"]:
              print("::error::قسمةُ الاعتلالِ لا تستوعب المقامَ — موضعٌ بلا خانة")
              sys.exit(1)
          # ⑧ **الحَجْرُ يبقى حَجْرًا**: منعُ الصرفِ لا يُقرَأ مردودًا ولا مقبولًا.
          #    ولو صُفِّر خطأُ الوكيلِ لَقُرئ حكمًا على قاعدةٍ لم تُختبَر.
          H = R["حَجْرُ_منعِ_الصرف"]
          if not (0 < M["نسبةُ خطأِ وكيلِ منعِ الصرف"] < 1) \
                  or not H["حكم"].startswith("محجورة"):
              print("::error::وكيلُ منعِ الصرفِ قُرئ حكمًا — والمختومُ حَجْرُه")
              sys.exit(1)
          if not H["مخالفاتٌ_مسمّاة"]:
              print("::error::المخالفاتُ بلا أسماء — حَجْرٌ بلا حدٍّ مقيس")
              sys.exit(1)
          # ⑨ الديونُ تُسمّى بعددها ولا تُدّعى مقيسة.
          if len(R["ديونٌ_بلا_رقم"]) != M["ديونٌ مسمّاة"] or M["ديونٌ مسمّاة"] < 5:
              print("::error::ديونُ البابِ نقصت عن عدَّتها — دَينٌ طُوي")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          print(f"القسمة: {M['أدواتٌ حاضرةٌ صورةً']} أداةً حاضرةً · "
                f"{M['متغيّرةُ الآخِر']} تغيّرَ آخرُها ⟹ دعوى اللزوم "
                f"**{D['حكمُ_دعوى_اللزوم']}**")
          print(f"الشراءُ بالبتّ: المبنيُّ {M['مكسبُ الوصلِ في المبنيّ']:+.4f} "
                f"({B['مكسبٌ_كلّيٌّ_بالبتّ']:+,.1f}) ⟷ سواه "
                f"{M['مكسبُ الوصلِ في سواه']:+.4f} ⟷ أعلى مثلٍ "
                f"{B['أعلى_المثل']:+.4f} — **{B['حكم']}**")
          print(f"العوامل: {M['أصنافُ العواملِ الحاضرة']}/"
                f"{M['أصنافُ العواملِ المُعلَنة']} صنفًا · "
                f"{M['مكسبُ العواملِ فوقَ الصورة']:+.4f} بت — **{A['حكم']}**")
          print(f"المعتلّ: {M['نصيبُ المقدَّرِ في المعتلّ']} ⟷ "
                f"{M['نصيبُ المقدَّرِ في الصحيح']} · فارقٌ {U['الفارق']:+.4f} — "
                f"**{U['حكم']}**")
          print(f"منعُ الصرف: خطأُ الوكيلِ "
                f"{M['نسبةُ خطأِ وكيلِ منعِ الصرف']:.2%} — **{H['حكم']}**")
          PY

      - name: بابُ النسبِ وجبرِ الإحداثيات — النسبُ الثلاثُ ومنعُ الصرف، ومصادمة nisab_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا شاهدَ خارجيًّا ههنا: المجمَّدُ المودَعُ بختمه، ومعجمُ الأدواتِ
          # مستورَدٌ من `madlul_gate.MU3JAM` المنتزَعِ من المتن بمراسيه — فلا جلب.
          python nisab_gate.py --json /tmp/nisab_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("nisab_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/nisab_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::nisab_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("nisab_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["النسب_v0"]; M = R["مقيس"]
          # ① محاولاتُ التكذيب تُشغَّل بعدَّتها المختومة ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["المحاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          # ② **الحارسُ الأصل**: النسبُ تُقاس فوقَ الهامشِ لا فوقَ الصورة. ولو
          #    شُرِطت بالصورةِ لكان المكسبُ صفرًا **بالبناء** — فالإحداثيُّ دالّةٌ
          #    فيها — فهذا حارسُ نزاهةِ الجوارِ لا حارسُ رقم.
          N = R["النسبُ_الثلاث"]
          if R["الحدُّ_المُعلَن"]["الجوار"].split("—")[0].strip() != "هامشُ إحداثيِّ التالية":
              print("::error::الجوارُ تبدَّل عن هامشِ الإحداثيّ — قياسٌ بالبناء لا بالبرهان")
              sys.exit(1)
          # ③ والنسبُ الثلاثُ كلُّها تشتري بتًّا وتغلب مثلَها — **وإلّا سقط الباب**.
          if len(N["صفوف"]) != 3 or N["مُودَعةٌ_بالوجهين"] + N["ساقطة"] != 3:
              print("::error::صفوفُ النسبِ نقصت أو لا تجمع عدَّتَها — نسبةٌ طُويت")
              sys.exit(1)
          if N["مُودَعةٌ_بالوجهين"] != M["نسبٌ مُودَعةٌ بالوجهين"]:
              print("::error::عدُّ النسبِ المودَعةِ خالفَ ختمَه — رقمٌ بيد")
              sys.exit(1)
          # ④ وضوابطُ المثل **خلطُ الأزواج** بعدَّتها: تُبقي الهامشَ وتهدم
          #    الاقتران، فلا يكون الفارقُ فارقَ مقامٍ ولا فارقَ هامش.
          for r in N["صفوف"]:
              if len(r["ضوابطُ_المثل"]) != 11:
                  print(f"::error::عدَّةُ مثلِ {r['النسبة']} خُفِّفت — المكسبُ من العدّة")
                  sys.exit(1)
              if r["مكسبٌ_فوقَ_الهامش"] <= 0 or r["أعلى_المثل"] >= r["مكسبٌ_فوقَ_الهامش"]:
                  print(f"::error::{r['النسبة']} لم تشترِ بتًّا أو بلغَها مثلُها — صريخ")
                  sys.exit(1)
              # الطرفان مُدوَّران والمكسبُ مُدوَّرٌ عن فرقٍ غيرِ مُدوَّر، فالمصالحةُ
              # بهامشِ تدويرٍ واحدٍ لا بمطابقةٍ حرفيّة — وهو فرقٌ مُعلَن لا مبتلَع.
              if abs(round(r["بالهامشِ_وحدَه"] - r["بالنسبة"], 4)
                     - r["مكسبٌ_فوقَ_الهامش"]) > 0.0001:
                  print(f"::error::مكسبُ {r['النسبة']} لا يُصالِح طرفَيه — رقمٌ بيد")
                  sys.exit(1)
          # ⑤ ولا تُجمَع النسبُ في رقمٍ واحد: حقولُها مختلفةُ الحجم، فمقاماتُها
          #    لا تُجمَع — كما لم يُجمَع مقاما `jumla_links`.
          if len({r["حجمُ_الحقل"] for r in N["صفوف"]}) < 2:
              print("::error::النسبُ استوت حقولًا — مقامان جُمِعا في رقم")
              sys.exit(1)
          # ⑥ وشاهدُ التضمينيّةِ بالعدّ يصدّق شاهدَها بالبتّ: الكسرُ بعدَ الجارِّ
          #    أكثفُ منه في سواه. ولو انقلبَ لسقطت التضمينيّةُ ولو ربحت بتًّا.
          if M["نصيبُ الكسرِ بعدَ الجار"] <= M["نصيبُ الكسرِ في سواه"]:
              print("::error::الكسرُ بعدَ الجارِّ لم يكثُف — التضمينيّةُ بلا شاهدِ عدّ")
              sys.exit(1)
          # ⑦ **منعُ الصرفِ: الدَّينُ مرفوعٌ بالإحداثيِّ لا بوكيلِ الرسم.** والحَكَمُ
          #    ثباتُ الصنفِ في موضعٍ حُجِب عن مُتنبِّئِه، فوقَ القاعدةِ العظمى.
          P = R["منعُ_الصرف"]
          if M["صدقُ الصورةِ خارجَ موضعِها"] <= M["القاعدةُ العظمى"]:
              print("::error::الصنفُ لم يثبت خارجَ موضعِه — والمختومُ قيامُه")
              sys.exit(1)
          if len(P["ضوابطُ_المثل"]) != 11 or P["أعلى_المثل"] >= P["فضلُ_الصدق"]:
              print("::error::عدَّةُ مثلِ منعِ الصرفِ خُفِّفت أو بلغَها مثلُها — صريخ")
              sys.exit(1)
          if P["كسرٌ"] + P["فتحٌ"] != M["ميدانُ الجرِّ المفحوص"]:
              print("::error::ميدانُ الجرِّ لا يجمع علامتَيه — موضعٌ بلا خانة")
              sys.exit(1)
          # ⑧ والصنفُ **لا يبتلع الميدان**: صنفٌ يسع كلَّ صورةٍ ليس صنفًا.
          if not (0 < M["صورُ صنفِ منعِ الصرف"] < M["صورٌ مختلفة"] / 100):
              print("::error::صنفُ منعِ الصرفِ خلا أو ابتلعَ الميدانَ — ليس صنفًا")
              sys.exit(1)
          if not P["أعلى_صورِ_الصنف"]:
              print("::error::صنفٌ بلا صورٍ مسمّاة — دعوى بلا حدٍّ مقيس")
              sys.exit(1)
          # ⑨ **العواملُ تُصادَم ولا تُصدَّق**: الدعوى المُعلَنةُ رقمٌ مكتوبٌ،
          #    والمقيسُ رقمٌ مُشتَقّ — والفرقُ يُسمّى ولا يُطوى.
          A = R["العوامل"]
          if M["عواملُ محسوبةُ السطح"] != A["الدعوى_المُعلَنة"] + A["فرقُ_الدعوى_عن_المقيس"]:
              print("::error::فرقُ الدعوى لا يُصالِح طرفَيه — رقمٌ بيد")
              sys.exit(1)
          if not A["النواسخُ_سطحٌ_محسوب"] or not A["نواسخُ_حاضرةٌ_عاملة"]:
              print("::error::النواسخُ لم يُحسَب سطحُها — والمختومُ أنّها محسوبة")
              sys.exit(1)
          # ⑩ والعاملُ المعنويُّ **دَينٌ بحدٍّ مقيسٍ** لا قاعدةٌ ولا عدم: يُسمّى
          #    بعدَّةِ ما عليه أن يسعَه، ولا يُقرَأ مقامًا ولا إبطالًا.
          if not (0 < M["حدُّ العاملِ المعنويِّ المقيس"] < M["مقام"]):
              print("::error::حدُّ العاملِ المعنويِّ خلا أو ابتلعَ المقامَ — دَينٌ بلا حدّ")
              sys.exit(1)
          if not any("المعنوي" in d["الدَّين"] for d in R["ديونٌ_بلا_رقم"]):
              print("::error::العاملُ المعنويُّ خرجَ من الديون — دَينٌ طُوي")
              sys.exit(1)
          # ⑪ وثمنُ الخريطةِ يُقاس **قبل** أن تُستعمَل، وخلاياها لا تتجاوز إعلانَها.
          C = R["الإحداثيات"]
          if C["ثمنُ_إعلانِ_الإحداثياتِ_كلِّها"] <= 0 \
                  or C["خلايا_الحقلِ_الصرفيّ"] != C["حجمُ_الحقلِ_الصرفيِّ_المُعلَن"]:
              print("::error::خريطةٌ بلا ثمنٍ أو خلايا تجاوزت إعلانَها — صريخ")
              sys.exit(1)
          print(f"محاولاتُ التكذيب: {len(t)} — لم تنجح واحدةٌ منها ✓")
          for r in N["صفوف"]:
              print(f"{r['النسبة']}: ن={r['مقام']:,} m={r['حجمُ_الحقل']} · "
                    f"{r['مكسبٌ_فوقَ_الهامش']:+.4f} بت ⟷ أعلى مثلٍ "
                    f"{r['أعلى_المثل']:+.4f} — **{r['حكم']}**")
          print(f"شاهدُ التضمينيّةِ بالعدّ: كسرٌ بعدَ الجارِّ "
                f"{M['نصيبُ الكسرِ بعدَ الجار']} ⟷ في سواه "
                f"{M['نصيبُ الكسرِ في سواه']}")
          print(f"منعُ الصرف: صدقٌ خارجَ الموضع "
                f"{M['صدقُ الصورةِ خارجَ موضعِها']} ⟷ القاعدةُ العظمى "
                f"{M['القاعدةُ العظمى']} · صنفٌ من {M['صورُ صنفِ منعِ الصرف']} "
                f"صورةً — **{P['حكم']}** ({P['حالُ_الدَّين']})")
          print(f"العوامل: محسوبةُ السطحِ {M['عواملُ محسوبةُ السطح']} ⟷ "
                f"الدعوى {A['الدعوى_المُعلَنة']} — **{A['حكمُ_الدعوى']}** · "
                f"والمعنويُّ دَينٌ بحدِّه {M['حدُّ العاملِ المعنويِّ المقيس']:,}")
          PY

      - name: بابُ الجملة — تمييزُ العطفِ من الاستئناف، ومصادمة jumla_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # لا شاهدَ خارجيًّا ههنا: المجمَّدُ المودَعُ بختمه، وتقطيعُ
          # `jumla_links.segment` بعينه — وحكمُها الساقطُ بالتغطية لا يُمَسّ.
          python jumla_gate.py --json /tmp/jumla_v0.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("jumla_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/jumla_v0.json", encoding="utf-8"))
          if a != b:
              print("::error::jumla_v0.json المودَع خالف ما يُنتجه الباب — صريخ")
              sys.exit(1)
          print("jumla_v0.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الجملة_v0"]; M = R["مقيس"]
          # ① محاولاتُ التكذيب تُشغَّل بعدَّتها المختومة ولا تنجح واحدةٌ منها.
          t = R["محاولاتُ_التكذيب"]
          won = [x["المحاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو لم يُشغَّل أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          # ② **الحارسُ الأصل**: الجوارُ المقيسُ عليه هو **الاستئنافُ نفسُه** —
          #    إحداثيُّ السابقةِ بلا حرف. ولو قِيسَ فوقَ العدمِ لَجاء المكسبُ
          #    ثمنَ الجوارِ لا ثمنَ الحرف، فهذا حارسُ نزاهةِ الجوارِ لا حارسُ رقم.
          if "الاستئنافُ نفسُه" not in R["الحدُّ_المُعلَن"]["الجوار"]:
              print("::error::الجوارُ تبدَّل عن الاستئناف — قياسٌ لثمنِ الجوارِ لا للحرف")
              sys.exit(1)
          # ③ وحكمُ `jumla_links` الساقطُ بالتغطيةِ لا يُبنى عليه ولا يُرفَع.
          if "لا يُمَسّ" not in R["الحدُّ_المُعلَن"]["التقطيع"]:
              print("::error::نصُّ التقطيعِ فقدَ تبرئتَه من حكمِ jumla_links الساقط")
              sys.exit(1)
          # ④ الإحداثياتُ الثلاثةُ كلُّها تشتري بتًّا وتغلب مثلَها — وإلّا سقط.
          B = R["برهانُ_البتات"]
          if len(B["صفوف"]) != 3 or B["إحداثياتٌ_اشترى_فيها_الحرفُ_بتًّا"] != 3:
              print("::error::إحداثيٌّ لم يشترِ بتًّا — الدَّينُ لم يُسَدَّ توزيعًا")
              sys.exit(1)
          for r in B["صفوف"]:
              if len(r["ضوابطُ_المثل"]) != 11:
                  print(f"::error::{r['الإحداثيّ']}: ضوابطُ المثلِ ليست 11 — صريخ")
                  sys.exit(1)
              if not (r["ثمنُ_الحرف"] > 0 and r["ثمنُ_الحرف"] > r["أعلى_المثل"]):
                  print(f"::error::{r['الإحداثيّ']}: ثمنٌ غيرُ موجبٍ أو لم يغلب مثلَه")
                  sys.exit(1)
              if r["بالاستئنافِ_وحدَه"] <= r["بالعطف"]:
                  print(f"::error::{r['الإحداثيّ']}: العطفُ لم يُرخِص عن الاستئناف")
                  sys.exit(1)
              # مصالحةُ التدوير: الطرفانِ مُدوَّرانِ كلٌّ على حدةٍ، فيُحتمَل
              # فارقُ أُلّةٍ واحدةٍ عن فرقهما المُدوَّر — ولا يُحتمَل أكثر.
              if abs(round(r["بالاستئنافِ_وحدَه"] - r["بالعطف"], 4) - r["ثمنُ_الحرف"]) > 0.0001:
                  print(f"::error::{r['الإحداثيّ']}: الثمنُ لا يصالح طرفيه")
                  sys.exit(1)
          # ⑤ الحقولُ لا تُدمَج: ثلاثةُ مقاماتٍ بأحجامٍ مُعلَنةٍ لا رقمٌ واحد.
          if len({r["حجمُ_الحقل"] for r in B["صفوف"]}) < 2:
              print("::error::الحقولُ اندمجت في حجمٍ واحد — خلطُ مقامين")
              sys.exit(1)
          # ⑥ «اسميّة» ليست سلّةَ الباقي: المشتبهُ والحرفيُّ معدودانِ لا مُهرَّبان.
          J = R["الميدان"]["أجناسٌ_حاضرة"]
          if not (J["مشتبهة"] > 0 and J["حرفية"] > 0 and J["شبه جملة"] > 0):
              print("::error::جنسٌ مُعلَنٌ خلا — ثمنُ الاشتباهِ هُرِّب إلى خانةِ الاسم")
              sys.exit(1)
          # ⑦ حقلُ العلامةِ يستغرق المقامَ بلا فيضٍ ولا نقص، والفرعيّةُ ليست خاوية.
          A = R["العلاماتُ_الأصليةُ_والفرعية"]
          if A["أصليّةٌ"] + A["فرعيّةٌ"] + A["عُريٌ"] != M["كلمات"]:
              print("::error::حقلُ العلامةِ لا يستغرق المقام — صريخ")
              sys.exit(1)
          if not (0.0 < A["نصيبُ_الفرعيةِ_من_المُعرَب"] < 1.0):
              print("::error::الفرعيّةُ خانةٌ خاويةٌ أو تبتلع المُعرَب")
              sys.exit(1)
          if not A["مقاماتٌ_حاضرةٌ_كلُّها"]:
              print("::error::مقامٌ من المرفوعاتِ والمنصوباتِ والمجروراتِ والمجزوماتِ خلا")
              sys.exit(1)
          # ⑧ شاهدُ السببية: الفاءُ تنقل والواوُ تُبقي — وخلطُ الحرفين يُذهِبه.
          S = R["السببيةُ_والمسببية"]
          if S["إحداثياتٌ_وافقت_القاعدة"] != 3 or S["حكم"] != "مُودَعٌ بالبرهان":
              print("::error::قاعدةُ الفاءِ والواوِ لم تُوافَق في الإحداثياتِ كلِّها")
              sys.exit(1)
          if S["صفوف"][0]["فضلُ_الفاء"] <= S["أعلى_المثل"]:
              print("::error::فضلُ الفاءِ لم يغلب خلطَ الحرفين — فارقُ تقسيمٍ لا فارقُ حرف")
              sys.exit(1)
          # ⑨ الحكمُ الموضعيُّ مقامٌ ثانٍ: مفاتيحُه مُعلَنةٌ سلفًا، وساقطُها لا
          #    يُحذَف، وفضلُ غالبِه **رقيقٌ يُعلَن برقمِه** ولا يُكبَّر بالعبارة.
          W = R["الحكمُ_الموضعيّ"]
          if W["مفاتيحُ_عُرِضت"] < 4 or W["مفاتيحُ_غلبت"] >= W["مفاتيحُ_عُرِضت"]:
              print("::error::المفاتيحُ نُقِصت أو حُذِف ساقطُها — انتقاءٌ لا قياس")
              sys.exit(1)
          for r in W["صفوف"]:
              if r["غلب"] and not (r["ولاء"] > W["القاعدةُ_العظمى"] and r["ولاء"] > r["أعلى_المثل"]):
                  print(f"::error::{r['المفتاح']}: «غلب» بلا غلبةٍ على القاعدةِ ومثلِها")
                  sys.exit(1)
          if W["أعلى_فضلٍ_فوقَ_القاعدة"] >= 0.05:
              print("::error::الفضلُ الموضعيُّ تجاوز حدَّ الرقّةِ المُعلَن — أعِد تسميتَه")
              sys.exit(1)
          # ⑩ الفاعليةُ والمفعوليةُ معدودتانِ بحدِّ ميدانِهما ولا يُسعَّر عليه قانون.
          F = R["الفاعليةُ_والمفعولية"]
          if F["ميدانُ_ما_بعدَ_فعلٍ_حاسم"] >= F["أدنى_مقامٍ_يُسعَّر"]:
              print("::error::الميدانُ بلغ حدَّ التسعير ولم يُسعَّر — أقِم القانونَ أو صِح")
              sys.exit(1)
          if F["فاعليةٌ_مُثبَتة"] <= 0 or F["مفعوليةٌ_مُثبَتة"] <= 0:
              print("::error::شاهدٌ من الفاعليةِ أو المفعوليةِ خلا من البايتات")
              sys.exit(1)
          # ⑪ أساليبُ الخبرِ والإنشاءِ حاضرةٌ كلُّها، ونصيبُها لا يبتلع المقام.
          U = R["الخبرُ_والإنشاء"]
          if not U["أساليبُ_حاضرةٌ_كلُّها"] or not (0.0 < U["نصيبُ_الإنشاء"] < 0.5):
              print("::error::أسلوبٌ مُعلَنٌ خلا أو ابتلع الإنشاءُ المقامَ")
              sys.exit(1)
          if U["خبرٌ"] + U["إنشاءٌ"] != M["جمل"]:
              print("::error::الخبرُ والإنشاءُ لا يستغرقان الجملَ — صريخ")
              sys.exit(1)
          # ⑫ الديونُ تُسمّى ولا تُطمَس، وثمنُ الخريطةِ يُقاس قبل أن تُستعمَل.
          D = R["ديونٌ_بلا_رقم"]
          if len(D) < 4 or not any("موضعًا" in d["الدَّين"] or "واوٍ بعينها" in d["الدَّين"] for d in D):
              print("::error::دَينُ الفصلِ الموضعيِّ طُمِس — والسقوطُ يُودَع لا يُخفى")
              sys.exit(1)
          if R["الميدان"]["ثمنُ_إعلانِ_الخريطة"] <= 0:
              print("::error::خريطةُ الإحداثياتِ استُعمِلت بلا ثمنٍ مقيس")
              sys.exit(1)
          for k, m in (("خلايا_الجنس", 5), ("خلايا_العلامة", 7), ("خلايا_الأسلوب", 5)):
              if R["الميدان"][k] != m:
                  print(f"::error::{k} خالف إعلانَه — حقلٌ تبدَّل بعد التسجيل")
                  sys.exit(1)
          print("بابُ الجملة: اثنا عشرَ حارسًا ✓")
          PY
      - name: بابُ الإحالةِ والتوابع — الإحالةُ والعطفُ والموصولُ والتمييزُ والحال، ومصادمة ihala_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python ihala_gate.py --json /tmp/ihala.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("ihala_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/ihala.json", encoding="utf-8"))
          if A != B:
              print("::error::ihala_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["الإحالة_v0"]
          # ① المحاولاتُ تُشغَّل ولا تُقرَأ — وعدَّتُها مختومةٌ لئلّا تُسقَط واحدةٌ صامتةً.
          if R["محاولاتُ_التكذيب"] < 10:
              print("::error::محاولاتُ التكذيب دون العشر — بابٌ لا يستطيع أن يسقط")
              sys.exit(1)
          # ② حارسُ سندِ الجوار: الحدُّ الأدنى في العطفِ **الجوارُ نفسُه** لا العدم.
          #    فلو بُدِّل الحدُّ صامتًا لصار المكسبُ تحصيلَ حاصلٍ — والنصُّ يُفحَص.
          if "الجوارُ نفسُه" not in R["الحدُّ_المُعلَن"]["الجوار"]:
              print("::error::حدُّ الجوارِ بُدِّل — المكسبُ يصير تحصيلَ حاصل")
              sys.exit(1)
          # ③ حكمُ jumla_links لا يُمَسّ — والبراءةُ منصوصةٌ في الوديعةِ لا موعودةٌ في تعليق.
          if "لا يُمَسّ" not in R["الحدُّ_المُعلَن"]["jumla_links"]:
              print("::error::براءةُ jumla_links سقطت من الوديعة")
              sys.exit(1)
          # ④ الإحالةُ اشترت بتًّا، وضوابطُ مثلِها كلُّها دونها — وإحدى عشرةَ لا أقلّ.
          I = R["الإحالة"]["صفّ"]
          if len(I["ضوابطُ_المثل"]) != 11:
              print("::error::ضوابطُ مثلِ الإحالةِ ليست إحدى عشرة")
              sys.exit(1)
          if not (I["المكسب"] > 0 and I["المكسب"] > I["أعلى_المثل"]):
              print("::error::الإحالةُ لم تشترِ فوقَ مثلِها — وقد خُتمت مُودَعة")
              sys.exit(1)
          # والمصالحةُ بتسامحِ تقريبٍ واحد: الطرفان مقرَّبان إلى أربعةٍ والمكسبُ
          # مقرَّبٌ عن غيرِ المقرَّبين، فيفترقان بواحدٍ في آخرِ المنزلةِ لا أكثر.
          if abs((I["بلا_معرفة"] - I["بالمعرفة"]) - I["المكسب"]) > 1.5e-4:
              print("::error::مكسبُ الإحالةِ لا يوافق طرفيه — رقمٌ كُتب لا حُسب")
              sys.exit(1)
          # ⑤ العطف: الميدانان لا يُجمَعان، والجوارُ أوسعُ بالبناء، والفضلُ مشتقٌّ منهما.
          A2 = R["العطف"]
          if A2["ميدانُ_الجوار"] <= A2["ميدانُ_العطف"]:
              print("::error::ميدانُ الجوارِ لم يكن أوسعَ — الميدانان اختلطا")
              sys.exit(1)
          if abs(A2["فضلُ_التبعيةِ_على_الجوار"]
                 - (A2["صفُّ_العطف"]["المكسب"] - A2["صفُّ_الجوار"]["المكسب"])) > 1e-9:
              print("::error::فضلُ التبعيةِ لا يوافق فرقَ الصفّين")
              sys.exit(1)
          if not (A2["فضلُ_التبعيةِ_على_الجوار"] > 0 and A2["صفُّ_الجوار"]["المكسب"] > 0):
              print("::error::الجوارُ لم يشترِ أو التبعيةُ لم تفضله — الشاهدُ تحصيلُ حاصل")
              sys.exit(1)
          # ⑥ الموصول: **رقمان يُختَمان معًا** — شاهدُ النسبةِ وفاتورةُ المقامِ الكامل.
          #    وحذفُ أحدهما لأنّه لم يوافق الآخرَ هو العطلُ الذي يحرسه هذا الحارس.
          M = R["الموصول"]
          if "فاتورةُ_المقامِ_الكامل" not in M or "حكم" not in M["فاتورةُ_المقامِ_الكامل"]:
              print("::error::فاتورةُ المقامِ الكاملِ غابت — رقمٌ حُذف لأنّه خالف")
              sys.exit(1)
          if not (M["نصيبُ_العائدِ_بعدَ_الموصول"] > M["أعلى_المثل"]
                  > 0 and M["نصيبُ_العائدِ_بعدَ_الموصول"] > M["نصيبُه_في_سواه"]):
              print("::error::شاهدُ العائدِ لم يغلب مثلَه ولا خلفيّتَه")
              sys.exit(1)
          if len(M["ضوابطُ_المثل"]) != 11:
              print("::error::ضوابطُ مثلِ العائدِ ليست إحدى عشرة")
              sys.exit(1)
          # ⑦ التمييزُ والحال: الدَّينُ باقٍ بنصِّه، والميدانُ معدودٌ، والحكمُ مشتقٌّ منه.
          T = R["التمييزُ_والحال"]
          if not T["الدَّينُ_باقٍ"]:
              print("::error::دَينُ فصلِ التمييزِ من الحالِ رُفِع بلا فصلٍ مقيس")
              sys.exit(1)
          if T["بلغَ_حدَّ_التسعير"] != (T["ميدانُ_النكرةِ_المنصوبة"] >= 1000):
              print("::error::بلوغُ حدِّ التسعيرِ لا يوافق الميدانَ — علمٌ كُتب لا حُسب")
              sys.exit(1)
          if T["ميدانُ_النكرةِ_المنصوبة"] < 1000 and "بالمقام" not in T["حكم"]:
              print("::error::ميدانٌ دون الحدِّ وحكمٌ لا يُسمّي سببَه")
              sys.exit(1)
          # ⑧ الحقولُ مغلقةٌ معلنةُ الحجم، ولا خانةَ سرّيّة.
          F = R["الميدان"]
          for k, m in (("خلايا_الضمير", 5), ("خلايا_الصورة", 6), ("خلايا_العلامة", 7)):
              if F[k] != m:
                  print(f"::error::{k} خالف إعلانَه — حقلٌ تبدَّل بعد التسجيل")
                  sys.exit(1)
          if sum(F["صورٌ_حاضرة"].values()) != F["كلمات"]:
              print("::error::خلايا الصورةِ لا تستوعب الكلماتِ كلَّها — سلّةٌ مخفيّة")
              sys.exit(1)
          if min(F["صورٌ_حاضرة"].values()) <= 0:
              print("::error::خانةُ صورةٍ خاليةٌ بالبناء — حقلٌ صوريّ")
              sys.exit(1)
          # ⑨ خريطةُ الصورِ مُسعَّرةٌ قبل أن تُستعمَل — ولا يُقدَّر ثمنٌ لغائب.
          if F["ثمنُ_إعلانِ_الخريطة"] <= 0:
              print("::error::خريطةُ الصورِ استُعمِلت بلا ثمنٍ مقيس")
              sys.exit(1)
          # ⑩ نافذةُ العائدِ وسَعَةُ فاصلِ التمييزِ معلنتان قبل القياس — فلا تُجرَّب أعدادٌ حتى تُوافق.
          if F["نافذةُ_العائد"] != 4 or F["سَعَةُ_فاصلِ_التمييز"] < 20:
              print("::error::نافذةُ العائدِ أو سَعَةُ الفاصلِ بُدِّلت بعد التسجيل")
              sys.exit(1)
          # ⑪ الديونُ تُسمّى ولا تُرقَّم، والقواعدُ المترجَمةُ أربعٌ بأبوابها.
          if R["ديونٌ_بلا_رقم"]["عدد"] != len(R["ديونٌ_بلا_رقم"]["بنود"]):
              print("::error::عدُّ الديونِ يخالف بنودَها")
              sys.exit(1)
          if any(any(ch.isdigit() for ch in d) for d in R["ديونٌ_بلا_رقم"]["بنود"]):
              print("::error::دَينٌ حملَ رقمًا — والدَّينُ يُسمّى ولا يُرقَّم")
              sys.exit(1)
          if len(R["الحدُّ_المُعلَن"]["القواعدُ_المترجَمة"]) != 4:
              print("::error::القواعدُ المترجَمةُ ليست أربعًا بأبوابها")
              sys.exit(1)
          print("بابُ الإحالةِ والتوابع: أحدَ عشرَ حارسًا ✓")
          PY
      - name: بابُ القسمة — صدقُ «المدلولِ وحدَه» من سطحِ «الدالِّ وحدَه»، ومصادمة qisma_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python qisma_gate.py --json /tmp/qisma.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("qisma_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/qisma.json", encoding="utf-8"))
          if A != B:
              print("::error::qisma_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["القسمة_v0"]
          # ② البناءُ مشتقٌّ لا منقول: عددُ الأقسامِ يُستخرَج من الشجرةِ ويُصادَم بمنصوصِ المتن.
          Q = R["البناء"]
          if Q["أقسامٌ_مشتقّة"] != Q["منصوص"] or Q["عددُ_الفصول"] != len(Q["فصول"]):
              print("::error::عددُ أقسامِ «المدلولِ وحدَه» خالف منصوصَه أو فصولَه")
              sys.exit(1)
          # ③ فصلُ الوحدة: منحلٌّ بنصيبِه لا بدعوى — والحكمُ مشتقٌّ من النصيبِ والسقف.
          U = R["فصلُ_المفردِ_والمركّب"]
          if U["منحلّة"] != (U["نصيب"] >= R["الميدان"]["سقفُ_الانحلال"]):
              print("::error::حكمُ الانحلالِ لا يوافق نصيبَه — رقمٌ كُتب لا حُسب")
              sys.exit(1)
          if not U["منحلّة"] or "بالانحلال" not in U["حكم"]:
              print("::error::فصلُ الوحدةِ لم يُرَدّ بالانحلالِ — ردٌّ بُدِّل صامتًا")
              sys.exit(1)
          # ④ مكيالُ الندرة: مردودٌ بعدده — والفواتحُ مُصادَمةٌ بختمِ `madlul_v0.json`.
          H = R["فصلُ_المستعمَلِ_والمهمَل"]
          if H["مواضعُ_الفواتح"] != 108:
              print("::error::مواضعُ الفواتحِ خالفت ختمَ madlul_v0.json — رقمٌ كُتب مرّتين")
              sys.exit(1)
          if H["فواتحُ_في_النادر"] >= H["صورٌ_نادرة"] * 0.1:
              print("::error::الفواتحُ لم تكن ضئيلةً في النادر — الردُّ فقد سنده")
              sys.exit(1)
          # ⑤ طائفةُ أسماءِ اللفظ: الميدانُ معدودٌ، والحكمُ يُسمّي سببَه، والدَّينُ باقٍ.
          M = R["فصلُ_المعنى_واللفظ"]
          if M["بلغَ_حدَّ_التسعير"] != (M["ميدانُ_الطائفة"] >= R["الحدُّ_المُعلَن"]["حدُّ_التسعير"]):
              print("::error::بلوغُ حدِّ التسعيرِ لا يوافق الميدانَ — علمٌ كُتب لا حُسب")
              sys.exit(1)
          if not M["بلغَ_حدَّ_التسعير"] and ("بالمقام" not in M["حكم"] or not M["الدَّينُ_باقٍ"]):
              print("::error::ميدانٌ دون الحدِّ وحكمٌ لا يُسمّي سببَه أو دَينٌ رُفع بلا قياس")
              sys.exit(1)
          # ⑥ صنعةُ البناء: قسمةٌ ٢×٢ مشتقّةُ العدد، وأحكامُها كلُّها من مفردات deposit_law.
          S = R["صنعةُ_البناء"]
          if (S["أقسامٌ_مشتقّة"] != len(S["أقسام"])
                  or len(S["أقسام"]) != 2 ** len(S["فصولٌ_من_عندنا"])):
              print("::error::أقسامُ الصنعةِ لا توافق فصولَها — عددٌ كُتب لا اشتُقّ")
              sys.exit(1)
          RULINGS = {"مُودَعةٌ بالبرهان", "مردودةٌ بالفاتورة",
                     "مردودةٌ بالضابط", "مردودةٌ بالانحلال"}
          bad = [c["قسم"] for c in S["أقسام"] if c["حكم"] not in RULINGS]
          if bad:
              print(f"::error::حكمٌ خارجَ المفردات الأربع المعلنة: {bad}")
              sys.exit(1)
          if S["مُودَعة"] + S["مردودة"] != len(S["أقسام"]):
              print("::error::عدُّ المُودَعِ والمردودِ لا يستوعب الأقسامَ — سلّةٌ مخفيّة")
              sys.exit(1)
          if sum(c["إطلاق"] for c in S["أقسام"]) != R["الميدان"]["مواضع"]:
              print("::error::إطلاقُ الأقسامِ لا يستوعب المقامَ — القسمةُ ليست جامعةً مانعة")
              sys.exit(1)
          # ⑦ ضابطُ القبول: المكيالُ يقبل في الميدان نفسِه — وإلا فالردُّ عطلُ مكيالٍ لا قياس.
          C = R["ضابطُ_القبول"]
          if C["حكم"] != "مُودَعةٌ بالبرهان" or C["Δ"] >= 0:
              print("::error::ضابطُ القبولِ لم يقبل — فردُّ الأقسامِ عطلُ مكيالٍ لا قياس")
              sys.exit(1)
          # ⑧ الإذنُ محفوظ: المحورُ الثالثُ يبقى مغلقًا ما لم يُقَس الصدقُ — والحكمُ سلبيّ.
          X = R["الإذن"]
          if X["المحورُ_الثالث"]["مفتوح"] or not X["المحورُ_الثاني"]["مفتوح"]:
              print("::error::المحاورُ بُدِّلت — ولا يُفتَح الثالثُ بحكمٍ سلبيّ")
              sys.exit(1)
          # ⑨ الديونُ تُسمّى ولا تُرقَّم، والمسدَّدُ منها يُعرَض بأرقامِه لا بدعوى.
          D = R["الديون"]
          if D["عددُ_ما_بلا_رقم"] != len(D["بلا_رقم"]) or D["عددُ_المسدَّد"] != len(D["مسدَّدٌ_بقياسه"]):
              print("::error::عدُّ الديونِ يخالف بنودَها")
              sys.exit(1)
          if any(any(ch.isdigit() for ch in d) for d in D["بلا_رقم"]):
              print("::error::دَينٌ حملَ رقمًا — والدَّينُ يُسمّى ولا يُرقَّم")
              sys.exit(1)
          if any(not d["أرقامُه"] for d in D["مسدَّدٌ_بقياسه"]):
              print("::error::دَينٌ ادُّعي سدادُه بلا رقمٍ يُعرَض")
              sys.exit(1)
          # ⑩ ثمنُ إعلانِ الفضاء مقيسٌ قبل أن يُستعمَل — ولا يُقدَّر ثمنٌ لغائب.
          if R["الميدان"]["ثمنُ_إعلانِ_الفضاء"] <= 0:
              print("::error::الفضاءُ استُعمِل بلا ثمنٍ مقيس")
              sys.exit(1)
          print("بابُ القسمة: عشرةُ حرّاسٍ ✓")
          PY
      - name: بابُ الصرفِ ومنعِه — المتمكّنُ غيرُ الأمكن، ومصادمة sarf_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python sarf_gate.py --json /tmp/sarf.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("sarf_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/sarf.json", encoding="utf-8"))
          if A != B:
              print("::error::sarf_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["الصرف_v0"]
          # ① المحاولاتُ تُشغَّل ولا تُقرَأ — وعدَّتُها مختومةٌ لئلّا تُسقَط واحدةٌ صامتةً.
          if R["محاولاتُ_التكذيب"] < 10:
              print("::error::محاولاتُ التكذيب دون العشر — بابٌ لا يستطيع أن يسقط")
              sys.exit(1)
          # ② حارسُ الدَّور: موضعُ الجرِّ يُحَدُّ بالجارِّ قبلَه لا بعلامةِ الجرِّ فيه —
          #    فلو صار الحدُّ يشترط كسرةً لصار قياسُ النيابةِ دورًا يُثبت نفسَه.
          if "ولا تُشترَط علامةُ جرٍّ" not in R["الميدان"]["حدُّ_موضعِ_الجرّ"]:
              print("::error::حدُّ موضعِ الجرِّ بُدِّل — القياسُ يصير دورًا")
              sys.exit(1)
          # ③ حَجْرُ mabna_gate لا يُمَسّ — والبراءةُ منصوصةٌ في الوديعةِ لا موعودةٌ في تعليق.
          if "لا يُمَسّ" not in R["الحدُّ_المُعلَن"]["mabna_gate"]:
              print("::error::براءةُ mabna_gate سقطت من الوديعة")
              sys.exit(1)
          # ④ الأسبابُ الاثنا عشرَ معلنةٌ بسندِ قياسِ كلِّ واحدٍ منها — وما لا سندَ له
          #    يُسمّى «لا صورةَ ولا معجم» ويُقيَّد دَينًا، لا يُسكَت عنه.
          AS = R["الحدُّ_المُعلَن"]["أسبابُ_المنعِ_المُعلَنة"]
          if len(AS) != 12:
              print("::error::أسبابُ المنعِ المعلنةُ ليست اثني عشر")
              sys.exit(1)
          SANAD = {"صورةٌ في الرسم", "معجمٌ منتهٍ مسمًّى", "لا صورةَ ولا معجم"}
          if {a["سندُ_قياسه"] for a in AS} - SANAD:
              print("::error::سببٌ بسندٍ خارجَ المفردات الثلاث المعلنة")
              sys.exit(1)
          if sum(1 for a in AS if a["سندُ_قياسه"] == "لا صورةَ ولا معجم") \
             > R["ديونٌ_بلا_رقم"]["عدد"]:
              print("::error::أسبابٌ بلا سندٍ أكثرُ من الديونِ المسمّاة — دَينٌ طُوي")
              sys.exit(1)
          # ⑤ **السندان لا يُجمَعان**: الصورةُ سقطت بالنسبةِ والمعجمُ نابَ، ورقماهما
          #    مختومان معًا. والحكمُ مشتقٌّ من رقمه: من قيل «نابت» فليغلب مثلَه وخلفيّتَه،
          #    ومن قيل «ساقطٌ» فلا يغلبهما — وإلّا فحكمٌ كُتب لا حُسب.
          N = R["النيابة"]
          for k in ("الصورتان", "المعجمُ_المنتهي"):
              c = N[k]
              if len(c["ضوابطُ_المثل"]) != 11:
                  print(f"::error::ضوابطُ مثلِ {k} ليست إحدى عشرة")
                  sys.exit(1)
              beats = c["نصيبُ_الفتحة"] > c["أعلى_المثل"] and c["نصيبُ_الفتحة"] > c["الخلفية"]
              if beats != c["حكم"].startswith("نابت"):
                  print(f"::error::حكمُ {k} لا يوافق رقمَه — حكمٌ كُتب لا حُسب")
                  sys.exit(1)
          if N["الصورتان"]["حكم"].startswith("نابت"):
              print("::error::سقوطُ الصورةِ رُفع بلا قياسٍ جديد — والسقوطُ يُختَم بعدده")
              sys.exit(1)
          if not N["المعجمُ_المنتهي"]["مخالفون_مسمَّون"]:
              print("::error::مخالفُ المعجمِ طُوي — والمخالفُ يُسمّى بعينه")
              sys.exit(1)
          # ⑥ شرطُ «أل» هو المكذِّبُ الأقوى: الصورةُ نفسُها بأل تعود بالكسرةِ استغراقًا،
          #    وأدنى ضوابطِ المثلِ فوقَ المقيس — فلو ارتفعت الفتحةُ بأل سقطت القاعدة.
          AL = R["شرطُ_أل"]
          if not (AL["بأل"]["نصيبُ_الفتحة"] < AL["بلا_أل"]["نصيبُ_الفتحة"]
                  and AL["بأل"]["نصيبُ_الفتحة"] < AL["أدنى_مثلِ_الفتحةِ_بأل"]):
              print("::error::شرطُ «أل» لم يفصل — والقاعدةُ تسقط بمكذِّبها الأقوى")
              sys.exit(1)
          if AL["بأل"]["ميدان"] < 20 or AL["بلا_أل"]["ميدان"] < 20:
              print("::error::ميدانُ شرطِ «أل» دون حدِّ الشاهدِ المعلن")
              sys.exit(1)
          # ⑦ المقصورُ محجورٌ **بالقياس**: شرطُ «أل» لم يفصله، فلا يُحسَب في النيابةِ
          #    ولا يُرَدّ صامتًا. والحكمُ مشتقٌّ من الشرطِ لا مكتوبٌ بجانبه.
          H = R["حَجْرُ_المقصور"]
          if H["شرطُ_«أل»_فصلَه"] != (H["نصيبُ_الفتحةِ_بأل"] < H["نصيبُ_الفتحةِ_بلا_أل"]):
              print("::error::فصلُ شرطِ «أل» في المقصورِ لا يوافق رقميه")
              sys.exit(1)
          if not H["شرطُ_«أل»_فصلَه"] and not H["حكم"].startswith("محجور"):
              print("::error::المقصورُ لم يفصله شرطُه وحُكم له — حكمٌ بلا قياس")
              sys.exit(1)
          # ⑧ الفاتورةُ حَكَمًا: مقامان لا يُجمَعان، والحَكَمُ **غيرُ المعرَّف** لأنّ «أل»
          #    تمنع التنوينَ بالتعريف، فمكسبُ المقامِ الكاملِ فيه شطرٌ من تحصيلِ حاصل.
          F = R["فاتورةُ_المقام"]
          if F["غيرُ_المعرَّف"]["مقام"] >= F["المقامُ_الكامل"]["مقام"]:
              print("::error::المقامان اختلطا — غيرُ المعرَّفِ ليس أضيقَ")
              sys.exit(1)
          for k in ("المقامُ_الكامل", "غيرُ_المعرَّف"):
              c = F[k]
              if len(c["ضوابطُ_المثل"]) != 11:
                  print(f"::error::ضوابطُ مثلِ فاتورةِ {k} ليست إحدى عشرة")
                  sys.exit(1)
              if abs((c["بلا_معرفة"] - c["بالمعرفة"]) - c["المكسب"]) > 1.5e-4:
                  print(f"::error::مكسبُ {k} لا يوافق طرفيه — رقمٌ كُتب لا حُسب")
                  sys.exit(1)
          if not (F["غيرُ_المعرَّف"]["المكسب"] > 0
                  and F["غيرُ_المعرَّف"]["المكسب"] > F["غيرُ_المعرَّف"]["أعلى_المثل"]):
              print("::error::الصورةُ لم تشترِ في غيرِ المعرَّف — فمكسبُها تحصيلُ حاصل")
              sys.exit(1)
          # ⑨ الحقولُ مغلقةٌ معلنةُ الحجم، ولا خانةَ سرّيّة، والخريطةُ مُسعَّرةٌ قبل أن تُستعمَل.
          M = R["الميدان"]
          if M["خلايا_الصورة"] != 4 or M["خلايا_العلامة"] != 8:
              print("::error::خلايا الصورةِ أو العلامةِ بُدِّلت بعد التسجيل")
              sys.exit(1)
          if sum(M["صورٌ_حاضرة"].values()) != M["كلمات"]:
              print("::error::خلايا الصورةِ لا تستوعب الكلماتِ كلَّها — سلّةٌ مخفيّة")
              sys.exit(1)
          if M["ثمنُ_إعلانِ_الخريطة"] <= 0:
              print("::error::خريطةُ الصورِ استُعمِلت بلا ثمنٍ مقيس")
              sys.exit(1)
          # ⑩ المعجمُ المنتهي مقروءٌ من `jar_gate` لا منسوخٌ ههنا — وحجمُه يُصادَم ببايتاته.
          import jar_gate
          if M["حجمُ_المعجمِ_المنتهي"] != len(jar_gate.MAMNU3):
              print("::error::حجمُ المعجمِ المنتهي خالف مصدرَه في jar_gate — نسخةٌ ثانية")
              sys.exit(1)
          # ⑪ خطأُ الوكيلِ معدودٌ مسمًّى: المنوَّنون على الصورةِ يُعرَضون ولا يُطمَسون.
          T = R["التنوين"]
          if T["منوَّنون_على_الوكيل"] <= 0 or not T["مسمَّون"]:
              print("::error::خطأُ الوكيلِ طُوي — والمخالفُ يُعَدّ ويُسمّى")
              sys.exit(1)
          # ⑫ الديونُ تُسمّى ولا تُرقَّم.
          D = R["ديونٌ_بلا_رقم"]
          if D["عدد"] != len(D["بنود"]):
              print("::error::عدُّ الديونِ يخالف بنودَها")
              sys.exit(1)
          if any(any(ch.isdigit() for ch in d) for d in D["بنود"]):
              print("::error::دَينٌ حملَ رقمًا — والدَّينُ يُسمّى ولا يُرقَّم")
              sys.exit(1)
          print("بابُ الصرفِ ومنعِه: اثنا عشرَ حارسًا ✓")
          PY
      - name: بابُ الديون — تصنيفُ الديونِ المودَعةِ وموانعِها، ومصادمة duyun_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python duyun_gate.py --json /tmp/duyun.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("duyun_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/duyun.json", encoding="utf-8"))
          if A != B:
              print("::error::duyun_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["الديون_v0"]
          # ① المحاولاتُ تُشغَّل ولا تُقرَأ — وعدَّتُها مختومةٌ لئلّا تُسقَط واحدةٌ صامتةً.
          if R["محاولاتُ_التكذيب"] < 15:
              print("::error::محاولاتُ التكذيب دون الخمسَ عشرةَ — بابٌ لا يستطيع أن يسقط")
              sys.exit(1)
          # ② الحصرُ مسحٌ لا استظهار: لا دَينَ مطويّ، والعدُّ يستوعب بنودَه.
          H = R["الحصر"]
          if H["ديونٌ_مطويّة"] != 0:
              print("::error::ديوانٌ في الشجرةِ بلا قارئٍ معلن — الحصرُ صار دعوى")
              sys.exit(1)
          if (H["عددُ_المحصور"] != len(H["ديونٌ_محصورة"])
                  or H["عددُ_المسدَّد"] != len(H["مسدَّدٌ_بقياسه"])
                  or H["عددُ_المفرد"] != len(H["مفردٌ_خارجَ_الحصر"])):
              print("::error::عدُّ الحصرِ يخالف بنودَه — رقمٌ كُتب لا حُسب")
              sys.exit(1)
          # ③ والمشطُ يعمل: لو لم يرَ صفًّا مفردًا خارجَ الدواوينِ لكان أعمى لا شاهدًا.
          if H["عددُ_المفرد"] <= 0 or H["عددُ_المحصور"] <= 0:
              print("::error::المسحُ لم يرَ ديونًا — مشطٌ لا يمشط")
              sys.exit(1)
          # ④ سلّمُ الموانع: مفرداتُه مغلقةٌ، ومانعُ كلِّ بابٍ منها لا من خارجها.
          NAMES = {m["مانع"] for m in R["سلّمُ_الموانع"]} | {w["مانع"] for w in R["الشهود"]["شهود"]}
          out = [b["باب"] for b in R["الأبواب"] if b["مانع"] not in NAMES]
          if out:
              print(f"::error::مانعٌ خارجَ المفردات المعلنة: {out}")
              sys.exit(1)
          # ⑤ والمانعُ **مشتقٌّ** من الرقم: كلُّ ميدانٍ دون حدِّ التسعيرِ مانعُه المقام،
          #    وكلُّ ما بلغَ الحدَّ ولم يفصل مانعُه المكيال — فلا يُكتَب حكمٌ بيد.
          FLOOR = R["الحدُّ_المُعلَن"]["حدُّ_التسعير"]
          CEIL = R["الحدُّ_المُعلَن"]["سقفُ_الانحلال"]
          for b in R["الأبواب"]:
              if b["ميدان"] < FLOOR:
                  want = "مانعُ المقام"
              elif b["نصيب"] is None or b["فاصل"] is None:
                  print(f"::error::بابٌ بلغَ حدَّ التسعيرِ بلا نصيبٍ أو فاصل: {b['باب']}")
                  sys.exit(1)
              elif b["نصيب"] >= CEIL:
                  want = "مانعُ الانحلال"
              elif not b["فاصل"]:
                  want = "مانعُ المكيال"
              else:
                  want = "لا مانعَ في القياس"
              if b["مانع"] != want:
                  print(f"::error::مانعُ «{b['باب']}» خالف سلّمَه: {b['مانع']} ⟷ {want}")
                  sys.exit(1)
          # ⑥ والأبوابُ السبعةُ المسمّاةُ حاضرةٌ كلُّها، ومصدرُ رقمِ كلٍّ منها معلن.
          WANT = {"المدلول", "التوكيد", "الإضمار", "الحذف", "الإحالة",
                  "إعرابُ الجملة", "التمييزُ والحال"}
          got = {b["باب"] for b in R["الأبواب"]}
          if got != WANT:
              print(f"::error::الأبوابُ السبعةُ بُدِّلت: {sorted(got ^ WANT)}")
              sys.exit(1)
          if any(b["مصدرُ_الرقم"] not in ("ختمٌ قائم", "قياسٌ جديد") for b in R["الأبواب"]):
              print("::error::بابٌ بلا مصدرٍ معلنٍ لرقمه")
              sys.exit(1)
          # ⑦ الشهود: لا مانعَ بلا شاهدٍ مختومٍ يُقرَأ حيًّا، وخريطةُ الموانعِ مقيسةُ الثمن.
          W = R["الشهود"]
          if W["موانعُ_بلا_شاهد"] != 0 or W["ثمنُ_إعلانِ_الخريطة"] <= 0:
              print("::error::مانعٌ بلا شاهدٍ أو خريطةٌ استُعمِلت بلا ثمنٍ مقيس")
              sys.exit(1)
          # ⑧ التصنيفُ قراءةٌ تحمل خبرًا: جدولُه يستوعب صفوفَه، وغيرُ المصنَّفِ يُسمّى لا يُطوى.
          T = R["التصنيف"]
          if sum(T["جدول"].values()) != len(T["صفوف"]) or T["مصنَّف"] + T["غيرُ_مصنَّف"] != len(T["صفوف"]):
              print("::error::جدولُ التصنيفِ لا يستوعب صفوفَه — سلّةٌ مخفيّة")
              sys.exit(1)
          if T["غيرُ_مصنَّف"] != len(T["أسماءُ_غيرِ_المصنَّف"]):
              print("::error::غيرُ المصنَّفِ عُدَّ ولم يُسَمَّ")
              sys.exit(1)
          if len({r["مانع"] for r in T["صفوف"]}) < 2:
              print("::error::التصنيفُ أعطى مانعًا واحدًا للديونِ كلِّها — قراءةٌ بلا خبر")
              sys.exit(1)
          # ⑨ التوكيدُ فصلَ **طائفةً** وسقط شطراه — فلا يُنسَب الفصلُ إلى صورةٍ منه.
          K = R["التوكيد"]
          if not K["الطائفة"]["غلبَ_المثل"] or K["شطرٌ_غلبَ_المثل"] != 0:
              print("::error::حكمُ التوكيدِ بُدِّل — الفاصلُ الطائفةُ لا شطرٌ منها")
              sys.exit(1)
          Q = json.load(open("qisma_v0.json", encoding="utf-8"))["القسمة_v0"]["ضابطُ_القبول"]
          if round(K["المحور"]["Δ"], 1) != Q["Δ"]:
              print("::error::Δ «إنَّ وحدَها» خالف ضابطَ القبولِ المختوم — رقمٌ كُتب مرّتين")
              sys.exit(1)
          # ⑩ الحذفُ صفرٌ **مقروءٌ** من السرد، ومانعُه المقام — ولا يُسعَّر غائبٌ.
          F = R["الحذف"]
          if F["ميدانُ_الصورةِ_الخالية"] != 0 or F["مواضعُ_السرد"] <= 0:
              print("::error::ميدانُ الحذفِ بُدِّل — وهو صفرٌ بالبناءِ مقروءٌ لا مكتوب")
              sys.exit(1)
          # ⑪ الديونُ تُسمّى ولا تُرقَّم، والمسدَّدُ منها يُعرَض بأرقامِه لا بدعوى.
          D = R["الديون"]
          if D["عددُ_ما_بلا_رقم"] != len(D["بلا_رقم"]) or D["عددُ_المسدَّد"] != len(D["مسدَّدٌ_بقياسه"]):
              print("::error::عدُّ الديونِ يخالف بنودَها")
              sys.exit(1)
          if any(any(ch.isdigit() for ch in d) for d in D["بلا_رقم"]):
              print("::error::دَينٌ حملَ رقمًا — والدَّينُ يُسمّى ولا يُرقَّم")
              sys.exit(1)
          if any(not d["أرقامُه"] for d in D["مسدَّدٌ_بقياسه"]):
              print("::error::دَينٌ ادُّعي سدادُه بلا رقمٍ يُعرَض")
              sys.exit(1)
          # ⑫ الجولةُ الثانية: قاعدةٌ مولِّدةٌ لا قائمةُ استثناءات، وإعادةُ تصنيفٍ مصرَّحٌ بما تبدّل فيها.
          J = R["الجولةُ_الثانية"]
          if J["عددُ_المولَّد"] != J["حاصلُ_الضرب"] or J["عددُ_المولَّد"] != len(J["مراسٍ_مولَّدة"]):
              print("::error::مراسي الجولةِ الثانيةِ خالفت حاصلَ الضربِ التامّ — قائمةٌ لا قاعدة")
              sys.exit(1)
          if J["مراسٍ_ميدانُها_صفر"] == 0:
              print("::error::كلُّ مرساةٍ مولَّدةٍ أصابت — فهي مكتوبةٌ للديونِ لا قاعدةٌ عليها")
              sys.exit(1)
          if J["ثمنُ_إعلانِ_المراسي"] <= 0:
              print("::error::مراسي الجولةِ الثانيةِ استُعمِلت بلا ثمنٍ مقيس")
              sys.exit(1)
          # التوسيعُ لا ينتزع مصنَّفًا من مانعه، والشرهةُ المقيسةُ تسرق أكثرَ — فالاختيارُ بسببٍ لا بذوق.
          if any(m["من"] != "غيرُ مصنَّف" for m in J["تبدّلَ_موضعُه"]):
              print("::error::الجولةُ الثانيةُ انتزعت دَينًا مصنَّفًا من مانعه")
              sys.exit(1)
          if len(J["المرساةُ_الشرهة"]["تبدّلَ_موضعُه"]) <= len(J["تبدّلَ_موضعُه"]):
              print("::error::المرساةُ الشرهةُ لم تسرق أكثرَ — فاختيارُ المولَّدةِ بلا سبب")
              sys.exit(1)
          # والجولةُ الثانيةُ لها ميدانٌ ولها أثر: الأولى تترك غيرَ مصنَّفٍ، والثانيةُ
          #   تُنقِصه. والعددُ نفسُه مختومٌ في `SEALED_DUYUN` فلا يُثبَّت ههنا مرّتين —
          #   وتثبيتُه رقمًا في الحارسِ يُسقِط البابَ كلَّما نما ديوانُ الشجرة.
          if T["غيرُ_مصنَّف"] < 1:
              print("::error::الجولةُ الأولى بلا غيرِ مصنَّفٍ — فمراسي الثانيةِ ثمنٌ بلا ميدان")
              sys.exit(1)
          if J["التصنيف"]["غيرُ_مصنَّف"] >= T["غيرُ_مصنَّف"]:
              print("::error::المرساةُ المولَّدةُ لم تُنقِص غيرَ المصنَّفِ — ثمنٌ بلا أثر")
              sys.exit(1)
          T2 = J["التصنيف"]
          if sum(T2["جدول"].values()) != len(T2["صفوف"]) or T2["غيرُ_مصنَّف"] != len(T2["أسماءُ_غيرِ_المصنَّف"]):
              print("::error::جدولُ الجولةِ الثانيةِ لا يستوعب صفوفَه أو عَدَّ ما لم يُسَمِّ")
              sys.exit(1)
          print("بابُ الديون: اثنا عشرَ حارسًا ✓")
          PY
      - name: بابُ التمكّن — القسمةُ الثلاثيّةُ ودرجاتُها، ومصادمة tamakkun_v0.json
        run: |
          set -euo pipefail
          python tamakkun_gate.py --json /tmp/tamakkun.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("tamakkun_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/tamakkun.json", encoding="utf-8"))
          if A != B:
              print("::error::tamakkun_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["التمكّن_v0"]
          q, t, h = R["القسمة"], R["التمكّن"], R["الحَكَم"]
          # ① القسمةُ ثلاثٌ لا رابعَ لها — والحارسُ يقرأ الوديعةَ نفسَها لا التعليق.
          if set(q["الأقسامُ_الثلاثة"]) != {"اسم", "فعل", "حرف"} or set(t) != {"اسم", "فعل", "حرف"}:
              print("::error::قسمةُ التمكّن ليست ثلاثًا — ظهرت خانةٌ رابعةٌ أو سقطت خانة")
              sys.exit(1)
          # ② «مشتبه» اسمٌ ممنوعٌ في هذه الوديعة: ما لم يُقطَع به دَينٌ لا قسم.
          if "مشتبه" in json.dumps(R, ensure_ascii=False):
              print("::error::لفظُ «مشتبه» في وديعةِ التمكّن — والقسمةُ ثلاثٌ ودَينٌ لا أربعة")
              sys.exit(1)
          # ③ رحلةُ القسمة مغلقة: الأقسامُ والدَّينُ يبلغان المقام.
          if q["مواضعُ_قُطِعَ_بها"] + q["دَينُ_المصنِّف"] != q["مواضعُ_المقام"]:
              print("::error::رحلةُ قسمةِ التمكّن لم تُغلَق")
              sys.exit(1)
          # ④ الدَّينُ منشورٌ حيٌّ: لو بلغ صفرًا بلا قياسٍ فالمصنِّفُ يكذب.
          if q["دَينُ_المصنِّف"] <= 0 or q["صورُ_دَينِ_المصنِّف"] <= 0:
              print("::error::دَينُ مصنِّف التمكّن صفرٌ — عدّادٌ ميّتٌ لا مصنِّفٌ تامّ")
              sys.exit(1)
          # ⑤ المعجمُ المعلَنُ يُسعَّر قبل أن يُستعمَل، وتضييقُه مقيسٌ موجب.
          if q["ثمنُ_إعلانِ_المعجم"] <= 0 or q["ما_ضيَّقَه_المعجمُ_المعلَن"] <= 0:
              print("::error::معجمُ التمكّن بلا ثمنٍ أو بلا تضييقٍ مقيس")
              sys.exit(1)
          # ⑥ الدَّوْرُ مدفوعٌ: التقنيعُ غيَّر حكمَ علامةِ الاسمِ في مواضعَ معدودة.
          if q["ثمنُ_التقنيعِ_بالمواضع"] <= 0:
              print("::error::التقنيعُ بلا أثرٍ — الدَّوْرُ لم يُدفَع")
              sys.exit(1)
          # ⑦ الضابط: الحرفُ أثبتُ الأقسامِ درجةً، وإلّا فالمقياسُ ساقطٌ بمكياله.
          if not R["الضابط"]["الحرفُ_أثبتُها"]:
              print("::error::الحرفُ ليس أثبتَ الأقسامِ — مقياسُ التمكّن ساقطٌ بضابطه")
              sys.exit(1)
          # ⑧ ولا يُقبَل قسمٌ لم يغلِب النُّدرةَ التحليليّةَ وضوابطَ المثلِ معًا.
          for k in ("اسم", "فعل", "حرف"):
              r = h[k]
              if not (r["ثابتةٌ_مرصودة"] > r["ثابتةٌ_متوقَّعةٌ_بالنُّدرة"]
                      and r["ثابتةٌ_مرصودة"] > r["أعلى_ثابتةٍ_في_المثل"]
                      and r["درجةٌ_مرصودة"] < r["أدنى_درجةٍ_في_المثل"]):
                  print(f"::error::قسمُ {k} لم يغلِب النُّدرةَ والمثلَ معًا")
                  sys.exit(1)
          # ⑨ دَينُ «النيابةِ عن العلامة» مسعَّرٌ برقمين لا بتسمية.
          if not R["النيابةُ_عن_العلامة"]["الدَّينُ_مسعَّر"]:
              print("::error::النيابةُ بالنونِ لم تُسعَّر — دَينٌ سُمّي ولم يُقَس")
              sys.exit(1)
          # ⑩ المحاولاتُ تُشغَّل ولا تُقرَأ، وعدَّتُها مختومة.
          if R["مقيس"]["محاولاتُ_تكذيب"] < 15:
              print("::error::محاولاتُ تكذيب التمكّن دون الخمسَ عشرة")
              sys.exit(1)
          print("بابُ التمكّن: عشرةُ حرّاسٍ ✓")
          PY
      - name: بابُ الصيغة — شبكةُ الصيغِ وأبوابِ الاعتلال، ومصادمة sigha_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
