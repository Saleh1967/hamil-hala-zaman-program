          if S["يطابقُ_رقمَ_البندِ_المعلَّق_⑤"] != "نعم" or S["تكذيبٌ_بحدٍّ_ضيّقٍ_(تنوينٌ_وحدَه)"] != W["معلَّق"]["التقاطع"]:
