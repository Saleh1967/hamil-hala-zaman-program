                  or F["أزواجُ_F1"] != 11760 or F["بصماتُ_F1_الفريدة"] != 11760
                  or F["تقاطعُ_فضاءَي_الاسم"] != 0):
              die(f"بصماتُ G0/F1: {F}")

          # ⑥ خمولُ إصلاح القسمة على الأجيال — ومعه أثرٌ يجب أن يظهر، وإلّا فالآلةُ عمياء.
          I = C["CERT-INERTNESS"]
