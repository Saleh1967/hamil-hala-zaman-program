              die("ختمُ المطبوع خالف المعلنَ قبل التشغيل")
          if (N["تكذيبٌ_مقيس"]["الوقوفُ_عند_الشدّةِ_يبتلع"] != 495
                  or not N["تكذيبٌ_مقيس"]["الأثرُ_ظهر"]):
              die("حارسُ ترتيبِ الشدّةِ والتنوين بلا أثرٍ مقيس")
          if N["مقيس"]["معتلٌّ_معلَّقٌ_لم_يُطوَ"] <= 0:
              die("المعلَّقُ بلا عددٍ — فإمّا طُبِّق خفيةً وإمّا ادُّعي")

          # ⑧ لقاءُ الساكنَين: صفرٌ على الخام · جوارٌ مصنوعٌ بالفلتر · وعبورُ الكلمات وهمٌ مقيس.
