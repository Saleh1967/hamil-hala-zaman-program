          if sh["خلايا_ميدانُها_صفر"] <= 0 or sh["ثمنُ_إعلانِ_الشبكة"] <= 0:
              print("::error::شبكةُ الصيغة بلا خليّةٍ خاليةٍ أو بلا ثمنٍ مقيسٍ سابقٍ للاستعمال")
              sys.exit(1)
          # ③ القسمةُ ثلاثٌ لا رابعَ لها — قبلَ السدادِ وبعدَه.
          if (set(sad["القسمةُ_قبل"]) != {"اسم", "فعل", "حرف"}
                  or set(sad["القسمةُ_بعد"]) != {"اسم", "فعل", "حرف"}):
              print("::error::قسمةُ الصيغة ليست ثلاثًا — ظهرت خانةٌ رابعةٌ أو سقطت خانة")
              sys.exit(1)
          # ④ «مشتبه» اسمٌ ممنوعٌ ههنا كما في التمكّن: ما لم يُقطَع به دَينٌ لا قسم.
          if "مشتبه" in json.dumps(R, ensure_ascii=False):
              print("::error::لفظُ «مشتبه» في وديعةِ الصيغة — والقسمةُ ثلاثٌ ودَينٌ لا أربعة")
              sys.exit(1)
          # ⑤ الدَّوْرُ معلَنٌ ومقيس: خلايا المضارعِ محجورةٌ، ودَينُها صفرٌ بالبناءِ لا بالكشف.
          if (daw["خلايا_محجورةٌ_للدَّوْر"] <= 0 or daw["دَينُ_المحجورة"] != 0
                  or daw["منها_نقاؤها_تامٌّ_بصفرِ_اسم"] <= 0):
              print("::error::حجرُ الدَّوْرِ في باب الصيغة بلا شاهدٍ مقيس")
              sys.exit(1)
          # ⑥ ولا خليّةً محجورةً تسدِّد — الحجرُ فعلٌ لا شعار.
          if any(r["محجورةٌ_للدَّوْر"] and r["تسدِّد"] for r in R["الجدول"]):
              print("::error::خليّةٌ محجورةٌ للدَّوْرِ سدَّدت دَينًا")
              sys.exit(1)
          # ⑦ ولا خليّةً حُكِمَ عليها بلا مصنَّفٍ من الحَكَمِ المستقلّ.
          if any(r["تسدِّد"] and r["مصنَّف"] <= 0 for r in R["الجدول"]):
              print("::error::خليّةٌ سدَّدت بلا مصنَّفٍ من حَكَمِ التمكّن")
              sys.exit(1)
          # ⑧ وغلبةُ ضوابطِ المثل شرطٌ: المرصودُ يجاوزها في الخلايا والدَّين معًا.
          if not (mit["غلبَ_المثلَ"]
                  and mit["خلايا_تسدِّدُ_مرصودة"] > mit["أعلى_خلايا_في_المثل"]
                  and mit["دَينٌ_يُسدَّدُ_مرصود"] > mit["أعلى_دَينٍ_في_المثل"]):
              print("::error::شبكةُ الصيغة لم تغلِب ضوابطَ المثل")
              sys.exit(1)
          # ⑨ رحلةُ السدادِ مغلقةٌ، ولا قسمَ قائمٌ نقصَ به.
          if any(sad["القسمةُ_بعد"][k] < sad["القسمةُ_قبل"][k] for k in sad["القسمةُ_قبل"]):
              print("::error::سدادُ الصيغة أنقصَ قسمًا قائمًا — وهو لا يمسُّ إلا الدَّين")
              sys.exit(1)
          # ⑩ والسدادُ بعضٌ لا كلّ: دَينٌ باقٍ منشورٌ بعدده.
          if sad["دَينٌ_سُدِّدَ"] <= 0 or sad["دَينٌ_باقٍ"] <= 0:
              print("::error::سدادُ الصيغة بلغَ الدَّينَ كلَّه أو لم يبلغ شيئًا — ادّعاءٌ لا قياس")
              sys.exit(1)
          # ⑪ والسدادُ مسعَّرٌ لا خالص: نقاءٌ مودَعٌ فوقَ الحدِّ الموروث، وصورُ الدَّينِ مسمّاة.
          if sad["نقاءٌ_مجموعٌ_للمسدِّدة"] <= 0.5 or any(
                  not v for v in sad["صورُ_الدَّينِ_المسدَّد"].values()):
              print("::error::نقاءُ الصيغة دون الحدِّ أو صورُ دَينِها مطويّة")
              sys.exit(1)
          # ⑫ المحاولاتُ تُشغَّل ولا تُقرَأ، وعدَّتُها مختومة.
          if R["مقيس"]["محاولاتُ_تكذيب"] < 15:
              print("::error::محاولاتُ تكذيب الصيغة دون الخمسَ عشرة")
              sys.exit(1)
          print("بابُ الصيغة: اثنا عشرَ حارسًا ✓")
          PY
      - name: بابُ الوصل — ألفُ الوصلِ وطبقتاها، ومصادمة wasl_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python wasl_gate.py --json /tmp/wasl.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("wasl_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/wasl.json", encoding="utf-8"))
          if A != B:
              print("::error::wasl_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["الوصل_v0"]
          may, bn, mit = R["الميدان"], R["بن_وابن"], R["ضوابطُ_المثل"]
          isl, sad, hiy = R["الإصلاح"], R["السداد"], R["حيادُ_الألف"]
          # ① القِسمةُ تامّةٌ والميدانُ مغلق: لا موضعَ خارجَ الطبقتين ولا فضلة.
          if may["طبقاتٌ_أصابت"] != may["طبقاتٌ_مُعلَنة"]:
              print("::error::طبقاتُ الوصلِ لم تُصِب القِسمةَ المُعلَنةَ كلَّها")
              sys.exit(1)
          if may["مواضعُ_ألفِ_الوصل"] != may["منها_لامُ_التعريف"] + may["ميدانُ_المحاكمة"]:
              print("::error::ميدانُ ألفِ الوصلِ لم يُغلَق")
              sys.exit(1)
          # ② القائمةُ المغلقةُ مُسعَّرةٌ **قبلَ** أن تُستعمَل — وإلّا فهي مجّانيّة.
          if may["ثمنُ_إعلانِ_القائمة"] <= 0 or may["صورٌ_في_القائمةِ_المغلقة"] <= 0:
              print("::error::قائمةُ أسماءِ الوصلِ استُعمِلت بلا ثمنٍ مقيسٍ سابق")
              sys.exit(1)
          # ③ القسمةُ ثلاثٌ لا رابعَ لها — قبلَ السدادِ وبعدَه.
          if (set(sad["القسمةُ_قبل"]) != {"اسم", "فعل", "حرف"}
                  or set(sad["القسمةُ_بعد"]) != {"اسم", "فعل", "حرف"}):
              print("::error::قسمةُ الوصلِ ليست ثلاثًا — ظهرت خانةٌ رابعةٌ أو سقطت خانة")
              sys.exit(1)
          # ④ ولا يُسمّى «مشتبهٌ» في بايتات الوديعة — الدَّينُ دَينٌ على المصنِّف لا صنفٌ رابع.
          if "مشتبه" in open("wasl_v0.json", encoding="utf-8").read():
              print("::error::لفظُ «مشتبه» ظهر في وديعة الوصل — لا صنفَ رابعَ في القسمة")
              sys.exit(1)
          # ⑤ رحلةُ السداد مغلقةٌ ولا تنقص قسمًا قائمًا: السدادُ يمسُّ الدَّينَ وحدَه.
          if any(sad["القسمةُ_بعد"][k] < sad["القسمةُ_قبل"][k] for k in sad["القسمةُ_قبل"]):
              print("::error::سدادُ الوصلِ أنقصَ قسمًا قائمًا")
              sys.exit(1)
          if sad["دَينٌ_باقٍ"] <= 0:
              print("::error::سدادُ الوصلِ بلغَ الدَّينَ كلَّه — ادّعاءٌ لا قياس")
              sys.exit(1)
          # ⑥ السدادان لا يُجمَعان: المشتركُ والجديدُ مقيسان ومجموعُهما هو الكلّ.
          if sad["مشتركٌ_مع_بابِ_الصيغة"] + sad["جديدٌ_لا_يسدِّدُه_بابُ_الصيغة"] != sad["دَينٌ_سُدِّدَ"]:
              print("::error::قِسمةُ المشتركِ والجديدِ في سدادِ الوصلِ لم تُغلَق")
              sys.exit(1)
          if sad["جديدٌ_لا_يسدِّدُه_بابُ_الصيغة"] <= 0:
              print("::error::سدادُ الوصلِ كلُّه مشتركٌ مع بابِ الصيغة — فلا جديدَ فيه")
              sys.exit(1)
          # ⑦ الفاصلُ عن المثلِ إحصاءٌ واحدٌ **مُعلَنٌ بضعفِ الآخرَين**: عدُّ الطبقاتِ
          #    والدَّينُ يبلغهما المثلُ، فإن ادُّعِيَ أحدُهما فاصلًا سقط الباب.
          if mit["أعلى_طبقاتٍ_في_المثل"] < mit["طبقاتٌ_تسدِّدُ_مرصودة"]:
              print("::error::عدُّ الطبقاتِ ادُّعِيَ فاصلًا وقد أُعلِنَ أنّه لا يفصل")
              sys.exit(1)
          if mit["أعلى_دَينٍ_في_المثل"] < mit["دَينٌ_يُسدَّدُ_مرصود"]:
              print("::error::الدَّينُ المسدَّدُ ادُّعِيَ فاصلًا وقد أُعلِنَ أنّه لا يفصل")
              sys.exit(1)
          if not mit["غلبَ_المثلَ"] or mit["أقسامٌ_غالبةٌ_متمايزةٌ_مرصودة"] <= mit["أعلى_أقسامٍ_متمايزةٍ_في_المثل"]:
              print("::error::قِسمةُ الوصلِ لم تغلِب ضوابطَ المثلِ في الإحصاء الفاصل")
              sys.exit(1)
          # ⑧ «بن» صفرُ ميدانٍ مقيسٌ: يُودَع ولا يُدَّعى له نفعٌ ولا يُطوى.
          if bn["بن_محذوفةَ_الألف"] != 0 or bn["لها_ميدانٌ_يُقاس"]:
              print("::error::«بن» ادُّعِيَ لها ميدانٌ وقد أُودِعَت صفرًا")
              sys.exit(1)
          if bn["ابن_مثبتةَ_الألف"] <= 0:
              print("::error::طرفا الوصلِ والفصلِ كلاهما صفرٌ — فالصورةُ لم تُقَس أصلًا")
              sys.exit(1)
          # ⑨ الإصلاحُ مقيسٌ لا مدَّعًى، ولا خليّةَ انخفضَ نقاؤها.
          if isl["خلايا_ارتفعَ_نقاؤها"] <= 0 or isl["أعلى_ارتفاعِ_نقاء"] <= 0:
              print("::error::إصلاحُ الوصلِ بلا ارتفاعِ نقاءٍ مقيس")
              sys.exit(1)
          if isl["خلايا_انخفضَ_نقاؤها"] != 0:
              print("::error::خليّةٌ انخفضَ نقاؤها بالوصل — والإصلاحُ يُودَع بعدده")
              sys.exit(1)
          # ⑩ وديعةُ بابِ الصيغةِ **لا تُمَسّ**: الإصلاحُ يُقاس ولا يُكتَب فيها.
          SG = json.load(open("sigha_v0.json", encoding="utf-8"))["الصيغة_v0"]["مقيس"]
          if SG["نقاءٌ_مجموعٌ_للمسدِّدة"] != 0.7731 or SG["دَينٌ_باقٍ"] != 25604:
              print("::error::بابُ الوصلِ مسَّ أرقامَ وديعةِ الصيغة — وهو يقرأ ولا يكتب")
              sys.exit(1)
          # ⑪ دعوى حيادِ الألفِ ساقطةٌ برقمها لا بردٍّ — ومقيسةٌ بمقارنةٍ لا بمفردها.
          if hiy["الألفُ_محايدة"] or hiy["رتبةُ_الألفِ_في_القربِ_من_الحياد"] <= 1:
              print("::error::دعوى حيادِ الألفِ قُبِلت وقد أُودِعَت ساقطة")
              sys.exit(1)
          if hiy["حروفٌ_قِيسَت"] < 2:
              print("::error::حيادُ الألفِ حُكِمَ عليه بلا مقارنةٍ بحرفٍ آخر")
              sys.exit(1)
          # ⑫ محاولاتُ التكذيبِ كلُّها فشلت — ولا محاولةَ تُطوى.
          if any(x["بيان"] != "لم تنجح" for x in R["محاولاتُ_التكذيب"]):
              print("::error::محاولةُ تكذيبٍ نجحت في باب الوصل")
              sys.exit(1)
          if len(R["محاولاتُ_التكذيب"]) != R["مقيس"]["محاولاتُ_تكذيب"]:
              print("::error::عدُّ محاولاتِ تكذيبِ الوصلِ خالفَ وديعتَه")
              sys.exit(1)
          print("بابُ الوصل: اثنا عشرَ حارسًا ✓")
          PY
      - name: بابُ النيابة — الإعرابُ بالحرفِ على ضابطِ الافتعال، ومصادمة niyaba_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python niyaba_gate.py --json /tmp/niyaba.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("niyaba_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/niyaba.json", encoding="utf-8"))
          if A != B:
              print("::error::niyaba_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["النيابة_v0"]
          may, tab, aml = R["الميدان"], R["التبدُّل"], R["العامل"]
          fal, mit = R["فخُّ_ال"], R["ضوابطُ_المثل"]
          ift, khm = R["افتعالُ_خواتمِ_النون"], R["الأسماءُ_الخمسة"]
          ifk, hkm, sad = R["افتعالُ_الأسماءِ_الخمسة"], R["الحكم"], R["السداد"]
          # ① كلُّ قائمةٍ مُعلَنةٍ مُسعَّرةٌ **قبلَ** أن تُستعمَل — والنواسخُ سُعِّرت ثمّ سقطت،
          #    فثمنُها مدفوعٌ لا مردودَ له. هذا هو معنى التسعيرِ قبلَ الاستعمال.
          if min(may["ثمنُ_إعلانِ_الحقل"], may["ثمنُ_إعلانِ_النواسخ"],
                 may["ثمنُ_إعلانِ_الأسماءِ_الخمسة"]) <= 0:
              print("::error::قائمةٌ في باب النيابة استُعمِلت بلا ثمنٍ مقيسٍ سابق")
              sys.exit(1)
          if may["علاماتٌ_أصابت"] != may["علاماتٌ_مُعلَنة"]:
              print("::error::علاماتُ النيابةِ لم تُصِب القِسمةَ المُعلَنةَ كلَّها")
              sys.exit(1)
          # ② ضابطُ الافتعالِ هو الحَكَم: حقلٌ مصنوعٌ بحجمِ المرصودِ يُقاس بخمسةِ إحصاءات،
          #    فإن لم يغلِبه المرصودُ في واحدٍ منها فالدعوى ساقطةٌ — وسقوطُها يُودَع.
          if ift["إحصاءاتٌ_قِيست"] != R["مقيس"]["إحصاءاتٌ_قِيست_في_الافتعال"] or ift["إحصاءاتٌ_قِيست"] < 5:
              print("::error::ضابطُ الافتعالِ قِيسَ بأقلَّ من خمسةِ إحصاءاتٍ أو خالفَ وديعتَه")
              sys.exit(1)
          if ift["إحصاءاتٌ_غلبَ_فيها_المرصود"] != 0 or ift["خواتمُ_النونِ_قائمة"]:
              print("::error::خواتمُ النونِ قُبِلت وقد أُودِعَت ساقطةً بضابطِ الافتعال")
              sys.exit(1)
          # ③ السدادُ الممتنعُ رقمٌ **مقيسٌ لا مطبَّق**: يُودَع بعدده ولا يدخل الدَّينَ المسدَّد.
          if sad["سدادٌ_ممتنعٌ_من_خواتمِ_النون"] != may["دَينٌ_في_الحقل"]:
              print("::error::السدادُ الممتنعُ خالفَ دَينَ الحقلِ المقيس")
              sys.exit(1)
          if sad["دَينٌ_سُدِّدَ"] >= sad["سدادٌ_ممتنعٌ_من_خواتمِ_النون"]:
              print("::error::السدادُ الممتنعُ طُبِّقَ وقد أُودِعَ ممتنعًا")
              sys.exit(1)
          # ④ الأسماءُ الخمسةُ لا تقوم بالنقاءِ ولا بالكثرةِ بل بإكمالِ الثلاثيّةِ وحدَه،
          #    ولا تقوم إلّا إن جاوزت الفرقَ المصنوعةَ بحجمِها.
          if ifk["مكمِّلاتٌ_مرصودة"] <= ifk["أعلى_مكمِّلاتٍ_في_المصنوع"] or not ifk["الخمسةُ_قائمة"]:
              print("::error::الأسماءُ الخمسةُ لم تغلِب الافتعالَ في إكمالِ الثلاثيّة")
              sys.exit(1)
          if khm["صورٌ_مرخَّصة"] + khm["صورٌ_محجورة"] + khm["صورٌ_بلا_مثل"] != khm["صورٌ_مُعلَنة"]:
              print("::error::قِسمةُ صورِ الأسماءِ الخمسةِ لم تُغلَق")
              sys.exit(1)
          # ⑤ فخُّ «ال» مقيسٌ لا مدَّعًى: على المثلِ الصادقِ تنقلب علامةٌ غالبُها، ويُودَع انقلابُها.
          if fal["علاماتٌ_انقلبَ_غالبُها"] < 1 or fal["أعلى_نصيبٍ_لـال_في_المصنَّف"] <= 0.5:
              print("::error::فخُّ «ال» أُودِعَ بلا انقلابٍ مقيسٍ — فالدعوى بلا أثر")
              sys.exit(1)
          if mit["ميدانُ_المثلِ_الصادق"] >= may["ميدانُ_حقلِ_العلامة"]:
              print("::error::المثلُ الصادقُ لم يُضيَّق بإخراجِ حاملاتِ «ال»")
              sys.exit(1)
          # ⑥ الميدانان لا يُجمَعان في حكمٍ واحد: واحدٌ قامَ من اثنين، ويُودَع الوجهان.
          if hkm["ميادينُ_قامت"] != 1 or hkm["ميادينُ_حُوكِمت"] != 2:
              print("::error::حكمُ النيابةِ جمعَ الميدانين أو خالفَ وديعتَه")
              sys.exit(1)
          # ⑦ الحجرُ يُثبَت برقمٍ لا بدعوى: «فو» مجرورةً عينُ حرفِ الجرِّ في الرسم.
          if khm["حرفٌ_في_المحجورة"] <= khm["اسمٌ_في_المحجورة"]:
              print("::error::الصورةُ المحجورةُ حُجِرت بلا رقمٍ يقطع")
              sys.exit(1)
          # ⑧ ولا يُسمّى «مشتبهٌ» في بايتات الوديعة — الدَّينُ دَينٌ على المصنِّف لا صنفٌ رابع.
          if "مشتبه" in open("niyaba_v0.json", encoding="utf-8").read():
              print("::error::لفظُ «مشتبه» ظهر في وديعة النيابة — لا صنفَ رابعَ في القسمة")
              sys.exit(1)
          # ⑨ القسمةُ ثلاثٌ لا رابعَ لها — قبلَ السدادِ وبعدَه، ولا قسمَ ينقص.
          if (set(sad["القسمةُ_قبل"]) != {"اسم", "فعل", "حرف"}
                  or set(sad["القسمةُ_بعد"]) != {"اسم", "فعل", "حرف"}):
              print("::error::قسمةُ النيابةِ ليست ثلاثًا — ظهرت خانةٌ رابعةٌ أو سقطت خانة")
              sys.exit(1)
          if any(sad["القسمةُ_بعد"][k] < sad["القسمةُ_قبل"][k] for k in sad["القسمةُ_قبل"]):
              print("::error::سدادُ النيابةِ أنقصَ قسمًا قائمًا")
              sys.exit(1)
          # ⑩ السدادان لا يُجمَعان، والباقي مقيسٌ لا صفرَ فيه.
          if (sad["مشتركٌ_مع_بابِ_الصيغة"] + sad["مشتركٌ_مع_بابِ_الوصل"]
                  + sad["جديدٌ_لا_يسدِّدُه_بابٌ_قبلَه"] != sad["دَينٌ_سُدِّدَ"]):
              print("::error::قِسمةُ المشتركِ والجديدِ في سدادِ النيابةِ لم تُغلَق")
              sys.exit(1)
          if sad["دَينٌ_باقٍ"] != 26689 or sad["جديدٌ_لا_يسدِّدُه_بابٌ_قبلَه"] <= 0:
              print("::error::باقي دَينِ النيابةِ خالفَ وديعتَه أو لا جديدَ في سداده")
              sys.exit(1)
          # ⑪ العلامةُ تتبدَّل على الجذرِ نفسِه — وإلّا فهي بنيةٌ لا إعراب. وأثرُ الناسخِ
          #    أُودِعَ ساقطًا دونَ أثرِ الجارّ، فإن قُبِلَ سقطَ الباب.
          if not tab["العلامةُ_تتبدَّل"] or tab["جذورٌ_تبدّلت_علامتُها"] <= 0:
              print("::error::العلامةُ لم يُقَس تبدُّلُها على الجذرِ نفسِه")
              sys.exit(1)
          if aml["الناسخُ_يُثبِت"] or aml["أثرُ_الناسخِ_في_ين"] >= aml["أثرُ_الجارِّ_في_ين"]:
              print("::error::دعوى النواسخِ قُبِلت وقد أُودِعَت ساقطةً بثمنٍ مدفوع")
              sys.exit(1)
          # ⑫ محاولاتُ التكذيبِ كلُّها فشلت — ولا محاولةَ تُطوى.
          if any(x["بيان"] != "لم تنجح" for x in R["محاولاتُ_التكذيب"]):
              print("::error::محاولةُ تكذيبٍ نجحت في باب النيابة")
              sys.exit(1)
          if len(R["محاولاتُ_التكذيب"]) != R["مقيس"]["محاولاتُ_تكذيب"]:
              print("::error::عدُّ محاولاتِ تكذيبِ النيابةِ خالفَ وديعتَه")
              sys.exit(1)
          print("بابُ النيابة: اثنا عشرَ حارسًا ✓")
          PY
      - name: بابُ التوليدِ الحتميّ — بذرةٌ من الختمِ وبوّابةٌ تُعيد القياس، ومصادمة tawlid_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python tawlid_gate.py --json /tmp/tawlid.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("tawlid_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/tawlid.json", encoding="utf-8"))
          if A != B:
              print("::error::tawlid_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["التوليد_v0"]
          # ① المحاولاتُ تُشغَّل ولا تُقرَأ — وعدَّتُها مختومةٌ لئلّا تُسقَط واحدةٌ صامتةً.
          if R["محاولاتُ_التكذيب"] < 10:
              print("::error::محاولاتُ التكذيب دون العشر — بابٌ لا يستطيع أن يسقط")
              sys.exit(1)
          # ② البذرةُ من الختمِ لا من يدٍ: البصمةُ المودَعةُ تُصادَم ببايتات المجمَّدِ حيًّا.
          import hashlib, harakat_layer as HL
          live = hashlib.sha256(open(HL.CORPUS, "rb").read()).hexdigest()
          if R["الميدان"]["بصمةُ_المجمَّد"] != live:
              print("::error::بصمةُ المجمَّدِ في الوديعةِ خالفت بايتاتِه — بذرةٌ بلا ختم")
              sys.exit(1)
          # ③ صيغةُ الشاهدِ **واحدةٌ** تُطبَّق على الطرفين — والنصُّ يُفحَص في الوديعة،
          #    فلو صارتا نسختين لتصالح الرقمان لأنّهما لم يلتقيا.
          if "سواءً" not in R["الحدُّ_المُعلَن"]["صيغةُ_الشاهد"]:
              print("::error::إعلانُ وحدةِ صيغةِ الشاهدِ سقط من الوديعة")
              sys.exit(1)
          if len(R["الحدُّ_المُعلَن"]["الشواهد"]) != 3:
              print("::error::الشواهدُ ليست ثلاثةً كما أُعلِنت قبلَ التوليد")
              sys.exit(1)
          # ④ Δ مشتقٌّ من إعادةِ السحبِ لا مكتوبٌ سماحةً: موجبٌ في كلِّ شاهدٍ ودونَ ثابتِه.
          D = R["حدُّ_المطابقة"]
          SH = R["الحدُّ_المُعلَن"]["الشواهد"]
          if D["إعاداتُ_السحب"] != 11 or D["مقامُ_إعادةِ_السحب"] != R["الميدان"]["كلمات"]:
              print("::error::إعادةُ السحبِ بُدِّلت عدَّةً أو مقامًا بعد التسجيل")
              sys.exit(1)
          for k in SH:
              if not (0 < D["Δ"][k] < abs(D["ثوابتُ_المجمَّد"][k])):
                  print(f"::error::Δ {k} صفرٌ أو بلغَ ثابتَه — حدٌّ بلا معنى")
                  sys.exit(1)
          # ⑤ **دعوى «النصفان أضيقُ بالبناء» ساقطةٌ بالقياس ورقمُها مختوم**: العدُّ
          #    يوافق الأرقامَ، والحكمُ يوافق العدَّ — وطيُّ التجاوزِ يُسقِط الخطوة.
          over = sorted(k for k in SH if D["تذبذبُ_النصفين"][k] > D["Δ"][k])
          if D["شواهدُ_تجاوزَ_فيها_النصفان_Δ"] != over or D["عددُ_ما_تجاوز"] != len(over):
              print("::error::عدُّ ما تجاوزَ فيه النصفان Δ خالفَ أرقامَه — تجاوزٌ طُوي")
              sys.exit(1)
          if D["دعوى_النصفين_أضيقُ_بالبناء"].startswith("ساقطة") != bool(over):
              print("::error::حكمُ دعوى النصفين لا يوافق عدَّه — حكمٌ كُتب لا حُسب")
              sys.exit(1)
          # ⑥ والحدُّ الأوسعُ حدٌّ ثانٍ فعلًا: لا ينقص عن Δ، ولا يساويه في الكلّ.
          if any(D["الحدُّ_الأوسع"][k] < D["Δ"][k] for k in SH) \
             or all(D["الحدُّ_الأوسع"][k] == D["Δ"][k] for k in SH):
              print("::error::الحدُّ الأوسعُ ليس حدًّا ثانيًا — نقصَ عن Δ أو ساواه في الكلّ")
              sys.exit(1)
          # ⑦ ومتانةُ الحكمِ على الحدَّين **تُحسَب ولا تُكتَب**.
          G = R["البوّابة"]
          stable = (G["رتبٌ_عبرت"] == G["رتبٌ_عبرت_بالحدِّ_الأوسع"]
                    and all(r["شواهدُ_طابقت"] == 3 for r in G["رتب"]
                            if r["شواهدُ_طابقت_بالحدِّ_الأوسع"] == 3))
          if G["الحكمُ_ثابتٌ_على_الحدَّين"] != stable:
              print("::error::متانةُ الحكمِ على الحدَّين كُتبت ولم تُحسَب")
              sys.exit(1)
          # ⑧ البوّابةُ **ترفُض فعلًا وتقبَل فعلًا**: المسطَّحُ لا يعبر شاهدًا،
          #    ورتبةٌ واحدةٌ على الأقلِّ تعبر — وإلّا فحدٌّ مستحيلٌ لا برهان.
          by = {r["اسم"]: r for r in G["رتب"]}
          if by["مسطَّح"]["شواهدُ_طابقت"] > 0:
              print("::error::المسطَّحُ عبرَ شاهدًا — بوّابةٌ لا ترفض")
              sys.exit(1)
          if G["رتبٌ_عبرت"] == 0:
              print("::error::لم تعبر رتبةٌ — بوّابةٌ لا يعبرها شيءٌ بالبناء")
              sys.exit(1)
          # ⑨ والحكمُ مشتقٌّ من خاناته: كلُّ «طابق» فارقُه ≤ Δ ولا عكس.
          for r in G["رتب"]:
              if set(r["خانات"]) != set(SH):
                  print("::error::شاهدٌ خارجَ الصيغِ الثلاثِ المعلنة")
                  sys.exit(1)
              for k in SH:
                  if r["خانات"][k]["طابق"] != (r["خانات"][k]["فارق"] <= D["Δ"][k]):
                      print(f"::error::خانةُ {r['اسم']}/{k} لا توافق حدَّها")
                      sys.exit(1)
              if r["شواهدُ_طابقت"] != sum(1 for k in SH if r["خانات"][k]["طابق"]):
                  print(f"::error::عدُّ خاناتِ {r['اسم']} يخالف خاناتِه")
                  sys.exit(1)
          # ⑩ و«المُعار» ليس رأيًا: ما سحبَ أطوالَه من المجمَّدِ يُعير «طولَ الكلمة».
          borrows = {"أحاديّ", "ثنائيّ", "ثلاثيّ", "معجميٌّ بالتواتر"}
          for r in G["رتب"]:
              if (SH[0] in r["مُعارٌ_مُعلَن"]) != (r["اسم"] in borrows):
                  print(f"::error::إعلانُ «مُعار» في {r['اسم']} خالفَ البناءَ")
                  sys.exit(1)
          # ⑪ **والصفرُ المقيسُ هو الخبر**: لم تكسب رتبةٌ شاهدًا بغيرِ إعارة.
          if G["رتبٌ_عبرت_بلا_إعارةٍ_تامّة"] != sum(
                  1 for r in G["رتب"]
                  if r["شواهدُ_طابقت"] == 3 and r["شواهدُ_طابقت_بلا_إعارة"] > 0):
              print("::error::عدُّ العابرين بلا إعارةٍ تامّةٍ يخالف صفوفَه")
              sys.exit(1)
          # ⑫ والشاهدُ الثالثُ موروثٌ بعينه — وحارسُه في الباب، وههنا يُفتَّش نصُّ براءته.
          for key in ("online_peel", "madlul_gate"):
              if key not in R["الحدُّ_المُعلَن"]:
                  print(f"::error::براءةُ {key} سقطت من الوديعة")
                  sys.exit(1)
          # ⑬ الديونُ تُسمّى ولا تُرقَّم.
          T = R["ديونٌ_بلا_رقم"]
          if T["عدد"] != len(T["بنود"]):
              print("::error::عدُّ الديونِ يخالف بنودَها")
              sys.exit(1)
          if any(any(ch.isdigit() for ch in d) for d in T["بنود"]):
              print("::error::دَينٌ حملَ رقمًا — والدَّينُ يُسمّى ولا يُرقَّم")
              sys.exit(1)
          print("بابُ التوليدِ الحتميّ: ثلاثةَ عشرَ حارسًا ✓")
          PY
      - name: بابُ توحيدِ المقام — قسمتان على مقامٍ واحدٍ بدالّةٍ مُعلَنةِ الشروط، ومصادمة tawhid_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python tawhid_gate.py --json /tmp/tawhid.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("tawhid_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/tawhid.json", encoding="utf-8"))
          if A != B:
              print("::error::tawhid_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["توحيدُ_المقام_v0"]
          M, L = R["المقام"], R["السلّم"]
          # ① المحاولاتُ تُشغَّل ولا تُقرَأ — وعدَّتُها مختومةٌ لئلّا تُسقَط واحدةٌ صامتةً.
          if len(R["محاولاتُ_التكذيب"]) < 12 or any(t["نجحت"] for t in R["محاولاتُ_التكذيب"]):
              print("::error::محاولاتُ التكذيب دون اثنتي عشرةَ أو نجحت واحدةٌ")
              sys.exit(1)
          # ② المقامُ واحدٌ في الثلاثة — والمصادمةُ شرطٌ لا برهان، ونصُّ ذلك مُودَعٌ.
          if len({M["المقامُ_الحيّ"], M["مقامُ_وديعةِ_الدالّ"],
                  M["مقامُ_وديعةِ_المدلول"]}) != 1 or not M["اتّحدت"]:
              print("::error::مقاماتٌ لا تتّحد — وقد قيل إنّها واحدة")
              sys.exit(1)
          if "شرطٌ لا برهان" not in M["بيان"]:
              print("::error::إعلانُ «المصادمةُ شرطٌ لا برهان» سقط من الوديعة")
              sys.exit(1)
          # ③ **البرهانُ استغراقُ المواضع**: كتلُ كلِّ قسمةٍ في كلِّ درجٍ تبلغ المقامَ
          #    تمامًا، وفيها خانةُ متبقٍّ معدودةٌ واحدةٌ لا أكثر ولا أقلّ.
          n = M["المقامُ_الحيّ"]
          for row in L["أدراج"]:
              for key in ("صفوفُ_الدالّ", "صفوفُ_المدلول"):
                  cells = row[key]
                  if sum(c["مواضع"] for c in cells) != n:
                      print(f"::error::{key} في الدرج {row['درج']} لا تستغرق المقام")
                      sys.exit(1)
                  if sum(1 for c in cells if c["متبقٍّ"]) != 1:
                      print(f"::error::{key} بلا خانةِ متبقٍّ واحدةٍ معدودة")
                      sys.exit(1)
          # ④ المنعُ مقيسٌ لا مفترَض: التداخلُ صفرٌ في القسمتين وفي الأدراج كلِّها.
          if any(row["تداخلُ_الدالّ"] or row["تداخلُ_المدلول"] for row in L["أدراج"]):
              print("::error::تداخلٌ في قسمةٍ — والتوحيدُ يشترط المنع")
              sys.exit(1)
          # ⑤ **الصورُ المتنازَعُ عليها تُعَدُّ ولا تُطوى**، والفاصلُ مُعلَنٌ باسم موضعه.
          if not L["صورٌ_متنازعٌ_عليها"] or "madlul_v0.json" not in L["فاصلُ_التنازع"]:
              print("::error::المتنازَعُ عليه طُوي أو الفاصلُ غيرُ معلنِ الموضع")
              sys.exit(1)
          # ⑥ **الحَكَمُ ضابطان لا واحد**: المرصودُ فوقَ أعلى كلٍّ منهما، والحكمُ
          #    المكتوبُ يوافق ما يُحسَب من الرقمين — فلا لفظَ يسبق عدَّه.
          for row in L["أدراج"]:
              I = row["اشتراك"]["I"]
              weak = row["ضابطُ_خلطِ_الأسماء"]["أعلى"]
              hard = row["ضابطُ_الفرقِ_المصنوعة"]["أعلى"]
              if row["غلبَ_خلطَ_الأسماء"] != (I > weak) \
                 or row["غلبَ_الفرقَ_المصنوعة"] != (I > hard) \
                 or row["غلبَ_الضابطين"] != (I > weak and I > hard):
                  print(f"::error::حكمُ الضابطين في الدرج {row['درج']} كُتب ولم يُحسَب")
                  sys.exit(1)
              if not row["غلبَ_الضابطين"]:
                  print(f"::error::الدرج {row['درج']} لم يغلب الضابطين — اطّرادٌ خاوٍ")
                  sys.exit(1)
          # ⑦ الضابطُ القويُّ **قويٌّ فعلًا**: أعلى الفرقِ المصنوعةِ فوقَ أعلى خلطِ
          #    الأسماءِ بمراتب — وإلّا فالضابطان واحدٌ باسمين.
          if any(row["ضابطُ_الفرقِ_المصنوعة"]["أعلى"] <= row["ضابطُ_خلطِ_الأسماء"]["أعلى"]
                 for row in L["أدراج"]):
              print("::error::الفرقُ المصنوعةُ ليست ضابطًا أقوى من خلطِ الأسماء")
              sys.exit(1)
          # ⑧ **ليستا قسمةً واحدةً باسمين**: نسبةُ الاطّرادِ دون الواحد، والحكمُ يوافقها.
          for row in L["أدراج"]:
              ratio = row["اشتراك"]["نسبةُ_الاطّراد"]
              if row["ليستا_قسمةً_واحدة"] != (ratio < 1.0) or ratio >= 1.0:
                  print(f"::error::قسمةٌ تحدِّد الأخرى في الدرج {row['درج']}")
                  sys.exit(1)
          # ⑨ الاطّرادُ يُقاس بعد التوحيد لا قبله: I = H(أ) + H(ب) − H(أ،ب) يُعاد
          #    اشتقاقُه من المُودَع، وخلايا المشغولِ لا تتجاوز الممكن.
          for row in L["أدراج"]:
              s = row["اشتراك"]
              if round(s["H_أ"] + s["H_ب"] - s["H_معًا"], 3) != round(s["I"], 3):
                  print(f"::error::I في الدرج {row['درج']} لا يُشتَقّ من H المُودَعة")
                  sys.exit(1)
              if not 0 < s["خلايا_مشغولة"] <= s["خلايا_ممكنة"]:
                  print(f"::error::خلايا الدرج {row['درج']} خارج حدِّها")
                  sys.exit(1)
          # ⑩ السلّمُ مقروءٌ من بابه لا منسوخًا، والحكمُ لا يتقلّب بالدرج.
          import aqsam_gate as AQ
          if L["سلّم"] != list(AQ.RUNGS) or not L["حكمٌ_مستقرٌّ_على_السلّم"]:
              print("::error::السلّمُ بُدِّل أو الحكمُ متقلّبٌ بالدرج")
              sys.exit(1)
          # ⑪ شروطُ الدالّةِ الخمسةُ مُعلَنةٌ في الوديعة، واسمُها لا يُبدَّل.
          if R["الدالّة"]["اسم"] != "wahhid" or len(R["الدالّة"]["شروط"]) != 5:
              print("::error::الدالّةُ بُدِّل اسمُها أو نقصت شروطُها")
              sys.exit(1)
          # ⑫ **الدالّةُ تصرخ ولا تصحِّح**: تُستدعى بمدخلٍ فاسدٍ ههنا ويُشترَط صريخُها.
          import tawhid_gate as TH
          pair = ((TH.Q_DALL, "م", [("أ", {0, 1}), ("ب", {1, 2})]),
                  (TH.Q_MADLUL, "ن", [("ج", {4})]))
          for name, call in (("قسمةٌ غيرُ مانعة", lambda: TH.wahhid(8, pair)),
                             ("مقامٌ غيرُ موجب", lambda: TH.wahhid(0, pair)),
                             ("مقامان لا يتّحدان",
                              lambda: TH.ishtirak(4, ["أ"] * 4, ["ب"] * 3))):
              try:
                  call()
              except TH.TawhidError:
                  continue
              print(f"::error::الدالّةُ قبلت «{name}» — تصحيحٌ حيث يجب الصريخ")
              sys.exit(1)
          # ⑬ الديونُ تُسمّى ولا تُرقَّم، والحدُّ المُعلَنُ يذكر أنّ المُوحَّدَ المقامُ لا الحيثية.
          T = R["ديونٌ_بلا_رقم"]
          if T["عدد"] != len(T["بنود"]) or T["عدد"] < 4:
              print("::error::عدُّ الديونِ يخالف بنودَها أو نقصت عن أربعة")
              sys.exit(1)
          if any(any(ch.isdigit() for ch in d) for d in T["بنود"]):
              print("::error::دَينٌ حملَ رقمًا — والدَّينُ يُسمّى ولا يُرقَّم")
              sys.exit(1)
          if "يوحَّد المقامُ لا الحيثية" not in R["الحدُّ_المُعلَن"]:
              print("::error::إعلانُ «يوحَّد المقامُ لا الحيثية» سقط من الوديعة")
              sys.exit(1)
          print("بابُ توحيدِ المقام: ثلاثةَ عشرَ حارسًا ✓")
          PY
      - name: بابُ الترجيح — سلّمُ النبهانيّ مُعيَّنًا إلى أجناس hamil، ومصادمة tarjih_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python tarjih_gate.py --json /tmp/tarjih.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("tarjih_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/tarjih.json", encoding="utf-8"))
          if A != B:
              print("::error::tarjih_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["الترجيح_v0"]
          # ① المادّةُ مستوردةٌ من tawhid_v0.json حرفيًّا — لا تنازعَ جديدًا يُصطنَع.
          T = json.load(open("tawhid_v0.json", encoding="utf-8"))["توحيدُ_المقام_v0"]
          if R["المادّة"]["صورٌ_متنازعٌ_عليها"] != T["السلّم"]["صورٌ_متنازعٌ_عليها"]:
              print("::error::مادّةُ الترجيح خالفت صورَ tawhid المتنازَعَ عليها")
              sys.exit(1)
          if R["المادّة"]["صورٌ_مشتركةٌ_في_الدرج_الثاني"] != T["مقيس"]["صورٌ مشتركةٌ في الدرج الثاني"]:
              print("::error::عددُ الصورِ المشتركة خالف tawhid")
              sys.exit(1)
          # ② بندٌ متوقَّعٌ قبل القياس: صفرٌ يُصعَّد ما دام الجمعُ نجح، ومقيسٌ يطابقه.
          if R["بندٌ_متوقَّعٌ_قبل_القياس"] != R["مقيس"]["مواضعُ تُحسَم بالسلّم"]:
              print("::error::البندُ المتوقَّعُ قبل القياس خالف المقيس")
              sys.exit(1)
          if not R["اختبارُ_الجمع"]["جُمِعا"] or R["اختبارُ_الجمع"]["مصعَّدةٌ_إلى_السلّم"] != []:
              print("::error::اختبارُ الجمع لم ينجح رغم استقرار حكم tawhid")
              sys.exit(1)
          # ③ محاولاتُ التكذيب تُشغَّل ولا تُقرَأ.
          if len(R["محاولاتُ_التكذيب"]) < 8 or any("لم يرفض" in t["نتيجة"] for t in R["محاولاتُ_التكذيب"]):
              print("::error::محاولاتُ تكذيبِ الترجيح دون ثمانٍ أو نجحت واحدةٌ")
              sys.exit(1)
          # ④ الديونُ تُسمّى ولا تُرقَّم.
          Dt = R["ديونٌ_بلا_رقم"]
          if Dt["عدد"] != len(Dt["بنود"]):
              print("::error::عدُّ ديون الترجيح يخالف بنودَها")
              sys.exit(1)
          # ⑤ التعيينُ المصدَّق كاملٌ: الأجناسُ الأربعةُ حاضرةٌ بأسمائها.
          if set(R["التعيينُ_المصدَّق"]) != {"تخصيص", "إضمار≡مجاز", "نقل", "اشتراك"}:
              print("::error::تعيينُ الأجناس المصدَّق نقص أو زاد")
              sys.exit(1)
          print("بابُ الترجيح: خمسةُ حرّاسٍ ✓")
          PY
      - name: بابُ الشاهد الرابع (الوزن) — سلّمُ الأجيال مربوطًا بمكسب الأوزان، ومصادمة wazn_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python wazn_gate.py --json /tmp/wazn.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("wazn_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/wazn.json", encoding="utf-8"))
          if A != B:
              print("::error::wazn_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          R = B["الوزن_v0"]
          # ① القيدُ Φ2-1 وسلّمُ الأجيال (G1..G3) مقروءان من burhan_v0.json — يُصادمان.
          G = json.load(open("burhan/burhan_v0.json", encoding="utf-8"))["البرهان_v0"]["شهادات"]
          if G["CERT-GENERATIONS"]["حكم"] != "خضراء" or G["CERT-INERTNESS"]["حكم"] != "خضراء":
              print("::error::شهادتا burhan (الأجيال/الخمول) لم تعودا خضراوين")
              sys.exit(1)
          if (R["مقيس"]["G1"], R["مقيس"]["G2"], R["مقيس"]["G3"]) != (112, 11760, 1251264):
              print("::error::سلّمُ الأجيال G1..G3 خالف المتوقَّعَ المُعلَن")
              sys.exit(1)
          # ② R0 يصادم dictionary_v0.json حرفيًّا — لا رقمَ خارجَ المُقفَل.
          D = json.load(open("dictionary_v0.json", encoding="utf-8"))["المعجم_v0"]
          if R["مقيس"]["awzan_gain (R0)"] != D["coverage"]["awzan_gain"]:
              print("::error::awzan_gain (R0) خالف dictionary_v0.json")
              sys.exit(1)
          if R["مقيس"]["rules_cost_bits (R0)"] != D["rules_cost_bits"]:
              print("::error::rules_cost_bits (R0) خالف dictionary_v0.json")
              sys.exit(1)
          # ③ R1 خمولٌ (Δ=0) وR2 تحرّكٌ حقيقيّ (Δ≠0) — لا عمى ولا كذبَ ترتيب.
          if tuple(R["مقيس"]["Δ(R1)"]) != (0, 0):
              print("::error::R1 (ترتيبٌ فقط) تحرّك — تسرُّبٌ من ترتيب التسجيل")
              sys.exit(1)
          if tuple(R["مقيس"]["Δ(R2)"]) == (0, 0):
              print("::error::R2 (توسيعٌ حقيقيّ) لم يتحرّك — البوّابةُ عمياء")
              sys.exit(1)
          # ④ الشاهدُ الرابعُ يربط ربحَ الأوزان بسلّم التوليد لأنّ R2 عبرت بوّابتَها.
          if not R["الشاهدُ_الرابعُ_يربط"]:
              print("::error::الشاهدُ الرابعُ لم يربط رغم عبور R2 — تسجيلٌ خالف حكمَه")
              sys.exit(1)
          # ⑤ محاولاتُ التكذيب تُشغَّل ولا تُقرَأ.
          if len(R["محاولاتُ_التكذيب"]) < 11 or any("لم يرفض" in t["نتيجة"] for t in R["محاولاتُ_التكذيب"]):
              print("::error::محاولاتُ تكذيبِ الوزن دون إحدى عشرةَ أو نجحت واحدةٌ")
              sys.exit(1)
          # ⑥ فاتورةُ R2 الكاملة: الحركةُ (Δ≠0) لا تعني ربحًا — يُصادَم حكمُ deposit_law.
          inv = R["فاتورةُ_R2"]
          if inv["كلفةُ_الجدول"] != 32:
              print("::error::Δ(كلفةُ الجدول) لفاتورة R2 خالف 32 — ازدواجُ عدٍّ عاد؟")
              sys.exit(1)
          if inv["حكمُ_الفاتورة"] not in ("يُقبَل", "يُرفَض"):
              print("::error::حكمُ فاتورةِ R2 خارجَ الحكمَين المُعلَنَين")
              sys.exit(1)
          if R["مقيس"]["الفاتورةُ_مقبولة"] != (inv["حكمُ_الفاتورة"] == "يُقبَل"):
              print("::error::الفاتورةُ_مقبولة تخالف حكمَ الفاتورة نفسِها")
              sys.exit(1)
          print("بابُ الشاهد الرابع (الوزن): ستّةُ حرّاسٍ ✓")
          PY
      - name: محطّةُ التعلُّم — قواعدُ النبهانيِّ بالفاتورة حَكَمًا، ومصادمة ta3allum_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحطّة
          python ta3allum_gate.py --json /tmp/ta3allum.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          A = json.load(open("ta3allum_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/ta3allum.json", encoding="utf-8"))
          if A != B:
              print("::error::ta3allum_v0.json المودَعةُ خالفت ما تنتجه المحطّة — صريخ")
              sys.exit(1)
          T = B["التعلُّم_v0"]; M = T["مقيس"]
          # ① لا عتبةَ في الحكم: حَكَمُ كلِّ قاعدةٍ من مفردتَي deposit_law وحدَهما،
          #    فلو دخل حكمٌ خامسٌ (أو سلّمُ أصنافٍ كسلّم بابِ الدلالات) سقطت المحطّة.
          RULINGS = {"مُودَعةٌ بالبرهان", "مردودةٌ بالفاتورة",
                     "مردودةٌ بالضابط", "مردودةٌ بالانحلال"}
          bad = [r["صفّ"] for r in T["قواعدُ_الكتاب"] if r["حكم"] not in RULINGS]
          if bad:
              print(f"::error::حكمٌ خارجَ المفردات الأربع المعلنة: {bad}")
              sys.exit(1)
          # ② والحكمُ مشتقٌّ من أرقامه لا مكتوبٌ بجانبها: كلُّ «مُودَعة» Δ<0 وهزمت
          #    ضابطَها ولم تنحلّ، وكلُّ مردودةٍ خالفت واحدًا من الثلاثة.
          for r in T["قواعدُ_الكتاب"]:
              sound = r["Δ"] < 0 and r["Δ"] < r["ضابط"] and not r["منحلّة"]
              if sound != (r["حكم"] == "مُودَعةٌ بالبرهان"):
                  print(f"::error::حكمُ «{r['صفّ']}» لا يتبع أرقامَه — حكمٌ مكتوب")
                  sys.exit(1)
          # ③ المُودَعُ والمردودُ يستوعبان الميدان — فلا قاعدةٌ تسقط بين الخانتين.
          if M["مُودَعةٌ بالبرهان"] + M["مردودةٌ بالبرهان"] != M["صفوفٌ في الميدان"] \
             or M["صفوفٌ في الميدان"] + M["صفوفٌ خارجَ الميدان"] != 11:
              print("::error::عدُّ الميدان لا يستوعب الصفوفَ الأحدَ عشرَ — عدٌّ مفقود")
              sys.exit(1)
          # ④ **الإيماءُ مردودٌ بالفاتورة لا بمنعٍ ههنا**: هذه المحطّةُ لا تعرف
          #    `ban_imaa_verdict` ولا تستدعيه؛ فلو جاء مُودَعًا لوجب أن يُعلَن ذلك
          #    لا أن يُقمَع. والحارسُ يثبّت أنّ الردَّ **جاء من رقمه** (Δ فوق الصفر).
          imaa = next(r for r in T["قواعدُ_الكتاب"] if r["صفّ"] == "الإيماء")
          if imaa["حكم"] == "مُودَعةٌ بالبرهان" or imaa["Δ"] <= 0:
              print("::error::الإيماءُ أُودِع ههنا أو رُدَّ بغير فاتورته — صريخ")
              sys.exit(1)
          # ⑤ والقاعدةُ المتعلَّمةُ لا تُحكَم على ما اختارها: كلُّ متعلَّمةٍ عُزلت
          #    آياتُ شواهدها فعلًا (آياتٌ معزولةٌ > 0) وصمدت فاتورتُها بعد العزل.
          for r in T["التعلُّمُ_بالشواهد"]:
              if r["متعلَّمة"] is None:
                  continue
              if not r["آياتٌ_معزولة"] or not r["صمدت_بعد_العزل"]:
                  print(f"::error::«{r['صفّ']}» تعلَّمت بلا عزلٍ أو لم تصمدْ بعده")
                  sys.exit(1)
          # ⑥ ومحاولاتُ التكذيب تُشغَّل بعدّتها المختومة ولا تنجح واحدةٌ منها.
          t = T["محاولاتُ_التكذيب"]
          won = [x["محاولة"] for x in t if x["نجحت"]]
          if not t or won or len(t) != M["محاولاتُ_تكذيب"]:
              print(f"::error::تكذيبٌ نجح ({won}) أو خالف عدَّتَه — صريخ")
              sys.exit(1)
          print(f"محطّةُ التعلُّم: {M['مرشّحون']} مرشّحًا · مُودَعةٌ بالبرهان "
                f"{M['مُودَعةٌ بالبرهان']} · مردودةٌ {M['مردودةٌ بالبرهان']} "
                f"(الإيماءُ Δ={imaa['Δ']:+.1f}) · تعلَّمت بالشواهد "
                f"{M['تعلَّمت بالشواهد']} · محاولاتُ التكذيب {len(t)} ✓")
          PY

      - name: بابُ الأقسام — صنعةُ بناء القاعدة، ومصادمة aqsam_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          python aqsam_gate.py --json /tmp/aqsam.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          import aqsam_gate as AG
          A = json.load(open("aqsam_v0.json", encoding="utf-8"))
          B = json.load(open("/tmp/aqsam.json", encoding="utf-8"))
          if A != B:
              print("::error::aqsam_v0.json المودَعةُ خالفت ما ينتجه البابُ — صريخ")
              sys.exit(1)
          Q = B["الأقسام_v0"]; M = Q["مقيس"]
          # ① **الحارسُ الأمّ**: العددُ مشتقٌّ ومصادَمٌ. لا قسمةَ يخالف مشتقُّها
          #    منصوصَها، ولا قسمةَ عددُ أقسامها المسرودةِ غيرُ مشتقِّها.
          for r in Q["القسمات"]:
              if not r["صادقَ_الاشتقاق"] or r["مشتقّ"] != r["منصوص"] \
                 or len(r["أقسام"]) != r["مشتقّ"]:
                  print(f"::error::«{r['قسمة']}»: مشتقٌّ {r['مشتقّ']} · منصوصٌ "
                        f"{r['منصوص']} · مسرودٌ {len(r['أقسام'])} — عددٌ لا يُصادِق")
                  sys.exit(1)
          # ② والاشتقاقُ محسوبٌ فعلًا: تُقلَّم العقدةُ الأخيرةُ من كلِّ شجرةٍ ذاتِ
          #    عقدتين فأكثر، فإن لم يتغيّر العددُ فالشجرةُ زينةٌ والعددُ مكتوبٌ بيدٍ.
          for name, q in AG.QISMAT.items():
              tree = q["شجرة"]
              if len(tree) < 2:
                  continue
              trimmed = [dict(n, فروع=[f for f in n["فروع"]
                                       if not (f[0] == "عقدة" and f[1] >= len(tree) - 1)])
                         for n in tree[:-1]]
              if AG.derive(trimmed)[0] == AG.derive(tree)[0]:
                  print(f"::error::«{name}»: قَلْمُ عقدةٍ لم يغيّر العددَ — اشتقاقٌ صوريّ")
                  sys.exit(1)
          # ③ ولا فصلَ ولا قسمَ بلا شاهدٍ من بايتات بابه — وهذا ما يمنع أن نَنسِب
          #    إليه قسمةً من عندنا.
          if M["فصولٌ منصوصةٌ في المتن"] != M["عقدُ الفصول"] \
             or M["أقسامٌ لها شاهدٌ في بابها"] != M["أقسامٌ مشتقّة"]:
              print("::error::فصلٌ أو قسمٌ بلا شاهدٍ في بايتات بابه — نسبةٌ بلا نصّ")
              sys.exit(1)
          # ④ **النقلُ لا يَحكُم**: محورُ التواتر يجب أن يكون منقسمًا (فيه المتواترُ
          #    وما دونه) وأن تبقى القسماتُ الثلاثُ قائمةً بالاشتقاق مع ذلك. فلو
          #    صارت الأسماءُ كلُّها في جانبٍ واحدٍ لَما ميّز المحورُ شيئًا، ولو
          #    تبعت القسماتُ التواترَ لصار النقلُ حَكَمًا من حيث لا نشعر.
          if not (M["أسماءٌ متواترة"] and M["أسماءٌ دون الحدّ"]) \
             or M["أسماءٌ متواترة"] + M["أسماءٌ دون الحدّ"] != M["أقسامٌ مشتقّة"]:
              print("::error::محورُ النقل غيرُ منقسمٍ أو لا يستوعب الأقسامَ — عدٌّ مختلّ")
              sys.exit(1)
          madlul = [r for r in Q["محورُ_النقل"]["أسماء"] if r["قسمة"] == "المدلولُ وحدَه"]
          if any(r["متواتر"] for r in madlul) \
             or not [r for r in Q["القسمات"] if r["قسمة"] == "المدلولُ وحدَه"][0]["صادقَ_الاشتقاق"]:
              print("::error::قسمةُ المدلولِ وحدَه: لو تبعت التواترَ لسقطت — والفيصلُ الاشتقاق")
              sys.exit(1)
          # ⑤ والمقسَمُ واحدٌ والحيثياتُ متمايزةٌ — وإلا فليست قسماتٍ لشيءٍ واحد.
          if M["مقسَمٌ واحد"] != 1 or len({r["حيثية"] for r in Q["القسمات"]}) != M["قسمات"]:
              print("::error::المقسَمُ تبدّل أو حيثيتان اتّحدتا — قسمةٌ مختلّة")
              sys.exit(1)
          # ⑥ ومحاولاتُ التكذيب بعدَّتها المختومة، ولم تنجح واحدةٌ منها.
          t = Q["محاولاتُ_التكذيب"]
          if len(t) != M["محاولاتُ_تكذيب"] or any(x["نجحت"] for x in t):
              print("::error::محاولاتُ التكذيب نقصت أو نجحت واحدةٌ منها — البابُ ساقط")
              sys.exit(1)
          # ⑦ والمعذورون يبقون معلنين باسمهم — فغيابُ إمامٍ لا يُطوى بحذف سطره.
          if len(Q["محورُ_النقل"]["معذورون"]) != M["معذورون"] or not M["معذورون"]:
              print("::error::المعذورون طُوُوا — وغيابُ الشاهد يُعلَن ولا يُحذَف")
              sys.exit(1)
          # ⑧ **البرهانُ حاكمٌ على «الدالِّ وحدَه»، والشواهدُ تُعين ولا تَحكُم.**
          #    وهذا الحارسُ يمنع أربعةَ أوجهٍ من الغشِّ لا وجهًا واحدًا:
          B = Q["برهانُ_الدالِّ_وحدَه"]
          real = [r for r in B["رتب"] if not r["مصنوعة"]]
          fab = [r for r in B["رتب"] if r["مصنوعة"]]
          #    (أ) حَكَمٌ لا يفصل ختمٌ يُمرِّر ما يُعرَض. فلا بدّ أن يقوم بعضٌ ويسقط بعض.
          if len({r["حكم"] for r in real}) < 2 \
             or M["رتبٌ مُودَعةٌ بالبرهان"] + M["رتبٌ مردودةٌ بالبرهان"] != M["رتبُ الدالِّ وحدَه"]:
              print("::error::الفاتورةُ لم تفصل بين رتب الدالِّ — حَكَمٌ يُمرِّر كلَّ ما يُعرَض")
              sys.exit(1)
          #    (ب) ولا حكمَ يُشترى بدرجٍ منتقًى: الأدراجُ معلنةٌ، والحكمُ واحدٌ فيها.
          if list(B["سلّم"]) != list(AG.RUNGS) \
             or M["أحكامٌ مستقرّةٌ على السلّم"] != M["رتبُ الدالِّ وحدَه"] \
             or any(not r["حكمٌ_مستقرّ"] for r in B["رتب"]):
              print("::error::حكمُ رتبةٍ تقلّب بأدراج السلّم — نتيجةٌ مشتراةٌ بدرج")
              sys.exit(1)
          #    (ج) والرتبةُ المصنوعةُ تُردُّ بالمكيال نفسِه لا بأنّا لم ننسبها إلى إمام.
          if not fab or any(r["حكم"] == "مُودَعةٌ بالبرهان" for r in fab) \
             or M["الرتبةُ المصنوعةُ مردودةٌ في الأدراج"] != len(AG.RUNGS):
              print("::error::الرتبةُ المصنوعةُ قامت — حَكَمٌ يقبل ما لا حدَّ له في المتن")
              sys.exit(1)
          #    (د) **وهذا لبُّ الأمر**: الشواهدُ تُعين ولا تَحكُم. فإعانتُها تُقاس
          #        (مكسبٌ موجبٌ في المُودَعتين)، وحُكمُها يُنفى: لو وافقت إشارةُ
          #        المكسب الحكمَ في الأدراج كلِّها لالتبس المحوران ولوجب الصريخ.
          gains = [(r["حكم"] == "مُودَعةٌ بالبرهان", d["مكسبُ_الشواهد"] > 0)
                   for r in B["رتب"] for d in r["أدراج"]]
          won = sum(1 for r in real if r["حكم"] == "مُودَعةٌ بالبرهان"
                    for d in r["أدراج"] if d["مكسبُ_الشواهد"] > 0)
          if won != M["مكسبُ الشواهد موجبٌ في المُودَعتين"] \
             or won != M["رتبٌ مُودَعةٌ بالبرهان"] * len(AG.RUNGS):
              print("::error::إعانةُ الشواهد لم تُقَس أو لم تهزم المصادفةَ — دعوى بلا رقم")
              sys.exit(1)
          if len({a == b for a, b in gains}) < 2:
              print("::error::مكسبُ الشواهد يوافق الحكمَ في كلِّ درج — الشواهدُ تَحكُم")
              sys.exit(1)
          for r in B["رتب"]:
              rungs = " · ".join(f"k={d['درج']}: Δ={d['Δ']:+,.1f}"
                                 f" مكسب={d['مكسبُ_الشواهد']:+,.1f}" for d in r["أدراج"])
              print(f"  {r['رتبة']}: {r['حكم']} — {rungs}")
          print(f"بابُ الأقسام: {M['قسمات']} قسماتٍ · {M['عقدُ الفصول']} عقدةَ فصلٍ "
                f"⟶ {M['أقسامٌ مشتقّة']} قسمًا مشتقًّا "
                f"({' + '.join(str(r['مشتقّ']) for r in Q['القسمات'])}) صادقَ "
                f"منصوصَها {M['قسماتٌ صادقَ اشتقاقُها منصوصَها']}/{M['قسمات']} · "
                f"محورُ النقل {M['أسماءٌ متواترة']} متواترةً و{M['أسماءٌ دون الحدّ']} "
                f"دونه ولا يمسُّ حكمًا · برهانُ الدالِّ وحدَه: مُودَعةٌ "
                f"{M['رتبٌ مُودَعةٌ بالبرهان']} ومردودةٌ {M['رتبٌ مردودةٌ بالبرهان']} "
                f"بالفاتورة وحدَها · محاولاتُ التكذيب {len(t)} ✓")
          PY

      - name: بابُ المحاور — ديوانُ الدالِّ وحدَه وشرطُ إمكان المدلول، ومصادمة mihwar_v0.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ الباب
          # البابُ يقرأ جدولَ المقاييس ليقيسَ ثمنَه **قبل** أن يُستعمَل، ويسقط
          # بالمخرج 3 إن غاب — فلا يُقدَّر ثمنٌ لغائبٍ ولا يُفتَح المحورُ الثاني
          # على جدولٍ لم يُقرَأ. والجدولُ مجلوبٌ سلفًا في خطوةِ «شهودُ الخارج»،
          # لأنّ سجلَّ الأختام يعيد تشغيلَ هذا المولِّد قبل خطوةِ الإثراء.
          ./fetch_maqayis.sh
          python mihwar_gate.py --json /tmp/mihwar.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("mihwar_v0.json", encoding="utf-8"))
          b = json.load(open("/tmp/mihwar.json", encoding="utf-8"))
          if a != b:
              print("::error::mihwar_v0.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          A = a["المحاور_v0"]; M = A["مقيس"]
          t = A["محاولاتُ_التكذيب"]

          # ① دعوى الانغلاق: كلُّ بندٍ مسعَّرٍ في الديوان على الصورة وحدَها.
          if M["بنودٌ في الدالِّ وحدَه"] != M["بنودُ الديوان"]:
              print("::error::بندٌ مسعَّرٌ خارجَ «الدالِّ وحدَه» — دعوى الانغلاق سقطت")
              sys.exit(1)

          # ② كلُّ بندٍ يُسمّي ختمًا قائمًا وقيمتُه مقروءةٌ من وديعته لا مكتوبةٌ هنا.
          if any("قيمة" not in r or "ختم" not in r for r in A["الديوان"]["بنود"]):
              print("::error::بندٌ في الديوان بلا ختمٍ مسمًّى أو بلا قيمةٍ مقروءة")
              sys.exit(1)

          # ③ الدَّينُ يُسمّى ولا يُسعَّر: لا رقمَ في أيِّ حقلٍ من حقول دَين.
          if M["ديونٌ بلا رقم"] != M["ديونٌ مسمّاة"] or M["ديونٌ مسمّاة"] < 1:
              print("::error::دَينٌ حمل رقمًا أو طُوِيت الديون — ما لم يُختَم لا يُسعَّر")
              sys.exit(1)

          # ④ الترتيب: لا محورَ يُفتَح وقبلَه مغلق، ولا يُسعَّر بتٌّ في محورٍ مغلق.
          opened = [x["مفتوح"] for x in A["المحاور"]]
          if sorted(opened, reverse=True) != opened:
              print("::error::محورٌ فُتح وقبلَه محورٌ مغلق — ترتيبٌ قُفِز")
              sys.exit(1)
          live = {x["محور"] for x in A["المحاور"] if x["مفتوح"]}
          if any(r["محور"] not in live for r in A["الديوان"]["بنود"]):
              print("::error::بتٌّ سُعِّر في محورٍ لم يُفتَح بعد")
              sys.exit(1)

          # ⑤ الجدولُ المجّانيّ: مرجعٌ حاضرٌ بلا ثمنٍ موجبٍ مقيسٍ = ربحٌ مسروق.
          pr = A["ثمنُ_المرجع"]
          if M["مراجعُ مختومةٌ حاضرة"] < 1 or pr["ثمنُ_الخريطة_بتًّا"] <= 0:
              print("::error::مرجعٌ يُفتَح بلا ثمنٍ مقيسٍ لجدوله — ربحٌ مسروق")
              sys.exit(1)

          # ⑥ محاولاتُ التكذيب تُشغَّل ولا تُقرَأ.
          if not t or any(x["نجحت"] for x in t):
              print("::error::محاولةُ تكذيبٍ نجحت في باب المحاور — صريخ")
              sys.exit(1)

          for x in A["المحاور"]:
              print(f"  {x['رتبة']}. {x['محور']}: " + ("مفتوح" if x["مفتوح"] else "مغلق"))
          print(f"بابُ المحاور: {M['محاور']} محاورَ ({M['محاورُ مفتوحة']} مفتوحًا · "
                f"{M['محاورُ مغلقة']} مغلقًا) · ديوانٌ {M['بنودُ الديوان']} بندًا كلُّها "
                f"على الصورة وحدَها · ديونٌ {M['ديونٌ مسمّاة']} مسمّاةً بلا رقم · "
                f"مراجعُ {M['مراجعُ مُعلَنة']} معلنًا و{M['مراجعُ مختومةٌ حاضرة']} مختومًا "
                f"حاضرًا بثمنٍ {pr['ثمنُ_الخريطة_بتًّا']:,.1f} بتًّا · "
                f"محاولاتُ التكذيب {len(t)} ✓")
          PY

      - name: محرّكُ الربط — الأسبابُ الاثنا عشر بمقامَيها، ومصادمة jumla_links.json
        run: |
          set -euo pipefail          # بلا pipefail يبتلع `| tee` سقوطَ المحرّك
          python jumla_links.py --json /tmp/jumla_links.json | tee -a measurement.txt
          python - <<'PY'
          import json, sys
          a = json.load(open("jumla_links.json", encoding="utf-8"))
          b = json.load(open("/tmp/jumla_links.json", encoding="utf-8"))
          if a != b:
              print("::error::jumla_links.json المودَع خالف ما يُنتجه المحرّك — صريخ")
              sys.exit(1)
          print("jumla_links.json مُعاد الإنتاج بفارق صفر ✓")
          R = a["الربط_v0"]
          W, C = R["مقامات"]["داخل_الآية"], R["مقامات"]["العبور"]
          # المقامان لا يُجمَعان: لكلٍّ عدُّه ومصالحتُه، وأزواجُ العبور 6,235 بنصِّ التسجيل.
          if C["حدود"] != 6235:
              print(f"::error::أزواجُ العبور ليست 6,235 بل {C['حدود']} — صريخ")
              sys.exit(1)
          for name, t in (("داخل الآية", W), ("العبور", C)):
              if t["مصنَّف"] + t["معلَّق"] != t["حدود"] \
                 or sum(t["أجناسُ_المتبقّي"].values()) != t["معلَّق"]:
                  print(f"::error::مصالحةُ «{name}» خُولفت — صريخ")
                  sys.exit(1)
              # الشرطُ الثاني المختوم: لا موضعَ بلا جنسٍ مسمًّى — و«غيرُ ذلك» صفرٌ أو سقط.
              if t["غيرُ_المسمّى"]:
                  print(f"::error::متبقٍّ غيرُ مسمًّى في «{name}»: {t['غيرُ_المسمّى']} — صريخ")
                  sys.exit(1)
          # حكمُ التسجيل المسبق يُعرَض بنصّه ولا يُخفى — والسقوطُ المسمّى نتيجةٌ تُودَع.
          print(f"حكمُ التسجيل المسبق لمحرّك الربط: {R['preregistration']}")
          # حارسُ التاريخ: الحكمُ الساقطُ يبقى ساقطًا بأرقامه، ولا يُرفَع بجولةٍ تالية.
          if not R["preregistration"].startswith("سقط"):
              print("::error::حكمُ محرّك الربط انقلب عن سقوطه بلا جولةٍ مسجَّلة — صريخ")
              sys.exit(1)
          if "0.3289" not in R["preregistration"] or "0.3416" not in R["preregistration"]:
              print("::error::أرقامُ حكم محرّك الربط المجمَّدة تبدّلت — صريخ")
              sys.exit(1)
          # العطفُ ليس سببًا: تعليقُه معدودٌ بجنسه، ولا يدخل تغطيةً بحالٍ من الأحوال.
          if any(r not in R["أسبابٌ_معلنة"] for r in W["أسباب"]) or len(R["أسبابٌ_معلنة"]) != 12:
              print("::error::الأسبابُ ليست الاثني عشر المعلنة — صريخ")
              sys.exit(1)
          if W["تغطية"] * W["حدود"] < W["مصنَّف"] - 1:
              print("::error::التغطيةُ لا تُصالِح المصنَّف — صريخ")
              sys.exit(1)
          print("المقامان معدودان مستقلّين، والمتبقّي مسمًّى كلُّه بأجناسه ✓")
          # ═══ الجولة ٢: المُعادُ تبويبُه لا يرفع حكمًا، والمقيسُ يُحرَس بفواصله ═══
          S2 = R["الجولة_٢"]
          # ⓪ حارسُ التاريخ الثاني: تغطيةُ الأسباب المختومة لا تنقلب بعرضٍ أُعلن بعدها.
          for name, t, sealed in (("داخل_الآية", W, 0.3289), ("العبور", C, 0.3416)):
              w = S2["عطفٌ_واصل"][name]
              if t["تغطية"] != sealed or w["تغطيةُ_الأسباب_المختومة"] != sealed:
                  print(f"::error::حكمُ الجولة ١ في «{name}» انقلب عن {sealed} — صريخ")
                  sys.exit(1)
              if w["بالأسباب"] != t["مصنَّف"] or w["مجموع"] != w["بالأسباب"] + w["عطفٌ_واصل"]:
                  print(f"::error::مصالحةُ المُعاد تبويبِه في «{name}» خُولفت — صريخ")
                  sys.exit(1)
          # ① المقامان يُعرَضان معًا، والفرعيُّ مصالَحٌ بالخام — لا تضييقَ انتقائيًّا للبسط.
          s = S2["مقامُ_العبور_مرّتين"]
          if s["المقامُ_الفرعيّ"] + s["صدورُ_الفيات"] != C["حدود"] \
             or s["فيات_نالت_سببًا"] + s["فيات_معلَّقة"] != s["صدورُ_الفيات"]:
              print("::error::مصالحةُ المقام الفرعيّ بالخام خُولفت — صريخ")
              sys.exit(1)
          if s["المقامُ_الفرعيّ"] != 3195 or s["بديلٌ_مرفوض"]["رقم"] != 4334:
              print("::error::المقامُ الفرعيُّ المجمَّد أو بديلُه المرفوض تبدّل — صريخ")
              sys.exit(1)
          # ② البابان يستغرقان الجنسَ، وحارسُ النزاهة فوقهما في المقامين.
          for name, t in (("داخل_الآية", W), ("العبور", C)):
              d = S2["أبوابُ_الاسميّ"][name]
              if sum(d["أبواب"].values()) != d["جنسٌ_مستهدَف"] \
                 or d["جنسٌ_مستهدَف"] != t["أجناسُ_المتبقّي"].get("صدرٌ اسميٌّ بلا قرينة", 0):
                  print(f"::error::بابا «الاسميِّ بلا قرينة» لا يُصالِحان «{name}» — صريخ")
                  sys.exit(1)
              g = d["حارسُ_النزاهة"]
              if g["كانت_مفسَّرة"] + g["كانت_معلَّقة"] != g["مطابقاتُ_القيد"]:
                  print(f"::error::مطابقاتُ القيد في «{name}» لا تُعَدّ صنفين — صريخ")
                  sys.exit(1)
              if g["نسبة"] < g["فاصل"]:
                  print(f"::error::كاشفُ الباب في «{name}» مفصَّلٌ على العتبة "
                        f"({g['نسبة']}) — صريخ")
                  sys.exit(1)
          # ⑤ حكمُ الجولة ٢ يُعرَض بنصّه، وسقوطُه محروسٌ بحارس تاريخٍ من يومه.
          print(f"حكمُ الجولة ٢ لمحرّك الربط: {S2['حكم']}")
          if not S2["حكم"].startswith("سقط") or "53" not in S2["حكم"]:
              print("::error::حكمُ الجولة ٢ الساقطُ انقلب أو تبدّل رقمُه — صريخ")
              sys.exit(1)
          print("الجولة ٢ ✓ — مُعادُ تبويبٍ [شاهد] بلا فاصل · مقامان معًا · بابٌ ساقطٌ باسمه")
          # ═══ الجولة ٣: بابُ شبه الجملة — حكمُه ساقطٌ مودَعٌ، والشاهدُ لا يُحتسَب ═══
          S3 = R["الجولة_٣"]
          d3 = S3["بابُ_شبهِ_الجملة"]
          # البابُ يستغرق جنسَه، ويُصالِح عدَّ الجولة ١ — لا تضييقَ انتقائيًّا للبسط.
          if d3["مفسَّرٌ_بالباب"] + d3["باقٍ_بلا_قرينة"] != d3["جنسٌ_مستهدَف"] \
             or d3["جنسٌ_مستهدَف"] != C["أجناسُ_المتبقّي"].get("صدرُ آيةٍ بلا قرينة", 0):
              print("::error::بابُ شبهِ الجملة لا يُصالِح جنسَه في «العبور» — صريخ")
              sys.exit(1)
          # قيدُ الإثبات مُضيِّقٌ لا موسِّع: المُثبَتُ لا يتجاوز الصورةَ بحال.
          if d3["مفسَّرٌ_بالباب"] > d3["عددٌ_بالصورة_لا_يُحتسَب"]["قيمة"]:
              print("::error::المُثبَتُ تجاوز الصورةَ — قيدُ الإثبات انقلب، صريخ")
              sys.exit(1)
          # حارسُ النزاهة: مطابقاتُ القيد صنفان، والنسبةُ فوق فاصلها أو رُدّ الباب.
          g3 = d3["حارسُ_النزاهة"]
          if g3["كانت_مفسَّرة"] + g3["كانت_معلَّقة"] != g3["مطابقاتُ_القيد"]:
              print("::error::مطابقاتُ قيد الجولة ٣ لا تُعَدّ صنفين — صريخ")
              sys.exit(1)
          if g3["نسبة"] < g3["فاصل"]:
              print(f"::error::قيدُ بابِ شبهِ الجملة مفصَّلٌ على المتبقّي "
                    f"({g3['نسبة']}) — صريخ")
              sys.exit(1)
          # **شرطُ القبول**: «حضورٌ لا تعلُّق» [شاهدٌ] في خانة العرض لا الحكم — فميلٌ
          # ببايتةٍ واحدةٍ نحو احتسابه تغطيةً يُسقط البناء، ولا يُنتظَر به مراجع.
          for st, t in (("داخل_الآية", W), ("العبور", C)):
              w3 = S3["حضورٌ_لا_تعلُّق"][st]
              if w3["حدود"] != t["حدود"]:
                  print(f"::error::شاهدُ «{st}» بُنِيَ على غير حدوده — صريخ")
                  sys.exit(1)
              if not isinstance(w3["تغطيةٌ_مزعومةٌ_لو_احتُسب"], str):
